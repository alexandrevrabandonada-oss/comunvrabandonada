name: COMUN 48.2-B sidewalk observatory activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string
      mode:
        description: Preserve 48.2-A with analytics off or activate reviewed-only analytics
        required: true
        type: choice
        options: [flags-off, wave1-sidewalk-analytics]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online
  COMUN_48_2_B_BASELINE_SHA: d399ee0611773ed8e87cedb6a6a640413419b085

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact main and zero-migration scope
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$COMUN_48_2_B_BASELINE_SHA" HEAD
          test -z "$(git diff --name-only "$COMUN_48_2_B_BASELINE_SHA"...HEAD -- supabase/migrations)" || {
            echo COMUN_48_2_B_BLOCKED_UNEXPECTED_MIGRATION >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo COMUN_48_2_B_ZERO_MIGRATION_GATE_GREEN >> "$GITHUB_STEP_SUMMARY"

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for Wave 1 read-only browser proof
        if: inputs.mode == 'wave1-sidewalk-analytics'
        run: npx playwright install --with-deps chromium

      - name: Verify canonical Vercel project binding read-only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          classify_error() {
            local command_name="$1" exit_code="$2" error_file="$3" error_class=unknown
            if grep -Eqi 'unauthorized|invalid token|authentication|token' "$error_file"; then
              error_class=auth
            elif grep -Eqi 'project.*(not found|not linked)|project id|no project' "$error_file"; then
              error_class=project_binding
            elif grep -Eqi 'forbidden|permission|not authorized' "$error_file"; then
              error_class=permission
            elif grep -Eqi 'ENOTFOUND|ECONN|network|timeout|TLS' "$error_file"; then
              error_class=network
            elif grep -Eqi 'vercel|npm|node' "$error_file"; then
              error_class=cli
            fi
            printf 'command=%s\nexitCode=%s\nerrorClass=%s\n' "$command_name" "$exit_code" "$error_class" >> "$GITHUB_STEP_SUMMARY"
          }
          test -n "${VERCEL_TOKEN:-}"
          output="$(mktemp)"; errors="$(mktemp)"
          set +e
          npx --yes vercel@50.28.0 project inspect "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$errors"
          status=$?
          set -e
          rm -f "$output"
          if [ "$status" -ne 0 ]; then
            classify_error project_inspect "$status" "$errors"
            rm -f "$errors"
            echo COMUN_48_2_B_BLOCKED_VERCEL_PROJECT_BINDING >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          rm -f "$errors"
          echo COMUN_48_2_B_VERCEL_PROJECT_BINDING_GREEN >> "$GITHUB_STEP_SUMMARY"

      - name: Set flags, deploy exact main, and prove Production read-only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          flags_started=false
          rollback_complete=false

          classify_error() {
            local command_name="$1" exit_code="$2" error_file="$3" error_class=unknown
            if grep -Eqi 'unauthorized|invalid token|authentication|token' "$error_file"; then
              error_class=auth
            elif grep -Eqi 'project.*(not found|not linked)|project id|no project' "$error_file"; then
              error_class=project_binding
            elif grep -Eqi 'forbidden|permission|not authorized' "$error_file"; then
              error_class=permission
            elif grep -Eqi 'ENOTFOUND|ECONN|network|timeout|TLS' "$error_file"; then
              error_class=network
            elif grep -Eqi 'vercel|npm|node|playwright|chromium' "$error_file"; then
              error_class=runtime
            fi
            printf 'command=%s\nexitCode=%s\nerrorClass=%s\n' "$command_name" "$exit_code" "$error_class" >> "$GITHUB_STEP_SUMMARY"
          }

          set_vercel_flag() {
            local name="$1" value="$2" output errors status
            output="$(mktemp)"; errors="$(mktemp)"
            if printf '%s' "$value" | npx --yes vercel@50.28.0 env add "$name" production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$errors"; then
              status=0
            else
              status=${PIPESTATUS[1]}
            fi
            rm -f "$output"
            if [ "$status" -ne 0 ]; then
              classify_error "env_add_${name}" "$status" "$errors"
              rm -f "$errors"
              return "$status"
            fi
            rm -f "$errors"
          }

          run_vercel() {
            local command_name="$1"; shift
            VERCEL_LAST_OUTPUT="$(mktemp)"
            VERCEL_LAST_ERRORS="$(mktemp)"
            if "$@" >"$VERCEL_LAST_OUTPUT" 2>"$VERCEL_LAST_ERRORS"; then
              VERCEL_LAST_STATUS=0
            else
              VERCEL_LAST_STATUS=$?
            fi
            if [ "$VERCEL_LAST_STATUS" -ne 0 ]; then
              classify_error "$command_name" "$VERCEL_LAST_STATUS" "$VERCEL_LAST_ERRORS"
              rm -f "$VERCEL_LAST_OUTPUT" "$VERCEL_LAST_ERRORS"
              return "$VERCEL_LAST_STATUS"
            fi
            rm -f "$VERCEL_LAST_ERRORS"
          }

          deploy_promote_and_alias() {
            local deployment_url
            run_vercel deploy npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || return $?
            deployment_url="$(grep -Eo 'https://[^[:space:]]+' "$VERCEL_LAST_OUTPUT" | tail -n 1 | tr -d '\r')"
            rm -f "$VERCEL_LAST_OUTPUT"
            case "$deployment_url" in
              https://*.vercel.app) ;;
              *) printf 'command=deploy\nexitCode=1\nerrorClass=unknown\n' >> "$GITHUB_STEP_SUMMARY"; return 1 ;;
            esac
            run_vercel inspect npx --yes vercel@50.28.0 inspect "$deployment_url" --wait --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || return $?
            rm -f "$VERCEL_LAST_OUTPUT"
            run_vercel promote npx --yes vercel@50.28.0 promote "$deployment_url" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || return $?
            rm -f "$VERCEL_LAST_OUTPUT"
            run_vercel alias npx --yes vercel@50.28.0 alias set "$deployment_url" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" || return $?
            rm -f "$VERCEL_LAST_OUTPUT"
          }

          restore_48_2_a_baseline() {
            set +e
            set_vercel_flag COMUN_OBSERVATORIES_FOUNDATION_ENABLED enabled
            foundation_status=$?
            set_vercel_flag COMUN_OBSERVATORY_SIDEWALK_ADAPTER_ENABLED enabled
            adapter_status=$?
            set_vercel_flag COMUN_OBSERVATORY_SIDEWALK_ANALYTICS_ENABLED disabled
            analytics_status=$?
            if [ "$foundation_status" -ne 0 ] || [ "$adapter_status" -ne 0 ] || [ "$analytics_status" -ne 0 ]; then
              set -e
              return 1
            fi
            deploy_promote_and_alias
            deploy_status=$?
            set -e
            if [ "$deploy_status" -ne 0 ]; then return 1; fi
            rollback_complete=true
            echo COMUN_48_2_B_ROLLED_BACK_TO_48_2_A_BASELINE >> "$GITHUB_STEP_SUMMARY"
          }

          fail_after_flag_write() {
            local failure_status="$1"
            if ! restore_48_2_a_baseline; then
              echo COMUN_48_2_B_BLOCKED_VERCEL_ROLLBACK_REQUIRED >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$failure_status"
          }

          unexpected_failure() {
            local failure_status="$?"
            trap - ERR
            if [ "$flags_started" = true ] && [ "$rollback_complete" != true ]; then
              if ! restore_48_2_a_baseline; then
                echo COMUN_48_2_B_BLOCKED_VERCEL_ROLLBACK_REQUIRED >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            exit "$failure_status"
          }
          trap unexpected_failure ERR

          test -n "${VERCEL_TOKEN:-}"
          test -n "${VERCEL_ORG_ID:-}"
          test -n "${VERCEL_PROJECT_ID:-}"
          analytics=disabled
          case "$MODE" in
            flags-off) ;;
            wave1-sidewalk-analytics) analytics=enabled ;;
            *) echo COMUN_48_2_B_ACTIVATION_MODE_INVALID >> "$GITHUB_STEP_SUMMARY"; exit 1 ;;
          esac

          flags_started=true
          set_vercel_flag COMUN_OBSERVATORIES_FOUNDATION_ENABLED enabled || fail_after_flag_write $?
          set_vercel_flag COMUN_OBSERVATORY_SIDEWALK_ADAPTER_ENABLED enabled || fail_after_flag_write $?
          set_vercel_flag COMUN_OBSERVATORY_SIDEWALK_ANALYTICS_ENABLED "$analytics" || fail_after_flag_write $?
          deploy_promote_and_alias || fail_after_flag_write $?

          for path in /comun /comun/relatar /comun/minha-participacao /comun/calcadas /comun/onibus /comun/observatorios; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL$path")" = 200 || fail_after_flag_write 1
          done
          registry_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL/api/comun/observatorios")"
          sidewalk_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL/api/comun/observatorios/calcadas")"
          dedicated_status="$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL/comun/observatorios/calcadas")"
          test "$registry_status" = 200 && test "$sidewalk_status" = 200 || fail_after_flag_write 1

          registry_body="$(mktemp)"
          sidewalk_body="$(mktemp)"
          curl -L -fsS --retry 8 --retry-delay 2 "$COMUN_BASE_URL/api/comun/observatorios" >"$registry_body" || fail_after_flag_write 1
          curl -L -fsS --retry 8 --retry-delay 2 "$COMUN_BASE_URL/api/comun/observatorios/calcadas" >"$sidewalk_body" || fail_after_flag_write 1

          case "$MODE" in
            flags-off)
              test "$dedicated_status" = 404 || fail_after_flag_write 1
              node - "$registry_body" "$sidewalk_body" <<'NODE' || validation_status=$?
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const sidewalk = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const entry = registry.observatories?.find((item) => item.id === 'sidewalks');
          if (!entry || entry.status !== 'available' || entry.publicRoute !== '/comun/calcadas') process.exit(1);
          if (sidewalk.observatoryId !== 'sidewalks' || !Array.isArray(sidewalk.indicators) || !Array.isArray(sidewalk.observations)) process.exit(1);
          if ('coverage' in sidewalk || 'facets' in sidewalk) process.exit(1);
          if (sidewalk.source?.sourceKind !== 'reviewed_community_projection' || sidewalk.source?.publicSafe !== true) process.exit(1);
          const serialized = JSON.stringify(sidewalk);
          for (const sentinel of ['PRIVATE_SIDEWALK_TEXT_SENTINEL','PRIVATE_EXACT_LOCATION_SENTINEL','PRIVATE_ATTACHMENT_SENTINEL','PRIVATE_WALLET_SENTINEL']) {
            if (serialized.includes(sentinel)) process.exit(1);
          }
          NODE
              test "${validation_status:-0}" = 0 || fail_after_flag_write "$validation_status"
              echo COMUN_48_2_B_FLAGS_OFF_PRODUCTION_48_2_A_GREEN >> "$GITHUB_STEP_SUMMARY"
              ;;
            wave1-sidewalk-analytics)
              test "$dedicated_status" = 200 || fail_after_flag_write 1
              node - "$registry_body" "$sidewalk_body" <<'NODE' || validation_status=$?
          const fs = require('node:fs');
          const registry = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const payload = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const entry = registry.observatories?.find((item) => item.id === 'sidewalks');
          if (!entry || entry.status !== 'available' || entry.publicRoute !== '/comun/observatorios/calcadas') process.exit(1);
          if (payload.observatoryId !== 'sidewalks' || !payload.coverage || !payload.indicators || !payload.facets || !Array.isArray(payload.observations)) process.exit(1);
          if (!['complete_for_public_projection','partial_due_to_safety_cap'].includes(payload.coverage.state)) process.exit(1);
          if (payload.coverage.loadedCount !== payload.observations.length || payload.indicators.reviewedPointCount !== payload.observations.length) process.exit(1);
          if (payload.source?.sourceKind !== 'reviewed_community_projection' || payload.source?.publicSafe !== true || payload.source?.automaticPublicationAllowed !== false) process.exit(1);
          const allowedConditions = new Set(['good','regular','bad','terrible','unknown']);
          const allowedProblems = new Set(['hole','irregular','no_ramp','obstacle','narrow','no_sidewalk']);
          const conditionSum = Object.values(payload.indicators.conditionCounts ?? {}).reduce((sum, value) => sum + value, 0);
          if (conditionSum !== payload.observations.length) process.exit(1);
          for (const observation of payload.observations) {
            if (observation.observatoryId !== 'sidewalks' || observation.kind !== 'sidewalk_condition') process.exit(1);
            if (observation.geography?.level !== 'reviewed_public_point' || observation.geography?.geometry?.type !== 'Point') process.exit(1);
            const coordinates = observation.geography.geometry.coordinates;
            if (!Array.isArray(coordinates) || coordinates.length !== 2 || coordinates.some((value) => !Number.isFinite(value))) process.exit(1);
            if (!allowedConditions.has(observation.attributes?.condition)) process.exit(1);
            if (!Array.isArray(observation.attributes?.problems) || observation.attributes.problems.some((problem) => !allowedProblems.has(problem))) process.exit(1);
          }
          for (const [problem, expected] of Object.entries(payload.indicators.problemCounts ?? {})) {
            if (!allowedProblems.has(problem)) process.exit(1);
            const actual = payload.observations.filter((observation) => observation.attributes.problems.includes(problem)).length;
            if (actual !== expected) process.exit(1);
          }
          for (const facet of payload.facets.problems ?? []) {
            if (!allowedProblems.has(facet.value) || !(facet.count > 0) || facet.count !== payload.indicators.problemCounts[facet.value]) process.exit(1);
          }
          const serialized = JSON.stringify(payload);
          for (const forbidden of [
            'PRIVATE_SIDEWALK_TEXT_SENTINEL','PRIVATE_EXACT_LOCATION_SENTINEL','PRIVATE_ATTACHMENT_SENTINEL','PRIVATE_WALLET_SENTINEL',
            'private_geometry_geojson','original_text','report_id','case_id','account_id','forwarding_status','participation_wallet'
          ]) {
            if (serialized.toLowerCase().includes(forbidden.toLowerCase())) process.exit(1);
          }
          NODE
              test "${validation_status:-0}" = 0 || fail_after_flag_write "$validation_status"
              COMUN_BASE_URL="$COMUN_BASE_URL" node scripts/observatories/verify-sidewalk-observatory-production.mjs || fail_after_flag_write $?
              echo COMUN_48_2_B_WAVE1_PRODUCTION_REVIEWED_ONLY_GREEN >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          rm -f "$registry_body" "$sidewalk_body"

          for method in POST PUT PATCH DELETE; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' -X "$method" "$COMUN_BASE_URL/api/comun/observatorios/calcadas")" = 405 || fail_after_flag_write 1
          done
          echo businessWrites=0 >> "$GITHUB_STEP_SUMMARY"
          echo autoPublication=off >> "$GITHUB_STEP_SUMMARY"
          echo COMUN_48_2_B_PRODUCTION_READ_ONLY_PROOF_GREEN >> "$GITHUB_STEP_SUMMARY"
