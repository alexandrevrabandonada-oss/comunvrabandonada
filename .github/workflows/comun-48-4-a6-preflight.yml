name: COMUN 48.4-A6 remote read-only preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-48-4-a6-*.yml"
      - "app/comun/cooperativas/**"
      - "components/comun-solidarity-organization-profile-form.tsx"
      - "lib/comun-solidarity-organization-profile*.ts"
      - "lib/server/comun-solidarity-organization-profile.ts"
      - "supabase/migrations/*_comun_solidarity_organization_profile_self_management.sql"
      - "scripts/economy/run-48-4-a6-production-wave.sh"

permissions: { contents: read }

jobs:
  remote-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIGRATION: supabase/migrations/20260817012247_comun_solidarity_organization_profile_self_management.sql
      EXTERNAL_MIGRATION: supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: supabase/setup-cli@v1
        with: { version: 2.114.0 }
      - name: Inspect only metadata, constraints and privileges
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          mkdir -p .ci-artifacts/48-4-a6-preflight
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/48-4-a6-preflight/schema.json <<'SQL'
          begin read only;
          select json_build_object(
            'transactionReadOnly',current_setting('transaction_read_only')='on',
            'organizationRoot',to_regclass('public.comun_territorial_organizations') is not null,
            'organizationFields',(select count(*)=13 from information_schema.columns where table_schema='public' and table_name='comun_territorial_organizations' and column_name in ('territory_id','public_name','organization_type','status','verification_status','last_verified_at','presentation_public','services_public','service_territory_public','public_contact_authorized','private_contact','internal_notes','updated_at')),
            'territoryEligibilityFields',(select count(*)=4 from information_schema.columns where table_schema='public' and table_name='comun_hub_territories' and column_name in ('visibility','status','verification_status','updated_at')),
            'accessRoot',to_regclass('private.comun_solidarity_organization_access') is not null,
            'accessIndex',exists(select 1 from pg_indexes where schemaname='private' and indexname='comun_solidarity_organization_access_live_identity_idx'),
            'auditRoot',to_regclass('private.comun_solidarity_economic_content_events') is not null,
            'auditForcedRls',coalesce((select relrowsecurity and relforcerowsecurity from pg_class where oid='private.comun_solidarity_economic_content_events'::regclass),false),
            'auditClientClosed',not has_table_privilege('anon','private.comun_solidarity_economic_content_events','SELECT,INSERT,UPDATE,DELETE') and not has_table_privilege('authenticated','private.comun_solidarity_economic_content_events','SELECT,INSERT,UPDATE,DELETE'),
            'profileRpcPresent',to_regprocedure('public.comun_update_solidarity_organization_profile_by_access_v1(uuid,uuid,uuid,timestamptz,text,text[],text,text,boolean)') is not null,
            'businessContentRead',false
          );
          rollback;
          SQL
          node - <<'NODE'
          const fs=require('node:fs');const state=JSON.parse(fs.readFileSync('.ci-artifacts/48-4-a6-preflight/schema.json'));
          for(const key of ['transactionReadOnly','organizationRoot','organizationFields','territoryEligibilityFields','accessRoot','accessIndex','auditRoot','auditForcedRls','auditClientClosed'])if(state[key]!==true)throw new Error(`COMUN_48_4_A6_BLOCKED_REMOTE_SCHEMA_DRIFT:${key}`);
          if(state.businessContentRead!==false)throw new Error('COMUN_48_4_A6_BLOCKED_BUSINESS_CONTENT_READ');
          fs.writeFileSync('.ci-artifacts/48-4-a6-preflight/mode',state.profileRpcPresent?'promoted':'candidate');
          NODE
      - name: Prove exactly one bounded migration plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$EXTERNAL_MIGRATION"|awk '{print $1}')" = 6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be
          held="$RUNNER_TEMP/external.sql";mv "$EXTERNAL_MIGRATION" "$held";trap 'mv "$held" "$EXTERNAL_MIGRATION"' EXIT
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/48-4-a6-preflight/plan.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/48-4-a6-preflight/plan.txt|sort -u||true)
          if [ "$(cat .ci-artifacts/48-4-a6-preflight/mode)" = candidate ];then test "${#planned[@]}" -eq 1&&test "${planned[0]}" = "$(basename "$MIGRATION")";else test "${#planned[@]}" -eq 0;fi
          ! grep -Eq -- '--include-all|migration repair|db reset|seed' .ci-artifacts/48-4-a6-preflight/plan.txt
          echo "migrationCount=${#planned[@]}" >>"$GITHUB_STEP_SUMMARY"
          echo businessContentRead=false >>"$GITHUB_STEP_SUMMARY"
          echo COMUN_48_4_A6_REMOTE_PREFLIGHT_GREEN >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-4-a6-preflight-${{ github.run_id }}
          path: .ci-artifacts/48-4-a6-preflight
          retention-days: 14
