name: COMUN CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_call:
    inputs:
      force_full:
        description: Execute the FULL gate for a promotion candidate
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      force_full:
        description: Execute the FULL gate
        required: false
        default: false
        type: boolean

concurrency:
  group: comun-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: FAST / COMUN_CI_GREEN
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --ignore-scripts
      - run: npm run solo:test
      - run: npm run test:promotion-runner
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:security-hardening
      - run: npm run db:privileges:lint
      - run: npm run build
      - name: Start local Supabase
        timeout-minutes: 10
        run: supabase start
      - name: Reset local database
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          output="$(supabase db reset --local --yes 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if ((status != 0)) && grep -q "Error status 502" <<<"$output"; then
            echo "COMUN_SUPABASE_LOCAL_502_SINGLE_RETRY"
            sleep 5
            supabase db reset --local --yes
          elif ((status != 0)); then
            exit "$status"
          fi
      - name: Local database lint
        timeout-minutes: 5
        run: supabase db lint --local --schema public --level error --fail-on error
      - name: Schema release ledger
        timeout-minutes: 5
        run: npm run test:schema-release-ledger
      - name: Auth onboarding trigger
        timeout-minutes: 5
        run: npm run test:handle-new-user
      - name: Public reports least privilege
        timeout-minutes: 5
        run: npm run test:public-reports-view
      - name: RLS matrix
        timeout-minutes: 10
        run: npm run audit:rls-matrix
      - name: Fixtures assert-clean
        timeout-minutes: 5
        run: npm run test:fixtures:assert-clean
      - if: always()
        run: supabase stop --no-backup || true

  full:
    name: FULL / COMUN_CI_GREEN
    needs: fast
    if: >-
      inputs.force_full == true ||
      github.event.pull_request.number == 23 ||
      github.event.pull_request.number == 30 ||
      startsWith(github.head_ref, 'codex/promote-') ||
      startsWith(github.ref_name, 'codex/promote-')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --ignore-scripts
      - run: npm run db:privileges:lint
      - run: npm run test:promotion-runner
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application for production-like suites
        run: npm run build
      - name: Two independent reconciliation trials
        shell: bash
        run: |
          supabase start
          supabase db reset --local --yes
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          node scripts/run-pr23-reconciliation.mjs --container="$container"
          npm run test:schema-release-ledger
          npm run test:handle-new-user
          npm run test:public-reports-view
          node scripts/solo/schema-fingerprint.mjs --container="$container" > /tmp/comun-hash-1
          node scripts/run-pr23-reconciliation.mjs --container="$container"
          supabase stop --no-backup
          supabase start
          supabase db reset --local --yes
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          node scripts/run-pr23-reconciliation.mjs --container="$container"
          node scripts/solo/schema-fingerprint.mjs --container="$container" > /tmp/comun-hash-2
          diff -u /tmp/comun-hash-1 /tmp/comun-hash-2
          node scripts/run-pr23-reconciliation.mjs --container="$container"
      - name: Critical product regressions
        run: |
          npm run test:e2e:comun-integral-experience
          npm run test:e2e:editorial-operation-authenticated
          npm run test:e2e:territorial-art
          supabase start
          npm run test:e2e:community-radio
          npm run test:e2e:comun-sidewalk-real-map
          npm run test:e2e:comun-miniapp-experience
          npm run test:e2e:comun-mobile-app-shell
          npm run test:e2e:comun-pwa-experience
          node scripts/comun-local-env.mjs run npm run start > /tmp/comun-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:3000/comun > /dev/null && break
            if [ "$attempt" -eq 120 ]; then cat /tmp/comun-next.log; exit 1; fi
            sleep 1
          done
          node scripts/comun-local-env.mjs run npm run smoke:no-leak-http
          node scripts/comun-local-env.mjs run npm run cleanup:comun-sidewalk-uploads
          node scripts/comun-local-env.mjs run npm run test:fixtures:assert-clean
      - if: success()
        run: echo 'COMUN_CI_GREEN' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: supabase stop --no-backup || true
