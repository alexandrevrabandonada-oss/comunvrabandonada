          COMUN_CENTRAL_PR: ${{ github.event.pull_request.number }}
          COMUN_CENTRAL_CAUSE: ${{ needs.sidewalk-readiness-checkpoint.result == 'failure' && 'transporte local do PostgreSQL no runner Ubuntu' || '' }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMUN_CENTRAL_REMOTE_WRITES: none
        run: node scripts/ci/update-comun-central.mjs

  central-after-sidewalk-release:
    needs: sidewalk-readiness-full
    if: >-
      always() && github.event_name == 'pull_request' &&
      contains(fromJSON('["labeled","synchronize"]'), github.event.action) &&
      contains(github.event.pull_request.labels.*.name, 'comun:sidewalk-readiness') &&
      contains(github.event.pull_request.labels.*.name, 'comun:release-candidate')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: release
          COMUN_CENTRAL_RESULT: ${{ needs.sidewalk-readiness-full.result }}
          COMUN_CENTRAL_SHA: ${{ github.event.pull_request.head.sha }}
          COMUN_CENTRAL_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMUN_CENTRAL_PR: ${{ github.event.pull_request.number }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMUN_CENTRAL_REMOTE_WRITES: none
        run: node scripts/ci/update-comun-central.mjs

  release-rehearsal:
    name: RELEASE / COMUN_RELEASE_REHEARSAL
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Assert immutable pull request head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "COMUN_RELEASE_REHEARSAL_HEAD_IMMUTABLE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --ignore-scripts
      - run: supabase start
      - name: Reset baseline before the selected release
        shell: bash
        run: |
          set +e
          output="$(supabase db reset --local --yes --version 20260723220112 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if ((status != 0)) && grep -q "Error status 502" <<<"$output"; then
            echo "COMUN_REHEARSAL_BASELINE_RESET_502_SINGLE_RETRY"
            sleep 5
            supabase db reset --local --yes --version 20260723220112
          elif ((status != 0)); then
            exit "$status"
          fi
      - name: Assert complete local platform
        run: |
          docker ps --format '{{.Names}} {{.Status}}' | grep -E '^supabase_(auth|storage|rest|db)_'
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' "$container")"
          test -n "$network"
          docker exec "$container" psql -U postgres -d postgres -XAt -c "select to_regclass('auth.users'), to_regclass('storage.buckets'), to_regclass('storage.objects'), to_regclass('public.comun_schema_releases');"
          docker run --rm --network "$network" postgres:17 pg_isready -h db -p 5432 -U postgres
          actual_pre="$(node scripts/solo/schema-fingerprint.mjs --container="$container")"
          [[ "$actual_pre" =~ ^[a-f0-9]{64}$ ]]
          {
            echo "COMUN_REHEARSAL_ACTUAL_PRE=$actual_pre"
            echo "COMUN_REHEARSAL_ACTUAL_POST=NOT_REACHED"
            echo "COMUN_REHEARSAL_FIRST_STATUS=NOT_REACHED"
            echo "COMUN_REHEARSAL_FIRST_MARKER=COMUN_RELEASE_REHEARSAL_UNCLASSIFIED_FAILURE"
            echo "COMUN_REHEARSAL_SECOND_STATUS=NOT_REACHED"
            echo "COMUN_REHEARSAL_SECOND_MARKER=NOT_REACHED"
            echo "PR23_DOCKER_NETWORK=$network"
          } >> "$GITHUB_ENV"
      - name: Verify pre-migration sidewalk compatibility
        env:
          COMUN_SIDEWALK_OPERATIONAL_V2: disabled
        run: node scripts/solo/verify-sidewalk-premigration-compat.mjs
      - name: Rehearse selected release first pass
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
          PR23_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres?application_name=LOCAL_VALIDATION
          SUPABASE_PROJECT_REF: LOCAL_VALIDATION
          PR23_ALLOWED_PROJECT_REFS: LOCAL_VALIDATION
        run: |
          set +e
          first_output="$(node scripts/solo/apply-forward-only.mjs --security-diagnostic-output=.ci-artifacts/release-security-diagnostic.json 2>&1)"
          first_status=$?
          set -e
          printf '%s\n' "$first_output"
          first_marker="$(printf '%s\n' "$first_output" | grep -oE '(SOLO|COMUN)_[A-Z0-9_:.-]+' | tail -1 || true)"
          if [[ -z "$first_marker" ]]; then first_marker=COMUN_RELEASE_REHEARSAL_UNCLASSIFIED_FAILURE; fi
          {
            echo "COMUN_REHEARSAL_FIRST_STATUS=$first_status"
            echo "COMUN_REHEARSAL_FIRST_MARKER=$first_marker"
          } >> "$GITHUB_ENV"
          if ((first_status != 0)); then exit "$first_status"; fi
          test "$first_marker" = "COMUN_SIDEWALK_OPERATIONAL_HARDENING_OK"
      - name: Capture post and rehearse selected release second pass
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
          PR23_DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres?application_name=LOCAL_VALIDATION
          SUPABASE_PROJECT_REF: LOCAL_VALIDATION
          PR23_ALLOWED_PROJECT_REFS: LOCAL_VALIDATION
        run: |
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          actual_post="$(node scripts/solo/schema-fingerprint.mjs --container="$container")"
          [[ "$actual_post" =~ ^[a-f0-9]{64}$ ]]
          echo "COMUN_REHEARSAL_ACTUAL_POST=$actual_post" >> "$GITHUB_ENV"
          set +e
          second_output="$(node scripts/solo/apply-forward-only.mjs --security-diagnostic-output=.ci-artifacts/release-security-diagnostic.json 2>&1)"
          second_status=$?
          set -e
          printf '%s\n' "$second_output"
          second_marker="$(printf '%s\n' "$second_output" | grep -oE '(SOLO|COMUN)_[A-Z0-9_:.-]+' | tail -1 || true)"
          if [[ -z "$second_marker" ]]; then second_marker=COMUN_RELEASE_REHEARSAL_UNCLASSIFIED_FAILURE; fi
          {
            echo "COMUN_REHEARSAL_SECOND_STATUS=$second_status"
            echo "COMUN_REHEARSAL_SECOND_MARKER=$second_marker"
          } >> "$GITHUB_ENV"
          if ((second_status != 0)); then exit "$second_status"; fi
          test "$second_marker" = "COMUN_SIDEWALK_OPERATIONAL_HARDENING_ALREADY_APPLIED"
      - run: supabase db lint --local --schema public --level error --fail-on error
      - run: npm run audit:rls-matrix
      - run: npm run test:fixtures:assert-clean
      - name: Prepare sanitized rehearsal evidence
        if: always()
        run: |
          mkdir -p .ci-artifacts
          test -f .ci-artifacts/release-security-diagnostic.json
          node scripts/solo/assert-sanitized-security-diagnostic.mjs --input=.ci-artifacts/release-security-diagnostic.json
          {
            echo "release_rehearsal=COMUN_RELEASE_REHEARSAL"
            echo "head_sha=${{ github.event.pull_request.head.sha }}"
            echo "merge_sha=${{ github.sha }}"
            echo "manifest=20260724233256-comun-sidewalk-operational-hardening"
            echo "expected_pre=a6599aa24658c4339c7518d484364699d07ca4fa9cb1db68bb6fed4c20b94a10"
            echo "actual_pre=${COMUN_REHEARSAL_ACTUAL_PRE:-NOT_REACHED}"
            echo "expected_post=614908b735616fc64d4d36bc05e050ee53a0fb2b1f4e099febe1f327923350c4"
            echo "actual_post=${COMUN_REHEARSAL_ACTUAL_POST:-NOT_REACHED}"
            echo "first_status=${COMUN_REHEARSAL_FIRST_STATUS:-NOT_REACHED}"
            echo "first_marker=${COMUN_REHEARSAL_FIRST_MARKER:-COMUN_RELEASE_REHEARSAL_UNCLASSIFIED_FAILURE}"
            echo "second_status=${COMUN_REHEARSAL_SECOND_STATUS:-NOT_REACHED}"
            echo "second_marker=${COMUN_REHEARSAL_SECOND_MARKER:-NOT_REACHED}"
            echo "remote_writes=none"
          } > .ci-artifacts/release-rehearsal.txt
      - name: Upload sanitized rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-release-rehearsal-${{ github.run_id }}
          path: |
            .ci-artifacts/release-rehearsal.txt
            .ci-artifacts/release-security-diagnostic.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Declare release rehearsal green
        if: success()
        run: |
          test "${COMUN_REHEARSAL_FIRST_STATUS}" = "0"
          test "${COMUN_REHEARSAL_FIRST_MARKER}" = "COMUN_SIDEWALK_OPERATIONAL_HARDENING_OK"
          test "${COMUN_REHEARSAL_ACTUAL_POST}" = "614908b735616fc64d4d36bc05e050ee53a0fb2b1f4e099febe1f327923350c4"
          test "${COMUN_REHEARSAL_SECOND_STATUS}" = "0"
          test "${COMUN_REHEARSAL_SECOND_MARKER}" = "COMUN_SIDEWALK_OPERATIONAL_HARDENING_ALREADY_APPLIED"
          echo 'COMUN_RELEASE_REHEARSAL_GREEN' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: supabase stop --no-backup || true

  full:
    name: RELEASE/FULL / COMUN_CI_GREEN
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 40 &&
      github.event.label.name == 'comun:release-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require MICRO and CHECKPOINT for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for required in "MICRO / COMUN_MICRO_GREEN" "CHECKPOINT / COMUN_CHECKPOINT_GREEN"; do
            passed="$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$required\" and .conclusion == \"success\")] | length")"
            if ((passed == 0)); then
              echo "COMUN_FULL_BLOCKED_BY_${required//[^A-Z]/_}"
              exit 1
            fi
          done
          echo "COMUN_FULL_PRIOR_GATES_GREEN_FOR_SHA"
      - id: deduplicate
        name: Reuse a successful FULL for the same SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_NAME: RELEASE/FULL / COMUN_CI_GREEN
        shell: bash
        run: |
          previous="$(
            gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == env.CHECK_NAME and .conclusion == "success")] | length'
          )"
          if ((previous > 0)); then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "COMUN_FULL_REUSED_FOR_UNCHANGED_SHA"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.deduplicate.outputs.should_run == 'true'
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        if: steps.deduplicate.outputs.should_run == 'true'
        with:
          version: 2.109.1
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run db:privileges:lint
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run test:promotion-runner
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run test:security-hardening
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run solo:test
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run typecheck
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run lint
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run test:unit
      - name: Validate administrative schema and RLS locally
        if: steps.deduplicate.outputs.should_run == 'true'
        run: |
          supabase start
          supabase db reset --local --yes
          container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          node scripts/solo/schema-fingerprint.mjs --container="$container" > /tmp/comun-hash-1
          node scripts/db/test-collective-actions-local.mjs
          npm run audit:rls-matrix
          node scripts/solo/schema-fingerprint.mjs --container="$container" > /tmp/comun-hash-2
          diff -u /tmp/comun-hash-1 /tmp/comun-hash-2
      - name: Build application for production-like suites
        if: steps.deduplicate.outputs.should_run == 'true'
        run: npm run build
      - if: steps.deduplicate.outputs.should_run == 'true'
        run: git diff --check origin/main...HEAD
      - if: success() && steps.deduplicate.outputs.should_run == 'true'
        run: echo 'COMUN_CI_GREEN' >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.deduplicate.outputs.should_run == 'true'
        run: supabase stop --no-backup || true

  process-retro-unit:
    name: COMUN RETRO / unit
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: node --test scripts/process/evaluate-comun-checkpoint.node-test.mjs

  process-checkpoint:
    name: PROCESS / COMUN_PROCESS_CHECKPOINT_GREEN
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'comun:process')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate process contract
        run: |
          node --test scripts/process/evaluate-comun-checkpoint.node-test.mjs
          node --test scripts/process/verify-main-deployment.node-test.mjs
          node --test scripts/ci/comun-central.node-test.mjs
          npx eslint scripts/process scripts/ci
          npx prettier --check .github/workflows scripts/process scripts/ci package.json
          node --check scripts/process/evaluate-comun-checkpoint.mjs
          node --check scripts/process/verify-main-deployment.mjs
          node --check scripts/ci/update-comun-central.mjs
          git diff --check origin/main...HEAD
          echo 'COMUN_PROCESS_CHECKPOINT_GREEN' >> "$GITHUB_STEP_SUMMARY"

  central-after-micro:
    name: Update COMUN CENTRAL after MICRO
    needs: micro
    if: always() && github.event_name == 'push' && github.ref_name == 'codex/tijolo-44-3-acao-memoria'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update fixed control issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: push
          COMUN_CENTRAL_RESULT: ${{ needs.micro.result }}
          COMUN_CENTRAL_SHA: ${{ github.sha }}
          COMUN_CENTRAL_BRANCH: ${{ github.ref_name }}
          COMUN_CENTRAL_PR: "40"
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/update-comun-central.mjs

  central-after-checkpoint:
    name: Update COMUN CENTRAL after CHECKPOINT
    needs: checkpoint
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 40 &&
      github.event.label.name == 'comun:checkpoint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Update fixed control issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: checkpoint
          COMUN_CENTRAL_RESULT: ${{ needs.checkpoint.result }}
          COMUN_CENTRAL_SHA: ${{ github.event.pull_request.head.sha }}
          COMUN_CENTRAL_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMUN_CENTRAL_PR: ${{ github.event.pull_request.number }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/update-comun-central.mjs

  central-after-release:
    name: Update COMUN CENTRAL after RELEASE/FULL
    needs: full
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 40 &&
      github.event.label.name == 'comun:release-candidate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Update fixed control issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: release
          COMUN_CENTRAL_RESULT: ${{ needs.full.result }}
          COMUN_CENTRAL_SHA: ${{ github.event.pull_request.head.sha }}
          COMUN_CENTRAL_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMUN_CENTRAL_PR: ${{ github.event.pull_request.number }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/update-comun-central.mjs

  central-after-merge:
    name: Update COMUN CENTRAL after merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Update fixed control issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: merge
          COMUN_CENTRAL_RESULT: merged
          COMUN_CENTRAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMUN_CENTRAL_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          COMUN_CENTRAL_PR: ${{ github.event.pull_request.number }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/update-comun-central.mjs

  comun-retro:
    name: COMUN RETRO / evaluate merged checkpoint
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - id: lineage
        name: Verify production deployment lineage from main
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_STATE: ${{ github.event.deployment_status.state }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/process/verify-main-deployment.mjs --github-output="$GITHUB_OUTPUT"
      - id: retro
        name: Smoke production and evaluate the completed checkpoint
        if: steps.lineage.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          MERGE_SHA: ${{ github.event.deployment.sha }}
          COMUN_RETRO_SMOKE_ROUTES: ${{ vars.COMUN_RETRO_SMOKE_ROUTES }}
          ARTIFACT_DIR: .ci-artifacts/comun-process-review
        shell: bash
        run: |
          set -uo pipefail
          smoke_status=passed
          smoke_args=()
          mapfile -t routes < <(
            node --input-type=module -e "import { resolveSmokeRoutes } from './scripts/process/evaluate-comun-checkpoint.mjs'; console.log(resolveSmokeRoutes(process.env.COMUN_RETRO_SMOKE_ROUTES).join('\\n'))"
          )
          for route in "${routes[@]}"; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${DEPLOYMENT_URL}${route}" || true)"
            smoke_args+=("--smoke-route=${route}:${status}")
            if [ "$status" != "200" ]; then smoke_status=failed; fi
          done
          node scripts/process/evaluate-comun-checkpoint.mjs \
            --repository="${{ github.repository }}" \
            --merge-sha="$MERGE_SHA" \
            --production-deployment="$DEPLOYMENT_ID" \
            --smoke-status="$smoke_status" \
            --remote-writes=unknown \
            --output-dir="$ARTIFACT_DIR" \
            --github-output="$GITHUB_OUTPUT" \
            "${smoke_args[@]}"
      - name: Publish sanitized COMUN RETRO artifact
        if: always() && steps.lineage.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comun-process-review-${{ steps.retro.outputs.checkpoint_id }}-${{ github.run_id }}
          path: .ci-artifacts/comun-process-review
          if-no-files-found: warn
      - name: Update COMUN CENTRAL after COMUN RETRO
        if: steps.lineage.outputs.eligible == 'true' && steps.retro.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMUN_CENTRAL_ISSUE: "39"
          COMUN_CENTRAL_STAGE: retro
          COMUN_CENTRAL_RESULT: ${{ steps.retro.outputs.process_decision }}
          COMUN_CENTRAL_SHA: ${{ github.event.deployment.sha }}
          COMUN_CENTRAL_CHECKPOINT: ${{ steps.retro.outputs.checkpoint_id }}
          COMUN_CENTRAL_PRODUCT_DECISION: ${{ steps.retro.outputs.product_decision }}
          COMUN_CENTRAL_PROCESS_DECISION: ${{ steps.retro.outputs.process_decision }}
          COMUN_CENTRAL_DURATION: ${{ steps.retro.outputs.duration }}
          COMUN_CENTRAL_RUNS: ${{ steps.retro.outputs.runs }}
          COMUN_CENTRAL_HUMAN_INTERVENTIONS: ${{ steps.retro.outputs.human_interventions }}
          COMUN_CENTRAL_IMPROVEMENTS: ${{ steps.retro.outputs.improvements }}
          COMUN_CENTRAL_REMOTE_WRITES: ${{ steps.retro.outputs.remote_writes }}
          COMUN_CENTRAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/update-comun-central.mjs
