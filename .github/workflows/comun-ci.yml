      - name: Reset the historical pre-release local baseline
        shell: bash
        run: |
          set -euo pipefail
          held_migrations="$(mktemp -d)"
          restore_migrations() {
            find "$held_migrations" -maxdepth 1 -type f -name '*.sql' -exec mv {} supabase/migrations/ \;
            rmdir "$held_migrations"
          }
          trap restore_migrations EXIT
          while IFS= read -r migration; do
            mv "supabase/migrations/$migration" "$held_migrations/$migration"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | awk '$0 >= "20260724233256_comun_sidewalk_operational_hardening.sql"')
