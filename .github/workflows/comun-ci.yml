name: COMUN CI

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        ready_for_review,
        closed,
      ]
  push:
    branches: [main, "codex/**"]
  deployment_status:
  workflow_call:
    inputs:
      force_full:
        description: Execute the FULL gate for a promotion candidate
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      force_full:
        description: Execute the FULL gate
        required: false
        default: false
        type: boolean

concurrency:
  group: comun-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read
  issues: write
  pull-requests: write

jobs:
  r2a-production-candidate-contract:
    name: COMUN R2A / production candidate topology
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Keep production candidate chain separate from local-only labs
        run: |
          test -f supabase/migrations/20260805130000_comun_production_pilot_core_bundle.sql
          test -f supabase/migrations/20260805201000_comun_production_pilot_attachment_rpc_fix.sql
          test -f supabase/migrations/20260805212659_comun_production_pilot_wallet_account_rpc_fix.sql
          test -f supabase/releases/20260805214000-comun-production-pilot-core-chain-v2.json
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260805*.sql' | wc -l)" -eq 3
          test -d supabase/local-migrations
          ! find supabase/migrations -maxdepth 1 -type f -name '20260803*.sql' -o -name '20260804*.sql' -o -name '20260805090000*.sql' | grep -q .
      - run: npm run relata:topology:test
      - run: npm run relata:release:test
      - run: npm run db:privileges:lint
      - run: npm run solo:sql:validate -- --release-manifest=supabase/releases/20260805130000-comun-production-pilot-core-bundle.json
      - run: npm run solo:sql:validate -- --release-manifest=supabase/releases/20260805201000-comun-production-pilot-attachment-rpc-fix.json
      - run: npm run solo:sql:validate -- --release-manifest=supabase/releases/20260805212659-comun-production-pilot-wallet-account-rpc-fix.json
      - run: node --test scripts/solo/production-pilot-bundle.node-test.mjs
      - run: npm run relata:r2a:private:e2e:workflow:test
      - run: npm run relata:p2:text:e2e:workflow:test
      - run: npm run typecheck
      - run: npm run lint

  r2a-private-runtime-e2e:
    name: COMUN R2A / private runtime E2E
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number == 174
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.force_full == true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Assert isolated candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -f supabase/migrations/20260805130000_comun_production_pilot_core_bundle.sql
          grep -q '^project_id = "COMUM_VR_ABANDONADA"' supabase/config.toml
      - run: npm ci --ignore-scripts
      - name: Start disposable Supabase and apply the canonical chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/r2a-private-runtime-e2e
          : > .ci-artifacts/r2a-private-runtime-e2e/environment.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/timestamps.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/docker-info.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/docker-disk.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/supabase-version.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/startup.log
          : > .ci-artifacts/r2a-private-runtime-e2e/startup-exit.txt
          : > .ci-artifacts/r2a-private-runtime-e2e/startup-classification.json
          cleanup() {
            local stop_status=0
            echo 'COMUN_R2A_E2E_CLEANUP_START'
            timeout -k 10s 120s supabase stop --no-backup >/dev/null 2>&1 || stop_status=$?
            if [[ "$stop_status" -eq 124 || "$stop_status" -eq 137 ]]; then
              echo 'COMUN_R2A_E2E_CLEANUP_TIMEOUT'
            elif [[ "$stop_status" -ne 0 ]]; then
              echo "COMUN_R2A_E2E_CLEANUP_STOP_FAILED status=$stop_status"
            fi
            mapfile -t residual_ids < <(docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA')
            if (( ${#residual_ids[@]} )); then
              docker rm -f "${residual_ids[@]}" >/dev/null 2>&1 || true
            fi
            if docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA' | grep -q .; then
              echo 'COMUN_R2A_E2E_CLEANUP_CONTAINERS_REMAIN'
              exit 1
            fi
            if [[ "$stop_status" -ne 0 ]]; then
              exit 1
            fi
            echo 'COMUN_R2A_E2E_CLEANUP_DONE'
          }
          trap cleanup EXIT
          export COMUN_R2A_ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts/r2a-private-runtime-e2e"
          node scripts/solo/r2a-supabase-startup.mjs
          supabase db reset --local --yes
          status_file="$(mktemp)"
          supabase status -o env >"$status_file"
          api_url="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$status_file")"
          db_url="$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$status_file")"
          anon_key="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$status_file")"
          service_key="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$status_file")"
          [[ "$api_url" =~ ^http://127\.0\.0\.1:[0-9]+$ ]]
          [[ "$db_url" =~ ^postgresql://postgres:postgres@127\.0\.0\.1:[0-9]+/postgres$ ]]
          test -n "$anon_key"
          test -n "$service_key"
          location_key="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("base64url"))')"
          spatial_key="$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("base64url"))')"
          export ALLOW_LOCAL_TESTS=true
          export COMUN_BASE_URL=http://127.0.0.1:3138
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3138
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY="$service_key"
          export COMUN_SIDEWALK_OPERATIONAL_DATABASE_URL="$db_url"
          export COMUN_RELATA_PREVIEW=enabled
          export COMUN_RELATA_LOCAL_PERSISTENCE=enabled
          export COMUN_RELATA_LOCAL_EVIDENCE=enabled
          export COMUN_RELATA_LOCAL_PUBLIC_MAP=disabled
          export COMUN_RELATA_COLLECTIVE_ENABLED=disabled
          export COMUN_QUICK_CAPTURE_V2=enabled
          export COMUN_PARTICIPATION_WALLET_LOCAL=enabled
          export COMUN_RELATA_LOCATION_ENCRYPTION_KEY="$location_key"
          export COMUN_RELATA_SPATIAL_HMAC_KEY="$spatial_key"
          export COMUN_R2A_USE_BUILT_SERVER=1
          export COMUN_R2A_E2E_LOG="$GITHUB_WORKSPACE/.ci-artifacts/r2a-private-runtime-e2e/next.log"
          npm run relata:r2a:attachment-fix:test > .ci-artifacts/r2a-private-runtime-e2e/attachment-fix.log 2>&1
          npm run relata:r2a:wallet-account-fix:test > .ci-artifacts/r2a-private-runtime-e2e/wallet-account-fix.log 2>&1
          npm run build > .ci-artifacts/r2a-private-runtime-e2e/build.log 2>&1
          set +e
          npm run relata:r2a:private:e2e:local > .ci-artifacts/r2a-private-runtime-e2e/e2e.log 2>&1
          e2e_status=$?
          set -e
          printf '%s\n' "$e2e_status" > .ci-artifacts/r2a-private-runtime-e2e/e2e.exit
          cat .ci-artifacts/r2a-private-runtime-e2e/e2e.log
          test "$e2e_status" -eq 0
      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-r2a-private-runtime-e2e-${{ github.run_id }}
          path: .ci-artifacts/r2a-private-runtime-e2e
          include-hidden-files: true
          if-no-files-found: warn

  p2-relata-text-private-e2e:
    name: COMUN P2 / private textual Relata E2E
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.ref == 'codex/48-1b-p2-relata-text-domain'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.force_full == true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Assert no remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
      - run: npm ci --ignore-scripts
      - name: Start disposable Supabase and run P2 textual rehearsal
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/.ci-artifacts/p2-relata-text-private"
          mkdir -p "$artifact"
          cleanup() {
            local status=0
            timeout -k 10s 120s supabase stop --no-backup >/dev/null 2>&1 || status=$?
            if docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA' | grep -q .; then
              docker rm -f $(docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA') >/dev/null 2>&1 || true
            fi
            test "$status" -eq 0
            ! docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA' | grep -q .
          }
          trap cleanup EXIT
          node scripts/solo/r2a-supabase-startup.mjs >"$artifact/supabase-start.log" 2>&1
          supabase db reset --local --yes >"$artifact/db-reset.log" 2>&1
          status_file="$(mktemp)"
          supabase status -o env >"$status_file"
          api_url="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$status_file")"
          db_url="$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$status_file")"
          anon_key="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$status_file")"
          service_key="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$status_file")"
          printf '%s\n' '{"mode":"local","remoteCredentials":"absent","supabase":"loopback","secrets":"redacted"}' >"$artifact/environment.json"
          export ALLOW_LOCAL_TESTS=true
          export COMUN_BASE_URL=http://127.0.0.1:3139
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3139
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY="$service_key"
          export COMUN_SIDEWALK_OPERATIONAL_DATABASE_URL="$db_url"
          export COMUN_RELATA_PREVIEW=enabled
          export COMUN_RELATA_LOCAL_PERSISTENCE=enabled
          export COMUN_RELATA_PERSISTENCE_ENABLED=disabled
          export COMUN_QUICK_CAPTURE_V2=enabled
          export COMUN_RELATA_LOCAL_EVIDENCE=disabled
          export COMUN_RELATA_LOCAL_PUBLIC_MAP=disabled
          export COMUN_RELATA_COLLECTIVE_ENABLED=disabled
          export COMUN_PARTICIPATION_WALLET_LOCAL=enabled
          export COMUN_TERRITORY_PROFILE_ENABLED=disabled
          export COMUN_GOOGLE_AUTH_ENABLED=disabled
          export COMUN_R2A_USE_BUILT_SERVER=0
          npm run relata:p2:text:e2e:local >"$artifact/e2e.log" 2>&1
          cp "$artifact/e2e.log" "$artifact/e2e-sanitized.log"
      - name: Upload sanitized P2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-p2-relata-text-private-${{ github.run_id }}
          path: .ci-artifacts/p2-relata-text-private
          include-hidden-files: true
          if-no-files-found: warn

  p1-account-wallet-runtime-e2e:
    name: COMUN P1 / account and wallet runtime E2E
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.ref == 'codex/48-1b-p1-account-wallet-domain'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.force_full == true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Assert no remote credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -f supabase/config.toml
          grep -q '^project_id = "COMUM_VR_ABANDONADA"' supabase/config.toml
      - run: npm ci --ignore-scripts
      - name: Start isolated Supabase and run the account-wallet rehearsal
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/.ci-artifacts/p1-account-wallet"
          mkdir -p "$artifact"
          cleanup() {
            set +e
            supabase stop --no-backup >/dev/null 2>&1
            ids=$(docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA')
            test -z "$ids" || docker rm -f $ids >/dev/null 2>&1
            test -z "$(docker ps -aq --filter 'label=com.supabase.cli.project=COMUM_VR_ABANDONADA')"
          }
          trap cleanup EXIT
          supabase start >"$artifact/startup.log" 2>&1
          supabase db reset --local --yes >>"$artifact/startup.log" 2>&1
          status_file="$artifact/status.env"
          supabase status -o env >"$status_file"
          api_url=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$status_file")
          anon_key=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$status_file")
          service_key=$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$status_file")
          db_url=$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$status_file")
          export ALLOW_LOCAL_TESTS=true
          export COMUN_BASE_URL=http://127.0.0.1:3142
          export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3142
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY="$service_key"
          export COMUN_SIDEWALK_OPERATIONAL_DATABASE_URL="$db_url"
          export COMMUNITY_REGISTRATION_MODE=open
          export COMUN_PARTICIPATION_WALLET_LOCAL=enabled
          export COMUN_TERRITORY_PROFILE_ENABLED=disabled
          export COMUN_GOOGLE_AUTH_ENABLED=disabled
          export COMUN_PARTICIPATION_WALLET_ENABLED=disabled
          export COMUN_RELATA_COLLECTIVE_ENABLED=disabled
          npm run build >"$artifact/build.log" 2>&1
          npm run account:wallet:e2e:local >"$artifact/e2e.log" 2>&1
          grep -q 'COMUN_48_1B_P1_ACCOUNT_WALLET_DISPOSABLE_E2E_GREEN' "$artifact/e2e.log"
      - name: Upload sanitized P1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-p1-account-wallet-${{ github.run_id }}
          path: .ci-artifacts/p1-account-wallet
          include-hidden-files: true
          if-no-files-found: warn

  active-lane-integrity:
    name: Active lane integrity / COMUN_ACTIVE_LANE_INTEGRITY_GREEN
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number == 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate the active product lane
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: codex/tijolo-44-3-acao-memoria
          EXPECTED_BASE: main
          ACTUAL_BRANCH: ${{ github.event.pull_request.head.ref }}
          ACTUAL_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$ACTUAL_BRANCH" = "$EXPECTED_BRANCH"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(backups?|[^/]+\.(dump|sql\.gz|log)|\.env($|\.)|.*secret)'
          ! printf '%s\n' "$changed" | grep -E '^supabase/migrations/20260724233256_comun_sidewalk_operational_hardening\.sql$'
          echo "COMUN_ACTIVE_LANE_INTEGRITY_GREEN"

  checkpoint:
    name: CHECKPOINT / COMUN_CHECKPOINT_GREEN
    needs: active-lane-integrity
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 40 &&
      github.event.label.name == 'comun:checkpoint'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ENV: preview
      COMUN_COLLECTIVE_ACTIONS_PREVIEW_FIXTURES: enabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: node --test scripts/ci/comun-central.node-test.mjs scripts/collective-actions-premigration.node-test.mjs scripts/collective-actions-member-journey.node-test.mjs scripts/collective-actions-admin-memory.node-test.mjs
      - name: Start and reset local Supabase
        run: |
          supabase start
          supabase db reset --local --yes
      - name: Validate member journey and RLS locally
        run: |
          node scripts/db/test-collective-actions-local.mjs
          npm run audit:rls-matrix
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start synthetic preview
        run: |
          npm run start -- --port 3100 > /tmp/comun-collective-actions-preview.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3100/comun/acoes > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/comun-collective-actions-preview.log
          exit 1
      - name: Capture responsive synthetic preview
        run: |
          mkdir -p .ci-artifacts/collective-actions-preview
          node <<'NODE'
          const { chromium } = require("playwright");
          const AxeBuilder = require("@axe-core/playwright").default;
          const routes = [
            ["listagem", "/comun/acoes"],
            ["acao-aberta", "/comun/acoes/mutirao-caminho-seguro"],
            ["tarefas", "/comun/acoes/mutirao-caminho-seguro"],
            ["timeline", "/comun/acoes/mutirao-caminho-seguro"],
            ["encaminhamento", "/comun/acoes/encaminhamento-iluminacao"],
            ["protocolo", "/comun/acoes/encaminhamento-iluminacao"],
            ["resposta", "/comun/acoes/encaminhamento-iluminacao"],
            ["resultado", "/comun/acoes/memoria-do-mutirao"],
            ["memoria-final", "/comun/acoes/memoria-do-mutirao"],
            ["minha-participacao", "/comun/minha-participacao"],
            ["administracao", "/comun/admin/acoes"],
          ];
          const viewports = [["mobile", 390, 844], ["tablet", 768, 1024], ["desktop", 1440, 900]];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const errors = [];
            for (const [name, width, height] of viewports) {
              const context = await browser.newContext({ viewport: { width, height } });
              const page = await context.newPage();
              page.on("console", (message) => { if (message.type() === "error") errors.push(message.text()); });
              page.on("pageerror", (error) => errors.push(error.message));
              for (const [routeName, path] of routes) {
                const response = await page.goto(`http://127.0.0.1:3100${path}`, { waitUntil: "networkidle" });
                if (!response || response.status() >= 500) throw new Error(`Preview route failed: ${path}`);
                if (await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth)) throw new Error(`Horizontal overflow: ${name} ${path}`);
                if (await page.locator("main").count() === 0) throw new Error(`Missing main landmark: ${path}`);
                const undersizedButtons = await page.locator("button").evaluateAll((buttons) => buttons.filter((button) => {
                  const rect = button.getBoundingClientRect();
                  return rect.width > 0 && rect.height > 0 && (Math.round(rect.width) < 40 || Math.round(rect.height) < 40);
                }).length);
                if (undersizedButtons) throw new Error(`Undersized touch targets: ${name} ${path}`);
                const audit = await new AxeBuilder({ page }).withTags(["wcag2a", "wcag2aa", "wcag21aa"]).analyze();
                const blockers = audit.violations.filter((violation) => ["critical", "serious"].includes(violation.impact));
                if (blockers.length) throw new Error(`Accessibility blockers: ${name} ${path} ${blockers.map((violation) => violation.id).join(",")}`);
                const content = await page.content();
                if (/member_user_id|contribution_note_private|service_role|private_contact/i.test(content)) throw new Error(`Private marker exposed: ${path}`);
                await page.screenshot({ path: `.ci-artifacts/collective-actions-preview/${name}-${routeName}.png`, fullPage: true });
              }
              await context.close();
            }
            await browser.close();
            if (errors.length) throw new Error(`Console errors: ${errors.join(" | ")}`);
