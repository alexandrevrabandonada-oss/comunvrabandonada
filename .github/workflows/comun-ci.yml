      - name: Start the map without a database
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3102 > /tmp/comun-tijolo-45-map.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3102/comun/calcadas > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/comun-tijolo-45-map.log
          exit 1
      - name: Verify real map, fallback and responsive screenshots
        run: PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test -c playwright.tijolo-45-real-map.config.ts
      - id: preview
        name: Require the exact Vercel Preview and HTTP Range
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          for attempt in {1..30}; do
            deployment_id="$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview&per_page=20" --jq '[.[] | select(.sha == env.SHA and .environment == "Preview")][0].id // empty')"
            if [[ -n "$deployment_id" ]]; then
              deployment_url="$(gh api "repos/${{ github.repository }}/deployments/$deployment_id/statuses?per_page=20" --jq '[.[] | select(.state == "success" and .environment_url)][0].environment_url // empty')"
              if [[ -n "$deployment_url" ]]; then
                headers_path="$(mktemp)"
                http_status="$(curl --silent --show-error --location --range 0-127 \
                  --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                  --dump-header "$headers_path" --output /dev/null --write-out '%{http_code}' \
                  "$deployment_url/maps/volta-redonda/volta-redonda.pmtiles" || true)"
                content_range="$(tr -d '\r' < "$headers_path" | awk 'tolower($1) == "content-range:" { print $2 " " $3; exit }')"
                rm -f "$headers_path"
                if [[ "$http_status" == "206" && "$content_range" == "bytes 0-127/10147678" ]]; then
                  echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
                  echo COMUN_VOLTA_REDONDA_PREVIEW_RANGE_GREEN
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo COMUN_VOLTA_REDONDA_PREVIEW_RANGE_UNAVAILABLE
          exit 1
      - name: Upload map checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-tijolo-45-real-map-${{ github.run_id }}
          path: |
            test-results
            /tmp/comun-tijolo-45-map.log
          if-no-files-found: warn

