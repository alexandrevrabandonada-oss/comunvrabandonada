name: COMUN 49.2 R5 publisher desk post-merge certification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-r5-desk-post-merge-cert.yml"
      - "scripts/49-2-r5-release/capture-desk-post-merge.mjs"

permissions: { contents: read }

jobs:
  certify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/comun-49-2-r5-desk-post-merge-cert' &&
      github.event.pull_request.base.sha == '7127a6cc008853d620238d51e14f94ea231495f0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact post-merge main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "7127a6cc008853d620238d51e14f94ea231495f0"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "7127a6cc008853d620238d51e14f94ea231495f0"
      - name: Read-only Production R5 certification
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
          COMUN_R5_EXPECTED_MAIN_SHA: 7127a6cc008853d620238d51e14f94ea231495f0
        run: |
          node scripts/49-2-r5-release/capture-desk-post-merge.mjs \
            --output=.ci-artifacts/r5-desk-post-merge.json
      - name: Unauthenticated publisher desk must fail closed to admin login
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
            https://comunsocial.online/comun/admin/entidades)"
          status="${result%% *}"
          location="${result#* }"
          case "$status" in
            303|307|308) ;;
            *) echo "Unexpected unauthenticated status: $result" >&2; exit 1 ;;
          esac
          case "$location" in
            https://comunsocial.online/comun/admin/login*|https://www.comunsocial.online/comun/admin/login*) ;;
            *) echo "Unexpected unauthenticated redirect: $result" >&2; exit 1 ;;
          esac
          echo "COMUN_R5_PUBLISHER_DESK_UNAUTHENTICATED_FAIL_CLOSED"
      - name: Sanitize and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          if rg -i 'postgresql://|password|token|secret|@.*supabase\.co' .ci-artifacts/r5-desk-post-merge.json; then
            echo COMUN_R5_DESK_POST_MERGE_ARTIFACT_UNSAFE >&2
            exit 1
          fi
          sha256sum .ci-artifacts/r5-desk-post-merge.json | tee .ci-artifacts/r5-desk-post-merge.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r5-desk-post-merge-${{ github.run_id }}
          path: |
            .ci-artifacts/r5-desk-post-merge.json
            .ci-artifacts/r5-desk-post-merge.sha256
          if-no-files-found: error
          retention-days: 7
