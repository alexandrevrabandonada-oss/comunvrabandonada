name: COMUN P6A domain activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string
      mode:
        description: Deploy flags off, activate one wave, or roll back one capability
        required: true
        type: choice
        options:
          [
            flags-off,
            wave1-services,
            wave2-forwarding,
            rollback-services,
            rollback-forwarding,
          ]

concurrency:
  group: comun-p6a-domain-activation
  cancel-in-progress: false
permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Verify exact main and activation plan
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm ci --ignore-scripts
          node --check scripts/solo/rehearse-p6a-essential-services-production.mjs
          test "$(find supabase/migrations -maxdepth 1 -name '*_comun_essential_services_assisted.sql' | wc -l)" -eq 1
          ! grep -Eqi 'window\.open|wa\.me|mailto:|fetch\([^)]*(saaevr|light|voltaredonda)' scripts/solo/rehearse-p6a-essential-services-production.mjs
          ! grep -Eqi '\bdelete[[:space:]]+from\b' scripts/solo/rehearse-p6a-essential-services-production.mjs
      - name: Set P6A flags without reading Production values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          services=disabled
          forwarding=disabled
          case "${{ inputs.mode }}" in
            wave1-services|rollback-forwarding) services=enabled ;;
            wave2-forwarding) services=enabled; forwarding=enabled ;;
            flags-off|rollback-services) ;;
            *) echo COMUN_P6A_ACTIVATION_MODE_INVALID; exit 1 ;;
          esac
          printf '%s' "$services" | npx --yes vercel@50.28.0 env add COMUN_ESSENTIAL_SERVICES_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-services-env.out 2>/tmp/comun-p6a-services-env.err
          printf '%s' "$forwarding" | npx --yes vercel@50.28.0 env add COMUN_ESSENTIAL_FORWARDING_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-forwarding-env.out 2>/tmp/comun-p6a-forwarding-env.err
      - name: Deploy exact main with current Production environment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-deploy.out 2>/tmp/comun-p6a-deploy.err
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p6a-deploy.out | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo COMUN_P6A_DEPLOYMENT_URL_UNAVAILABLE; exit 1 ;; esac
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Promote exact deployment to canonical domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 promote "$DEPLOYMENT_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-promote.out 2>/tmp/comun-p6a-promote.err
          npx --yes vercel@50.28.0 alias set "$DEPLOYMENT_URL" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-alias.out 2>/tmp/comun-p6a-alias.err
      - name: Verify preserved domain surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in /comun /comun/relatar /comun/calcadas /comun/onibus /comun/minha-participacao; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL$path")" = 200
          done
      - name: Verify flags-off cloak
        if: inputs.mode == 'flags-off' || inputs.mode == 'rollback-services'
        shell: bash
        run: |
          set -euo pipefail
          for method in GET POST PUT PATCH DELETE HEAD OPTIONS; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$COMUN_BASE_URL/api/comun/essential-services/packages/00000000-0000-0000-0000-000000000000")" = 404
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$COMUN_BASE_URL/api/comun/relata/classification")" = 404
          done
          echo COMUN_P6A_CODE_DEPLOYED_FLAGS_OFF >> "$GITHUB_STEP_SUMMARY"
      - name: Allocate synthetic smoke marker
        id: attempt
        if: inputs.mode == 'wave1-services' || inputs.mode == 'wave2-forwarding'
        shell: bash
        run: |
          marker="P6A-SMOKE-${GITHUB_RUN_ID}-$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf 'attempt_id=%s\n' "$marker" >> "$GITHUB_OUTPUT"
      - name: Run wave 1 Production smoke with finally cleanup
        id: wave1
        if: inputs.mode == 'wave1-services'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
          P6A_SMOKE_MODE: wave1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p6a-production
          node scripts/solo/rehearse-p6a-essential-services-production.mjs >.ci-artifacts/p6a-production/wave1.json
          grep -q COMUN_P6A_ESSENTIAL_SERVICES_WAVE1_PRODUCTION_GREEN .ci-artifacts/p6a-production/wave1.json
      - name: Run wave 2 prepared-only Production smoke with finally cleanup
        id: wave2
        if: inputs.mode == 'wave2-forwarding'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
          P6A_SMOKE_MODE: wave2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p6a-production
          node scripts/solo/rehearse-p6a-essential-services-production.mjs >.ci-artifacts/p6a-production/wave2.json
          grep -q COMUN_P6A_ESSENTIAL_FORWARDING_WAVE2_PRODUCTION_GREEN .ci-artifacts/p6a-production/wave2.json
          grep -q '"preparedNeverSent":true' .ci-artifacts/p6a-production/wave2.json
      - name: Roll back affected P6A capability after failed gate
        if: always() && ((inputs.mode == 'wave1-services' && steps.wave1.outcome != 'success') || (inputs.mode == 'wave2-forwarding' && steps.wave2.outcome != 'success'))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          services=enabled
          if test "${{ inputs.mode }}" = wave1-services; then services=disabled; fi
          printf '%s' "$services" | npx --yes vercel@50.28.0 env add COMUN_ESSENTIAL_SERVICES_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-rollback-services.out 2>/tmp/comun-p6a-rollback-services.err
          printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_ESSENTIAL_FORWARDING_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-rollback-forwarding.out 2>/tmp/comun-p6a-rollback-forwarding.err
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-rollback-deploy.out 2>/tmp/comun-p6a-rollback-deploy.err
          rollback_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p6a-rollback-deploy.out | tail -n 1 | tr -d '\r')"
          case "$rollback_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          npx --yes vercel@50.28.0 promote "$rollback_url" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-rollback-promote.out 2>/tmp/comun-p6a-rollback-promote.err
          npx --yes vercel@50.28.0 alias set "$rollback_url" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6a-rollback-alias.out 2>/tmp/comun-p6a-rollback-alias.err
          echo COMUN_P6A_CAPABILITY_ROLLED_BACK_AFTER_FAILED_GATE >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p6a-domain-${{ github.run_id }}
          path: .ci-artifacts/p6a-production
          retention-days: 14
          if-no-files-found: ignore
      - name: Emit wave marker
        if: success() && (inputs.mode == 'wave1-services' || inputs.mode == 'wave2-forwarding')
        shell: bash
        run: |
          if test "${{ inputs.mode }}" = wave1-services; then
            echo COMUN_P6A_ESSENTIAL_SERVICES_DOMAIN_GREEN >> "$GITHUB_STEP_SUMMARY"
          else
            echo COMUN_P6A_ESSENTIAL_FORWARDING_DOMAIN_GREEN_NO_AUTO_SEND >> "$GITHUB_STEP_SUMMARY"
          fi
