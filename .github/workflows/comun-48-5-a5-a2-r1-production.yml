name: COMUN 48.5-A5-A2-R1 artwork schema rollout

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA containing the rollout runner
        required: true
        type: string

concurrency:
  group: comun-48-5-a5-a2-r1-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  A5_A2_FUNCTIONAL_ANCESTOR: 67c41a40d929a2c688d5604fa2fc45560970a13e
  A5_A2_MIGRATION: supabase/migrations/20260824001340_comun_artwork_submission_private_materialization.sql
  A5_A2_MIGRATION_SHA256: b9da07e8da93aa22d41119eb3a0f406176595bd4fbdf96bf1d75e16ddfd02354
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  rollout:
    name: A5-A2-R1 / exact Production artwork schema rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.115.0 }
      - name: Assert exact Production bindings
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" -a -n "$SUPABASE_DB_URL" -a -n "$VERCEL_TOKEN"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - name: Apply exact migration and verify no business writes
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: bash scripts/run-48-5-a5-a2-r1-production.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-5-a5-a2-r1-production-${{ github.run_id }}
          path: .ci-artifacts/48-5-a5-a2-r1-production/
          retention-days: 30
          if-no-files-found: warn
