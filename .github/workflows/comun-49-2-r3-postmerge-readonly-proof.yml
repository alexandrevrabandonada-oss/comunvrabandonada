name: COMUN 49.2 R3 post-merge read-only and disposable proof

on:
  push:
    branches: [codex/comun-49-2-r3-postmerge-readonly]
    paths:
      - .github/workflows/comun-49-2-r3-postmerge-readonly-proof.yml

permissions: { contents: read }

jobs:
  production-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40c111411998da8ea6e2fffc4e682a55af8e6fc2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Require exact merged main and validated manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 40c111411998da8ea6e2fffc4e682a55af8e6fc2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 40c111411998da8ea6e2fffc4e682a55af8e6fc2
          node scripts/49-2-r3-release/validate-manifest.mjs
      - name: Capture Production with SELECT only in a read-only transaction
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/comun-49-2-r3-postmerge
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { loadValidatedR3Manifest } from './scripts/49-2-r3-release/validate-manifest.mjs';
          import { createR3PostgresAdapter } from './scripts/49-2-r3-release/postgres-adapter.mjs';
          import { classifyR3Release } from './scripts/49-2-r3-release/state-machine.mjs';

          const sha = '40c111411998da8ea6e2fffc4e682a55af8e6fc2';
          const { manifest, baseline } = loadValidatedR3Manifest();
          const capture = await createR3PostgresAdapter({
            url: process.env.SUPABASE_DB_URL,
            manifest,
            expectedSha: sha,
          }).capture();
          const classification = classifyR3Release(capture, manifest, baseline);
          const expected = {
            runnerFingerprint: '7e957c3f154efe87f7104915a5b1e095cc77dc04d488bd4041b4c859f5db1b60',
            canonicalFingerprint: 'ce98af56622652e9416ed4c535ed8f202a61c36641e2cec8c21d4433f66cbeff',
          };
          const r1 = capture.migrations.includes('20260901000000');
          const r2 = capture.migrations.includes('20260924015511');
          const accepted = classification.state === 'PRE' &&
            capture.postgresVersion === '17.6' && r1 && r2 &&
            capture.r12Ledger === 'PRESENT_ACCEPTED' &&
            capture.hardeningLedger === 'PRESENT_ACCEPTED' &&
            capture.r3LedgerState === 'ABSENT' &&
            !capture.r3Present && !capture.candidateTablePresent &&
            !capture.candidateBridgePresent && capture.r3TriggerCount === 0 &&
            capture.publicCollectiveRelationCount === 0 &&
            capture.blockingFindings === 0 &&
            capture.runnerFingerprint === expected.runnerFingerprint &&
            capture.canonicalFingerprint === expected.canonicalFingerprint;
          const document = {
            scope: 'COMUN_49_2_R3_POSTMERGE_READ_ONLY',
            sourceMainSha: sha,
            workflowSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            transactionReadOnly: 'on',
            status: accepted ? 'PRE_ACCEPTED' : 'PRODUCTION_DRIFT',
            capture,
            classification,
          };
          writeFileSync('.ci-artifacts/comun-49-2-r3-postmerge/capture.json', JSON.stringify(document, null, 2) + '\n');
          if (!accepted) throw new Error('COMUN_49_2_R3_PRODUCTION_DRIFT');
          console.log('COMUN_49_2_R3_POSTMERGE_PRE_ACCEPTED');
          NODE
      - name: Check sanitization and hash
        shell: bash
        run: |
          set -euo pipefail
          artifact=.ci-artifacts/comun-49-2-r3-postmerge/capture.json
          test -s "$artifact"
          if rg -i 'postgresql://|password|token|secret|@.*supabase\.co' "$artifact"; then
            echo COMUN_R3_POSTMERGE_ARTIFACT_UNSAFE >&2
            exit 1
          fi
          sha256sum "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r3-postmerge-readonly-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r3-postmerge/capture.json
          if-no-files-found: error
          retention-days: 14

  disposable-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40c111411998da8ea6e2fffc4e682a55af8e6fc2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Assert no Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL+x}"
          test -z "${SUPABASE_ACCESS_TOKEN+x}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY+x}"
          test "$(git rev-parse HEAD)" = 40c111411998da8ea6e2fffc4e682a55af8e6fc2
      - name: Reproduce PRE, POST, ledger and replay in disposable Postgres
        run: bash scripts/49-2-r3-release/derive-post.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-49-2-r3-postmerge-disposable-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r3-release
          if-no-files-found: error
          retention-days: 14
