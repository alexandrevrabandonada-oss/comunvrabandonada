name: COMUN P2 authenticated My Area disposable rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/comun-community-experience/my-area-private.spec.ts"
      - "tests/comun-community-experience/global-setup.mjs"
      - "tests/comun-community-experience/global-teardown.mjs"
      - "playwright.comun-community-experience.config.ts"
      - "app/comun/minha-participacao/**"
      - "lib/comun-my-area*"
      - "lib/personal-center.ts"
      - "lib/collective-actions.ts"
      - ".github/workflows/comun-p2-my-area-authenticated-local.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comun-p2-authenticated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  disposable-journey:
    name: P2 / mobile + desktop Auth, task origin and revocation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ALLOW_LOCAL_TESTS: "true"
      VERCEL_ENV: development
      COMUN_BASE_URL: http://127.0.0.1:3017
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3017
      COMUN_COLLECTIVE_ACTIONS_V1: enabled
      COMUN_GOOGLE_AUTH_ENABLED: disabled
      COMUN_TERRITORY_PROFILE_ENABLED: disabled
      COMMUNITY_REGISTRATION_MODE: closed
      COMUN_COLLECTIVE_ACTIONS_PREVIEW_FIXTURES: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Verify disconnected disposable-only environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_PROJECT_REF:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${COMUN_COLLECTIVE_ACTIONS_DATABASE_URL:-}"
          test -z "${NEXT_PUBLIC_SUPABASE_URL:-}"
          echo "COMUN_P2_DISPOSABLE_ONLY"
      - run: npm ci --ignore-scripts
      - name: Start, reset and test against Supabase loopback only
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { supabase stop --no-backup >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          supabase start
          supabase db reset --local --yes
          status_file="$(mktemp)"
          chmod 600 "$status_file"
          trap 'rm -f "$status_file"; cleanup' EXIT
          supabase status -o env > "$status_file"
          export NEXT_PUBLIC_SUPABASE_URL="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$status_file")"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$status_file")"
          export SUPABASE_SERVICE_ROLE_KEY="$(sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p' "$status_file")"
          export COMUN_COLLECTIVE_ACTIONS_DATABASE_URL="$(sed -n 's/^DB_URL="\(.*\)"$/\1/p' "$status_file")"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          [[ "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https?://(localhost|127\.0\.0\.1):[0-9]+/?$ ]]
          [[ "$COMUN_COLLECTIVE_ACTIONS_DATABASE_URL" =~ ^postgres(ql)?://[^@]+@(localhost|127\.0\.0\.1):[0-9]+/postgres ]]
          npx playwright install --with-deps chromium >/dev/null
          node scripts/comun-local-env.mjs run npx playwright test \
            -c playwright.comun-community-experience.config.ts \
            tests/comun-community-experience/my-area-private.spec.ts \
            --project=390x844 --project=1366x768 \
            --grep @p2-authenticated
          echo "COMUN_P2_AUTHENTICATED_MY_AREA_LOCAL_GREEN"
