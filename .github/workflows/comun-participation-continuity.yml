name: COMUN participation continuity UI contract
on:
  pull_request:
    paths:
      - app/comun/minha-participacao/**
      - app/comun/ajuda/primeira-acao/**
      - app/comun/buscar/**
      - components/comun-shell.tsx
      - lib/comun-practice-guidance*
      - tests/participation-continuity/**
      - tests/experience-coherence/participation-paths.spec.ts
      - playwright.participation-continuity.config.ts
      - .github/workflows/comun-participation-continuity.yml
permissions: { contents: read }
jobs:
  synthetic-ui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run lib/comun-practice-guidance.test.ts
      - run: node --test scripts/ci/readonly-reconciled-migration-plan.node-test.mjs scripts/ci/readonly-reconciled-migration-plan-workflows.node-test.mjs
      - run: npx playwright test -c playwright.participation-continuity.config.ts
      - run: npx playwright test -c playwright.experience-coherence.config.ts tests/experience-coherence/participation-paths.spec.ts --project=360x800 --project=1366x768
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: participation-continuity-synthetic-ui
          path: test-results/
          retention-days: 7
