name: COMUN Escola contract

on:
  pull_request:
    paths:
      - 'app/**/escola/**'
      - 'components/learning/**'
      - 'lib/learning/**'
      - 'scripts/learning/**'
      - 'supabase/migrations/*comun_learning*'
      - 'supabase/releases/*comun-learning*'
      - '.github/workflows/comun-learning.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: escola_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: escola-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run lib/learning/core.test.ts app/api/comun/escola/route.test.ts
      - run: node scripts/learning/test-database.mjs
        env:
          COMUN_LEARNING_TEST_DATABASE_URL: postgres://postgres:escola-disposable-only@127.0.0.1:5432/escola_test
          COMUN_LEARNING_DISPOSABLE_DATABASE: 'true'
