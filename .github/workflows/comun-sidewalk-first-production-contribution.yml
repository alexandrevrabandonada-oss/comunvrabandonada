name: COMUN Sidewalk First Production Contribution

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-sidewalk-first-production-contribution.yml"
      - "scripts/solo/run-sidewalk-first-production-contribution.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/comun-sidewalk-first-production-contribution.yml"
      - "scripts/solo/run-sidewalk-first-production-contribution.mjs"

concurrency:
  group: comun-sidewalk-first-production-contribution-20260729-11
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify-contract:
    name: VERIFY / COMUN_SIDEWALK_FIRST_WRITE_AUTOMATION_GREEN
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check scripts/solo/run-sidewalk-first-production-contribution.mjs
      - run: npx prettier --check scripts/solo/run-sidewalk-first-production-contribution.mjs .github/workflows/comun-sidewalk-first-production-contribution.yml
      - run: npm run typecheck
      - run: npm run lint
      - run: git diff --check HEAD^ HEAD
      - name: Verify single-attempt and secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'evidence.submissionAttempt = 1' scripts/solo/run-sidewalk-first-production-contribution.mjs
          grep -q 'retryExecuted: false' scripts/solo/run-sidewalk-first-production-contribution.mjs
          ! grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY=[^$]|SUPABASE_DB_URL=[^$]' \
            scripts/solo/run-sidewalk-first-production-contribution.mjs \
            .github/workflows/comun-sidewalk-first-production-contribution.yml
          echo COMUN_SIDEWALK_FIRST_WRITE_AUTOMATION_GREEN >> "$GITHUB_STEP_SUMMARY"

  production-cycle:
    name: PRODUCTION / COMUN_SIDEWALK_FIRST_CONTRIBUTION
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYCLE_ID: sidewalk-first-production-contribution-20260729-11
      COMUN_BASE_URL: https://comunsocial.online
      COMUN_ARTIFACT_DIR: .ci-artifacts/sidewalk-first-production-contribution
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Execute exactly one controlled production attempt
        run: node scripts/solo/run-sidewalk-first-production-contribution.mjs
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-first-production-contribution-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-first-production-contribution
          if-no-files-found: error
          retention-days: 30
      - name: Update COMUN CENTRAL 39
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result_file=.ci-artifacts/sidewalk-first-production-contribution/result.json
          if [[ ! -f "$result_file" ]]; then
            gh issue comment 39 --body "Tijolo 45.11: execução sem artifact; evidência insuficiente. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          result="$(node -e "const x=require('./$result_file'); process.stdout.write(x.cycleResult)")"
          records="$(node -e "const x=require('./$result_file'); process.stdout.write(String(x.recordCountAfter ?? 'unknown'))")"
          writes="$(node -e "const x=require('./$result_file'); process.stdout.write(x.databaseWrites + '/' + x.storageWrites)")"
          challenge="$(node -e "const x=require('./$result_file'); process.stdout.write(String(x.challengeObserved))")"
          gh issue comment 39 --body "Tijolo 45.11: **$result**. Cycle \`sidewalk-first-production-contribution-20260729-11\`; registros=$records; writes=$writes; desafio_humano=$challenge; retry=false. Evidência sanitizada: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
