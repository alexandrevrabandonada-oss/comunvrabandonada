name: COMUN 49.2-A0-R1 disposable collective entity consent proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-a0-r1-collective-entity-consent-disposable.yml"
      - "supabase/migrations/*_comun_relata_collective_entity_consent_foundation.sql"
      - "lib/comun-collective-entity-consent*.ts"
      - "scripts/49-2-a0-r1-collective-entity-consent-contract.node-test.mjs"
      - "scripts/49-2-a0-r1-collective-entity-consent-disposable.sql"
      - "scripts/ci/classify-migration-lane*.mjs"
      - "reports/current/comun-49-2-a0-collective-entity-consent-foundation.md"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --test scripts/49-2-a0-r1-collective-entity-consent-contract.node-test.mjs scripts/ci/classify-migration-lane.node-test.mjs
      - run: npx vitest run lib/comun-collective-entity-consent.test.ts lib/comun-denuncias-map-readiness.test.ts

  disposable-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.114.0 }
      - name: Prove owner-only foundation, revocation and concurrency on a disposable database
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            if [[ -n "${!secret_name:-}" ]]; then
              echo "Unexpected remote Supabase credential: ${secret_name}" >&2
              exit 1
            fi
          done

          trap 'supabase stop --no-backup || true' EXIT
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --yes
          db="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$db"
          case "$db" in
            *supabase.co*|*localhost*|*127.0.0.1*) ;;
            *)
              echo "Refusing non-local database URL" >&2
              exit 1
              ;;
          esac

          psql "$db" -v ON_ERROR_STOP=1 \
            -f scripts/49-2-a0-r1-collective-entity-consent-disposable.sql

          create_same_request() {
            psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select *
            from private.comun_relata_collective_entity_create_internal(
              '49200000-0000-4000-8000-000000000102',
              '49200000-0000-4000-8000-000000000001',
              'Coletivo de concorrência descartável',
              'collective'
            );
          select pg_catalog.pg_sleep(0.25);
          commit;
          SQL
          }
          create_same_request &
          first_pid=$!
          create_same_request &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_entity uuid;
          begin
            select id into v_entity
              from private.comun_relata_collective_entities
             where creation_request_id='49200000-0000-4000-8000-000000000102';
            if v_entity is null
              or (select count(*) from private.comun_relata_collective_entities
                   where creation_request_id='49200000-0000-4000-8000-000000000102')<>1
              or (select count(*) from private.comun_relata_collective_entity_representations
                   where entity_id=v_entity and user_id='49200000-0000-4000-8000-000000000001')<>1
              or (select count(*) from private.comun_relata_collective_entity_events
                   where entity_id=v_entity and event_type='entity_created')<>1
              or (select count(*) from private.comun_relata_collective_entity_events
                   where entity_id=v_entity and event_type='representation_declared')<>1 then
              raise exception 'concurrent creation was not exactly-once';
            end if;
          end;
          $$;
          SQL

          expect_denied() {
            local role_name="$1"
            local statement="$2"
            local output
            if output="$(psql "$db" -v ON_ERROR_STOP=1 \
              -c "begin; set local role ${role_name}; ${statement}; rollback;" 2>&1)"; then
              echo "Unexpectedly allowed ${role_name}: ${statement}" >&2
              exit 1
            fi
            if ! grep -Eq 'permission denied for (schema|table|function)' <<<"$output"; then
              echo "Unexpected denial for ${role_name}: ${output}" >&2
              exit 1
            fi
          }

          for role_name in anon authenticated service_role; do
            for table_name in \
              private.comun_relata_collective_entities \
              private.comun_relata_collective_entity_representations \
              private.comun_relata_collective_entity_consents \
              private.comun_relata_collective_entity_events; do
              expect_denied "$role_name" "select 1 from ${table_name} limit 1"
              expect_denied "$role_name" "insert into ${table_name} default values"
              expect_denied "$role_name" "update ${table_name} set id=id where false"
              expect_denied "$role_name" "delete from ${table_name} where false"
            done
            expect_denied "$role_name" "select * from private.comun_relata_collective_entity_create_internal('49200000-0000-4000-8000-000000000103','49200000-0000-4000-8000-000000000001','Sem superfície runtime','collective')"
            expect_denied "$role_name" "select * from private.comun_relata_collective_entity_consent_set_internal('49200000-0000-4000-8000-000000000001','49200000-0000-4000-8000-000000000001',true)"
          done

          {
            echo COMUN_49_2_A0_R1_COLLECTIVE_ENTITY_CONSENT_DISPOSABLE_GREEN
            echo runtimeMutationSurface=none
            echo productionBusinessWrites=0
            echo publicMapEnabled=false
          } >> "$GITHUB_STEP_SUMMARY"
