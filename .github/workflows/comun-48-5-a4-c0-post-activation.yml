name: COMUN 48.5-A4-C0 post-activation read-only baseline

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Canonical origin/main SHA at baseline start
        required: true
        type: string
      expected_verifier_sha:
        description: Exact C0 verifier SHA
        required: true
        type: string

concurrency:
  group: comun-48-5-a4-c0-readonly
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_verifier_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Verify post-activation baseline (read-only)
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_VERIFIER_SHA: ${{ inputs.expected_verifier_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: bash scripts/run-48-5-a4-c0-post-activation-readonly.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-5-a4-c0-${{ github.run_id }}
          path: .ci-artifacts/48-5-a4-c0/
          retention-days: 30
          if-no-files-found: warn
