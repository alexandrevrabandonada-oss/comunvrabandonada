name: COMUN Core Journeys Deliverability

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/journeys/**"
      - "scripts/organization/**"
      - "supabase/migrations/*comun_collective*"
      - "tests/core-journeys/**"
      - "playwright.core-journeys.config.ts"
      - "package*.json"
      - ".github/actions/setup-playwright-browser/**"
      - "scripts/ci/install-playwright-browser.mjs"
      - ".github/workflows/comun-core-journeys.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/journeys/**"
      - "supabase/migrations/*comun_collective*"
      - "tests/core-journeys/**"
      - "playwright.core-journeys.config.ts"
      - "package*.json"
      - ".github/actions/setup-playwright-browser/**"
      - "scripts/ci/install-playwright-browser.mjs"
      - ".github/workflows/comun-core-journeys.yml"
  workflow_dispatch:

concurrency:
  group: comun-core-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  m6-authenticated-cycle:
    name: SOC-D10.M6 / authenticated continuity and RLS
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Escopo do ensaio organizativo
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(scripts/organization/|supabase/migrations/[^/]*comun_collective|lib/(community-(mesa|membership|administration)|collective-action)|app/comun/(acoes/|minha-participacao/)|components/community-participation-onboarding|\.github/workflows/comun-core-journeys.yml)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22.19.0
          cache: npm
      - name: Dependências locais e imagens sem credenciais do projeto
        if: steps.scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          docker pull postgres:17
          docker pull public.ecr.aws/supabase/gotrue:v2.196.0
          docker pull public.ecr.aws/supabase/postgrest:v16.2
      - name: Unitários e contratos POSIX em Linux
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run test:unit
          node --test scripts/quality/audit-comun-quality.node-test.mjs scripts/quality/run-comun-quality-performance.node-test.mjs scripts/quality/verify-comun-quality-remote.node-test.mjs scripts/ci/readonly-database-ca.node-test.mjs scripts/experience/audit-comun-experience-coherence.node-test.mjs scripts/ci/verify-codex-preview-checkpoint.node-test.mjs scripts/ci/vercel-build-impact.node-test.mjs
          npm run lint
          npx --yes prettier@3.9.6 --check scripts/organization/*.mjs scripts/organization/README.md .github/workflows/comun-core-journeys.yml
      - name: Build Linux do HEAD exato em contexto somente versionado
        if: steps.scope.outputs.run == 'true'
        run: |
          context="$RUNNER_TEMP/comun-m6-context"
          mkdir -p "$context"
          git archive HEAD | tar -x -C "$context"
          sha="$(git rev-parse HEAD)"
          docker build --build-arg "COMUN_SOURCE_SHA=$sha" -f scripts/organization/Dockerfile -t "comun-m6-proof:${sha:0:12}" "$context"
      - name: Auth A/B, RLS, Mesa HTTP e limpeza isolada
        if: steps.scope.outputs.run == 'true'
        run: node scripts/organization/rehearse-organizational-cycle.mjs --run-disposable --with-next-http --output .ci-artifacts/organization-m6
      - name: Não converter lacuna de segurança em aprovação
        if: steps.scope.outputs.run == 'true'
        run: node -e "const x=require('./.ci-artifacts/organization-m6/authenticated-cycle.json');if(x.result!=='PASS')throw new Error('M6_AUTHENTICATED_CONTINUITY_NOT_CERTIFIED:'+x.result)"
      - name: Preservar somente prova sanitizada
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comun-m6-authenticated-${{ github.run_id }}
          path: .ci-artifacts/organization-m6/*.json
          if-no-files-found: warn
          retention-days: 14

  pr-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Abrir envelope sanitizado
        run: mkdir -p .ci-artifacts/core-journeys && node -e "require('node:fs').writeFileSync('.ci-artifacts/core-journeys/00-envelope.json',JSON.stringify({scope:'pull_request',containsPersonalData:false,containsQueries:false,containsContacts:false,containsCookies:false,containsSessions:false,containsPrivateScreenshots:false},null,2))"
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/setup-playwright-browser
      - name: Auditoria, contratos e matriz negativa
        run: |
          npm run journeys:audit
          npm run journeys:test
          npm run experience:coherence:test
          npm run quality:test
          npm run security:test
      - name: E2E, cinco viewports e acessibilidade
        run: |
          npm run journeys:e2e
          bash scripts/quality/run-with-chromium-crash-retry.sh npm run test:e2e:app-shell-v2
      - name: Regressão focal de qualidade, PWA e performance
        run: npm run journeys:quality-regression
      - name: Regressão focal estática e build
        run: |
          node -e "require('node:fs').rmSync('.next',{recursive:true,force:true})"
          npm run typecheck
          npm run lint
          npm run build
      - name: Formatação focal e whitespace
        run: |
          npx --yes prettier@3.9.6 --check app/actions.ts app/comun/c app/comun/caixa-de-entrada app/comun/criar-conta app/comun/entrar app/comun/explorar app/comun/mapa/contribuir app/comun/minha-participacao app/comun/participar app/comun/relatar/confirmacao components/comun-app-v2-home.tsx components/comun-cards.tsx components/comun-experience-controls.tsx components/comun-journey-confirmation.tsx components/comun-mobile-app-bar.tsx components/comun-state-panel.tsx components/pauta-app-shell.tsx lib/comun-inbox-presentation* lib/comun-journey-context* lib/community-inbox.ts lib/community-return.ts scripts/journeys tests/core-journeys playwright.core-journeys.config.ts .github/workflows/comun-core-journeys.yml
          git diff --check
      - name: Coletar somente evidência agregada
        run: |
          npm run journeys:collect
          cp reports/current/comun-core-journeys-audit.json .ci-artifacts/core-journeys/
          cp reports/current/comun-core-journeys-evidence.json .ci-artifacts/core-journeys/
      - name: Marcador sanitizado de falha
        if: failure()
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/core-journeys/99-failure.json',JSON.stringify({status:'failed',privateArtifactsPublished:false,humanResult:null},null,2))"
      - name: Publicar apenas JSON sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-core-journeys-${{ github.run_id }}
          path: .ci-artifacts/core-journeys/*.json
          if-no-files-found: error
          retention-days: 14

  post-merge-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      COMUN_BASE_URL: https://comunsocial.online
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      NEXT_PUBLIC_SITE_URL: https://comunsocial.online
      COMUN_EXPECTED_SHA: ${{ github.sha }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: mkdir -p .ci-artifacts/core-journeys
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/setup-playwright-browser
      - name: 1. Preflight do SHA em Production
        run: |
          for attempt in $(seq 1 30); do
            observed="$(curl --silent --show-error --fail "$COMUN_BASE_URL/api/comun/quality-status" | node -e "let x='';process.stdin.on('data',d=>x+=d).on('end',()=>{try{process.stdout.write(JSON.parse(x).version||'')}catch{}})")" || true
            if [ "$observed" = "$COMUN_EXPECTED_SHA" ]; then exit 0; fi
            echo "COMUN_CORE_JOURNEYS_DEPLOYMENT_NOT_READY attempt=$attempt"
            sleep 20
          done
          exit 1
      - name: 2. Jornadas públicas
        run: bash scripts/quality/run-with-chromium-crash-retry.sh npm run journeys:e2e
      - name: 3. Autenticação sintética sem publicar dados
        run: node scripts/quality/remote-comun-quality-rehearsal.mjs
      - name: 4. Qualidade focal, PWA e performance
        run: bash scripts/quality/run-with-chromium-crash-retry.sh npm run journeys:quality-regression
      - name: 5. No-leak
        run: npm run smoke:no-leak-http
      - name: 6. Cleanup e coleta sanitizada
        run: |
          npm run journeys:collect
          cp reports/current/comun-core-journeys-audit.json .ci-artifacts/core-journeys/
          cp reports/current/comun-core-journeys-evidence.json .ci-artifacts/core-journeys/
      - name: 7. Classificação técnica, sem resultado humano
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/core-journeys/98-classification.json',JSON.stringify({result:'COMUN_CORE_JOURNEYS_STREAMLINED_READY_FOR_HUMAN_REHEARSAL',humanRehearsal:'pending',realDevices:'pending',assistiveTechnology:'pending',launchPublicly:'not_triggered'},null,2))"
      - name: Marcador sanitizado de falha
        if: failure()
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/core-journeys/99-failure.json',JSON.stringify({status:'failed',privateArtifactsPublished:false,humanResult:null},null,2))"
      - name: Publicar apenas JSON sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-core-journeys-production-${{ github.run_id }}
          path: .ci-artifacts/core-journeys/*.json
          if-no-files-found: error
          retention-days: 14
