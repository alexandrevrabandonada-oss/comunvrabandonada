name: COMUN P3B location reactivation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA to deploy and test
        required: true
        type: string
      mode:
        description: Enable and smoke, or roll back the location flag
        required: true
        type: choice
        options: [rotate-key-activate-smoke, activate-smoke, rollback]

concurrency:
  group: comun-p3b-location-reactivation
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X

jobs:
  reactivate-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Verify exact main and smoke tooling
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm ci --ignore-scripts
          node --check scripts/solo/rehearse-p3b-private-location-production.mjs

      - name: Roll back location flag in Vercel Production
        if: inputs.mode == 'rollback'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          printf '%s' disabled | npx --yes vercel@50.28.0 env update COMUN_RELATA_LOCATION_ENABLED production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-env-rollback.out 2>/tmp/comun-p3b-vercel-env-rollback.err

      - name: Verify server-side location capability names without reading values
        if: inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 env ls production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-env-list.out 2>/tmp/comun-p3b-vercel-env-list.err
          for name in COMUN_RELATA_LOCATION_ENCRYPTION_KEY SUPABASE_SERVICE_ROLE_KEY COMUN_RELATA_PERSISTENCE_ENABLED NEXT_PUBLIC_SUPABASE_URL; do
            grep -q "$name" /tmp/comun-p3b-vercel-env-list.out || { echo "COMUN_P3B_MISSING_SERVER_ENV_NAME:$name"; exit 1; }
          done
          echo COMUN_P3B_SERVER_ENV_NAMES_PRESENT >> "$GITHUB_STEP_SUMMARY"

      - name: Generate and rotate location key entirely in runner memory
        if: inputs.mode == 'rotate-key-activate-smoke'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          LOCATION_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          LOCATION_KEY="$LOCATION_KEY" node - <<'NODE'
          const value = process.env.LOCATION_KEY;
          if (!value || Buffer.from(value, 'base64url').byteLength !== 32 || !/^[A-Za-z0-9_-]+$/.test(value)) process.exit(1);
          console.log('COMUN_P3B_NEW_LOCATION_KEY_VALID_32_BYTES');
          NODE
          printf '%s' "$LOCATION_KEY" | npx --yes vercel@50.28.0 env update COMUN_RELATA_LOCATION_ENCRYPTION_KEY production --yes --sensitive --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-key-config.out 2>/tmp/comun-p3b-key-config.err
          unset LOCATION_KEY
          echo COMUN_P3B_LOCATION_KEY_ROTATED_SERVER_SIDE >> "$GITHUB_STEP_SUMMARY"

      - name: Enable location flag in Vercel Production
        if: inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          printf '%s' enabled | npx --yes vercel@50.28.0 env update COMUN_RELATA_LOCATION_ENABLED production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-env.out 2>/tmp/comun-p3b-vercel-env.err

      - name: Redeploy canonical Production with current server-side secrets
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-deploy.out 2>/tmp/comun-p3b-vercel-deploy.err
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p3b-vercel-deploy.out | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo COMUN_P3B_DEPLOYMENT_URL_UNAVAILABLE; exit 1 ;;
          esac
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Promote the exact deployment to canonical Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npx --yes vercel@50.28.0 promote "$DEPLOYMENT_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-promote.out 2>/tmp/comun-p3b-vercel-promote.err
          npx --yes vercel@50.28.0 alias set "$DEPLOYMENT_URL" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-alias.out 2>/tmp/comun-p3b-vercel-alias.err
          echo COMUN_P3B_CANONICAL_PROMOTION_COMPLETED

      - name: Verify canonical alias points to the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          trap 'rm -f /tmp/comun-p3b-deployment.json /tmp/comun-p3b-aliases.json' EXIT
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID" \
            > /tmp/comun-p3b-deployment.json
          deployment_id="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const deployment = JSON.parse(fs.readFileSync("/tmp/comun-p3b-deployment.json", "utf8"));
          if (typeof deployment.uid !== "string" || !/^(?:dpl_)?[A-Za-z0-9]{8,128}$/.test(deployment.uid)) {
            console.error("COMUN_P3B_DEPLOYMENT_ID_INVALID");
            process.exit(1);
          }
          process.stdout.write(deployment.uid);
          NODE
          )"
          test -n "$deployment_id"
          for _ in $(seq 1 45); do
            if curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID" \
              > /tmp/comun-p3b-aliases.json; then
              if node --input-type=module <<'NODE'
              import fs from "node:fs";
              const response = JSON.parse(fs.readFileSync("/tmp/comun-p3b-aliases.json", "utf8"));
              const aliases = Array.isArray(response.aliases) ? response.aliases : [];
              process.exit(aliases.some((entry) => entry?.alias === "comunsocial.online") ? 0 : 1);
              NODE
              then
                echo COMUN_P3B_CANONICAL_ALIAS_GREEN
                exit 0
              fi
            fi
            sleep 2
          done
          echo COMUN_P3B_BLOCKED_CANONICAL_ALIAS_STALE
          exit 1

      - name: Stop after rollback deployment
        if: inputs.mode == 'rollback'
        run: echo COMUN_P3B_LOCATION_FLAG_ROLLED_BACK_OFF >> "$GITHUB_STEP_SUMMARY"

      - name: Verify location controls are rendered before creating a fixture
        if: inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke'
        run: |
          set -euo pipefail
          page=$(mktemp)
          trap 'rm -f "$page"' EXIT
          found=0
          for _ in $(seq 1 20); do
            curl --connect-timeout 2 --max-time 3 -L -fsS -H 'Cache-Control: no-cache' "https://comunsocial.online/comun/relatar?__p3b_runtime_gate=$GITHUB_RUN_ID" > "$page" || { sleep 2; continue; }
            if grep -q 'Usar localização' "$page"; then
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" != 1 ]; then
            echo COMUN_P3B_BLOCKED_NEW_KEY_NOT_VISIBLE_TO_RUNTIME
            exit 1
          fi

      - name: Allocate sanitized attempt marker
        id: attempt
        if: inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke'
        run: |
          set -euo pipefail
          marker="P3B-SMOKE-${GITHUB_RUN_ID}-$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf 'attempt_id=%s\n' "$marker" >> "$GITHUB_OUTPUT"

      - name: Run real synthetic Production smoke with finally cleanup
        id: smoke
        if: inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke'
        env:
          COMUN_BASE_URL: https://comunsocial.online
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          mkdir -p .ci-artifacts/p3b-production
          node scripts/solo/rehearse-p3b-private-location-production.mjs > .ci-artifacts/p3b-production/smoke.json

      - name: Crash recovery for the exact synthetic attempt
        if: always() && (inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke') && steps.attempt.outcome == 'success' && steps.attempt.outputs.attempt_id != '' && steps.smoke.outcome != 'success'
        env:
          COMUN_BASE_URL: https://comunsocial.online
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          mkdir -p .ci-artifacts/p3b-production
          node scripts/solo/rehearse-p3b-private-location-production.mjs --recover > .ci-artifacts/p3b-production/recovery.json

      - name: Roll back location after failed activation or smoke
        if: always() && (inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke') && steps.smoke.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' disabled | npx --yes vercel@50.28.0 env update COMUN_RELATA_LOCATION_ENABLED production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-env-auto-rollback.out 2>/tmp/comun-p3b-vercel-env-auto-rollback.err
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-auto-rollback-deploy.out 2>/tmp/comun-p3b-vercel-auto-rollback-deploy.err
          rollback_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p3b-vercel-auto-rollback-deploy.out | tail -n 1 | tr -d '\r')"
          case "$rollback_url" in
            https://*.vercel.app) ;;
            *) echo COMUN_P3B_ROLLBACK_DEPLOYMENT_URL_UNAVAILABLE; exit 1 ;;
          esac
          npx --yes vercel@50.28.0 promote "$rollback_url" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-auto-rollback-promote.out 2>/tmp/comun-p3b-vercel-auto-rollback-promote.err
          npx --yes vercel@50.28.0 alias set "$rollback_url" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p3b-vercel-auto-rollback-alias.out 2>/tmp/comun-p3b-vercel-auto-rollback-alias.err
          echo COMUN_P3B_LOCATION_ROLLED_BACK_AFTER_FAILED_SMOKE >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-p3b-production-${{ github.run_id }}
          path: .ci-artifacts/p3b-production
          retention-days: 14
          if-no-files-found: ignore

      - name: Emit terminal marker
        if: success() && (inputs.mode == 'activate-smoke' || inputs.mode == 'rotate-key-activate-smoke')
        run: echo COMUN_P3B_PRIVATE_EVIDENCE_DOMAIN_GREEN >> "$GITHUB_STEP_SUMMARY"
