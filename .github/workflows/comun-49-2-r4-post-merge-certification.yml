name: COMUN 49.2 R4 post-merge read-only certification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/comun-49-2-r4-post-merge-certification.yml
      - scripts/49-2-r4-release/capture-post-merge-production.mjs

permissions: { contents: read }

jobs:
  production-readonly:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/comun-49-2-r4-post-merge-certification' &&
      github.event.pull_request.base.sha == 'ca819eef408e1c83df5505c2e0489fd51087e63b'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca819eef408e1c83df5505c2e0489fd51087e63b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Confirm immutable main source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ca819eef408e1c83df5505c2e0489fd51087e63b
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = ca819eef408e1c83df5505c2e0489fd51087e63b
      - name: Capture exact R4 PRE in Production read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
          COMUN_R4_POST_MERGE_MAIN_SHA: ca819eef408e1c83df5505c2e0489fd51087e63b
        run: |
          node candidate/scripts/49-2-r4-release/capture-post-merge-production.mjs             --output=.ci-artifacts/comun-49-2-r4-post-merge/production.json
      - name: Validate sanitized capture
        shell: bash
        run: |
          set -euo pipefail
          test -s .ci-artifacts/comun-49-2-r4-post-merge/production.json
          if rg -i 'postgresql://|password|token|secret|@.*supabase\.co'             .ci-artifacts/comun-49-2-r4-post-merge/production.json; then
            echo COMUN_R4_POST_MERGE_ARTIFACT_UNSAFE >&2
            exit 1
          fi
          sha256sum .ci-artifacts/comun-49-2-r4-post-merge/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r4-post-merge-production-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r4-post-merge/production.json
          if-no-files-found: error
          retention-days: 14

  disposable-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ca819eef408e1c83df5505c2e0489fd51087e63b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Assert no Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL+x}"
          test -z "${SUPABASE_ACCESS_TOKEN+x}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY+x}"
      - name: Rehearse immutable R4 PRE, POST, ledger and replay
        run: bash scripts/49-2-r4-release/derive-post.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-49-2-r4-post-merge-disposable-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r4-release
          if-no-files-found: error
          retention-days: 14
