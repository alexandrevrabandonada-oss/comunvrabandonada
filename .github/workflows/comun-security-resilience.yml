name: COMUN Security Resilience Deliverability

on:
  pull_request:
    paths:
      - ".github/workflows/comun-security-resilience.yml"
      - "app/comun/admin/auditoria/**"
      - "app/api/internal/security/**"
      - "docs/comun-*.md"
      - "lib/comun-security-resilience.ts"
      - "lib/security/**"
      - "scripts/security/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      mode:
        description: Local lane or complete remote/isolated rehearsal
        required: true
        type: choice
        default: local
        options:
          - local
          - full
          - dual-key

concurrency:
  group: comun-security-resilience-${{ github.ref }}-${{ inputs.mode || 'pr' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare-cron-dual-key:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dual-key'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
      ARCHIVE_PROCESSING_CRON_SECRET: ${{ secrets.ARCHIVE_PROCESSING_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare linked project without reading protected values
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_TEAM_ID"
          test -n "$VERCEL_CANONICAL_PROJECT_ID"
          test -n "$ARCHIVE_PROCESSING_CRON_SECRET"
          umask 077
          mkdir -p .vercel
          node -e "require('node:fs').writeFileSync('.vercel/project.json',JSON.stringify({projectId:process.env.VERCEL_CANONICAL_PROJECT_ID,orgId:process.env.VERCEL_TEAM_ID}))"
      - name: Install additive cron key and redeploy without removing current key
        run: |
          set +x
          output="${{ runner.temp }}/comun-vercel-dual-key.log"
          if ! printf '%s' "$ARCHIVE_PROCESSING_CRON_SECRET" | npx --yes vercel@50.28.0 env add CRON_SECRET_NEXT production --sensitive --force --yes --token="$VERCEL_TOKEN" >"$output" 2>&1; then
            node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeFailureEvidence('cron_dual_key_install',new Error('COMUN_CRON_DUAL_KEY_INSTALL_FAILED')))"
            exit 1
          fi
          if ! npx --yes vercel@50.28.0 deploy --prod --yes --force --token="$VERCEL_TOKEN" --no-color >"$output" 2>&1; then
            node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeFailureEvidence('cron_dual_key_redeploy',new Error('COMUN_CRON_DUAL_KEY_REDEPLOY_FAILED')))"
            exit 1
          fi
          node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeEvidence('05-cron-dual-key.json',{result:'COMUN_CRON_DUAL_KEY_STAGED',currentKeyPreserved:true,nextKeyInstalled:true,valuesExposed:false,productionRedeployed:true}))"
      - name: Cleanup private command output
        if: always()
        run: |
          rm -f "${{ runner.temp }}/comun-vercel-dual-key.log"
          rm -rf .vercel
      - name: Publish sanitized dual-key evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-security-resilience-dual-key-${{ github.sha }}-${{ github.run_id }}
          path: .security-evidence/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  role-catalog-disposable:
    name: SOC-D10.M7.E / synthetic role reconstruction (no provider replay)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Prepare sanitized artifact folder
        run: mkdir -p .ci-artifacts/security-role-lab
      - name: Verify role metadata capture contract without project credentials
        run: node --test scripts/security/recovery-role-contract.node-test.mjs
      - name: Verify the exact PostgreSQL image ID and refuse drift
        run: |
          image='postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" > "$RUNNER_TEMP/comun-role-image.json"
          node scripts/security/recovery-role-image.mjs "$RUNNER_TEMP/comun-role-image.json"
      - name: Reconstruct only fixed synthetic least-privilege roles in isolated Docker
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/comun-role-lab-$GITHUB_RUN_ID"
          node scripts/security/rehearse-recovery-role-catalog.mjs --run-disposable --output "$output"
          node -e "
          const fs = require('node:fs');
          const path = require('node:path');
          const x = JSON.parse(fs.readFileSync(path.join(process.argv[1], 'role-catalog-rehearsal.json'), 'utf8'));
          if (x.sha !== process.env.EXPECTED_SHA || x.result !== 'PASS' ||
              x.checks.length < 17 || x.checks.some(c => c.result !== 'PASS') ||
              x.cleanupVerified !== true || x.remoteWrites !== false ||
              x.credentialsRead !== false || x.recoveryComplete !== false ||
              x.sourceRoleWrites !== 'SYNTHETIC_LAB_ONLY' ||
              x.kind !== 'ROLE_CATALOG_SYNTHETIC_MINIMAL_RECONSTRUCTION_NOT_PROVIDER_RESTORE')
            throw new Error('COMUN_M7E_SYNTHETIC_ROLE_LAB_NOT_CERTIFIED');
          fs.copyFileSync(path.join(process.argv[1], 'role-catalog-rehearsal.json'),
            '.ci-artifacts/security-role-lab/rehearsal.json');
          " "$output"
      - name: Publish only sanitized metadata and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-m7e-synthetic-role-reconstruction-${{ github.run_id }}
          path: .ci-artifacts/security-role-lab/rehearsal.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  pr-lane:
    if: github.event_name == 'pull_request' || inputs.mode == 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The secrets gate scans 30 real commits; shallow boundaries create
          # synthetic root patches and can overflow the history scan buffer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Create sanitized run envelope before any test
        run: node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeEvidence('00-run-envelope.json',{status:'started',scope:'local',containsPrivateData:false,containsSecretMaterial:false}))"
      - run: npm ci --ignore-scripts
      - name: Repository and recent-history secrets boundary
        run: npm run security:secrets
      - name: Start disposable Supabase
        run: supabase start
      - name: Build application against disposable services
        run: node scripts/comun-local-env.mjs run npm run build
      - name: Verify generated client bundles and source maps
        run: npm run security:secrets
      - name: Complete RLS and catalog matrix
        run: |
          npm run security:rls:local
          COMUN_RLS_SKIP_HTTP=1 node scripts/comun-local-env.mjs run npm run smoke:rls-matrix
      - name: Synthetic database backup and application restore
        run: npm run security:restore:database:local
      - name: Synthetic Storage loss and restore
        run: npm run security:restore:storage:local
      - name: Migration recovery
        run: npm run security:migration-recovery
      - name: Deployment rollback contract
        run: npm run security:deployment-rollback:local
      - name: Retention dry-run contract
        run: |
          npm run security:retention
          npm run security:provider-capability
      - name: Incident response rehearsal
        run: |
          node scripts/comun-local-env.mjs run npm run smoke:editorial-incidents
          npm run security:incidents
      - name: Static security workflow and UI contracts
        run: npm run security:test
      - name: Typecheck, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:unit
      - name: Aggregate local readiness without declaring remote green
        run: npm run security:collect:local
      - name: Stop and erase disposable Supabase
        if: always()
        run: supabase stop --no-backup || true
      - name: Finalize sanitized failure evidence
        if: failure()
        run: node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeFailureEvidence('pr_lane',new Error('COMUN_SECURITY_PR_LANE_FAILED')))"
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-security-resilience-local-${{ github.sha }}-${{ github.run_id }}
          path: .security-evidence/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  remote-full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      COMUN_SECURITY_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
      ARCHIVE_PROCESSING_ENDPOINT: ${{ secrets.ARCHIVE_PROCESSING_ENDPOINT }}
      ARCHIVE_PROCESSING_CRON_SECRET: ${{ secrets.ARCHIVE_PROCESSING_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Emit failure-safe run envelope before remote access
        run: node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeEvidence('00-run-envelope.json',{status:'started',scope:'remote',containsPrivateData:false,containsSecretMaterial:false}))"
      - run: npm ci --ignore-scripts
      - name: Preflight target, capabilities and required boundaries
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_TEAM_ID"
          test -n "$VERCEL_CANONICAL_PROJECT_ID"
          npm run security:secrets
          npm run security:rls:remote
      - name: Pull protected Storage configuration into ephemeral workspace
        env:
          COMUN_VERCEL_ENV_FILE: ${{ runner.temp }}/comun-production.env
        run: |
          umask 077
          mkdir -p .vercel
          node -e "require('node:fs').writeFileSync('.vercel/project.json',JSON.stringify({projectId:process.env.VERCEL_CANONICAL_PROJECT_ID,orgId:process.env.VERCEL_TEAM_ID}))"
          if ! npx --yes vercel@50.28.0 env pull "$COMUN_VERCEL_ENV_FILE" --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null; then
            node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeFailureEvidence('storage_configuration',new Error('COMUN_STORAGE_CONFIGURATION_PULL_FAILED')))"
            exit 1
          fi
          test -s "$COMUN_VERCEL_ENV_FILE"
      - name: Verify protected Storage boundary without exposing values
        env:
          COMUN_SECURITY_VERCEL_ENV_FILE: ${{ runner.temp }}/comun-production.env
        run: node scripts/security/audit-comun-storage-boundary.mjs
      - name: Start isolated application services
        run: supabase start
      - name: Build against isolated application services
        run: node scripts/comun-local-env.mjs run npm run build
      - name: Create ephemeral remote database backup and restore it
        run: npm run security:restore:database:remote
      - name: Back up physical Storage and rehearse synthetic restore
        env:
          COMUN_SECURITY_VERCEL_ENV_FILE: ${{ runner.temp }}/comun-production.env
        run: |
          npm run security:secrets
          npm run security:restore:storage:runtime
      - name: Migration recovery in a disposable database
        run: npm run security:migration-recovery
      - name: Deployment rollback without changing public traffic
        run: |
          npm run health:production
          npm run security:deployment-rollback:remote
      - name: Retention and incident postflight
        run: |
          npm run security:retention
          npm run security:provider-capability
          node scripts/comun-local-env.mjs run npm run smoke:editorial-incidents
          npm run security:incidents
          npm run security:test
      - name: Promote evidence only when every isolated check is green
        run: npm run security:collect:remote
      - name: Postflight cleanup
        if: always()
        run: |
          rm -f "${{ runner.temp }}/comun-production.env"
          rm -rf .vercel
          supabase stop --no-backup || true
      - name: Finalize sanitized failure evidence
        if: failure()
        run: node -e "import('./scripts/security/comun-security-contract.mjs').then(m=>m.writeFailureEvidence('remote_full_lane',new Error('COMUN_SECURITY_REMOTE_FULL_LANE_FAILED')))"
      - name: Publish aggregate sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-security-resilience-remote-${{ github.sha }}-${{ github.run_id }}
          path: .security-evidence/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
