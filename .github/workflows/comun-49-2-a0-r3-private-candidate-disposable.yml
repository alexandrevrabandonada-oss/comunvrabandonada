name: COMUN 49.2-A0-R3 private candidate disposable proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-a0-r3-private-candidate-disposable.yml"
      - "supabase/migrations/*_comun_relata_collective_entity_private_candidate.sql"
      - "lib/comun-collective-entity-runtime*.ts"
      - "lib/comun-collective-entity-consent*.ts"
      - "app/comun/entidades/actions.ts"
      - "scripts/49-2-a0-r3-*"
      - "scripts/ci/classify-migration-lane*.mjs"
      - "supabase/release-bundles/20260924-comun-49-2-r3-private-candidate.json"

permissions: { contents: read }

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node --test scripts/ci/classify-migration-lane.node-test.mjs scripts/49-2-a0-r3-private-candidate-contract.node-test.mjs
      - run: npx vitest run lib/comun-collective-entity-runtime.test.ts lib/comun-collective-entity-consent.test.ts
      - run: node scripts/ci/validate-security-definer-migrations.mjs supabase/migrations/20260924225210_comun_relata_collective_entity_private_candidate.sql
      - run: npm run db:privileges:lint

  disposable-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: npm ci --ignore-scripts
      - name: R1 + R2 + R3 local Auth, Postgres, ownership, invalidation and concurrency
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            if [[ -n "${!secret_name:-}" ]]; then
              echo "Unexpected remote Supabase credential: ${secret_name}" >&2
              exit 1
            fi
          done
          trap 'supabase stop --no-backup || true' EXIT
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --yes
          status="$(supabase status -o json)"
          db="$(jq -r '.DB_URL' <<<"$status")"
          export COMUN_R2_LOCAL_API_URL="$(jq -r '.API_URL' <<<"$status")"
          export COMUN_R2_LOCAL_SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status")"
          case "$db" in
            postgresql://*@127.0.0.1:*/*|postgresql://*@localhost:*/*) ;;
            *) echo 'Refusing non-local database URL' >&2; exit 1 ;;
          esac
          users="$RUNNER_TEMP/comun-r3-auth-users.json"
          node scripts/49-2-a0-r2-disposable-auth-users.mjs "$users"
          actor_a="$(jq -r '.a' "$users")"
          actor_b="$(jq -r '.b' "$users")"
          psql "$db" -v ON_ERROR_STOP=1 -v actor_a="$actor_a" -v actor_b="$actor_b" \
            -f scripts/49-2-a0-r3-private-candidate-disposable.sql
          COMUN_SIDEWALK_OPERATIONAL_DATABASE_URL="$db" \
            node scripts/ci/assert-zero-security-findings.mjs

          # Independent connections race on the same explicit request and entity.
          psql "$db" -v ON_ERROR_STOP=1 -v actor="$actor_a" <<'SQL'
          begin;
          set local role service_role;
          select entity_id from public.comun_relata_collective_entity_server_create(
            '49200000-0000-4000-8000-000000000320', :'actor'::uuid,
            'Coletivo concorrente', 'collective');
          commit;
          SQL
          entity="$(psql "$db" -At -v ON_ERROR_STOP=1 -c "select id from private.comun_relata_collective_entities where creation_request_id='49200000-0000-4000-8000-000000000320'")"
          psql "$db" -v ON_ERROR_STOP=1 -v actor="$actor_a" -v entity="$entity" <<'SQL'
          begin;
          set local role service_role;
          select * from public.comun_relata_collective_entity_server_consent_set(
            :'actor'::uuid, :'entity'::uuid,true);
          commit;
          SQL
          race() {
            psql "$db" -v ON_ERROR_STOP=1 -v actor="$actor_a" -v entity="$entity" <<'SQL'
          begin;
          set local role service_role;
          select * from public.comun_relata_collective_entity_server_candidate_prepare(
            '49200000-0000-4000-8000-000000000321', :'actor'::uuid, :'entity'::uuid);
          commit;
          SQL
          }
          race & first=$!
          race & second=$!
          wait "$first"
          wait "$second"
          psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if (select count(*) from private.comun_relata_collective_entity_candidates
              where generation_request_id='49200000-0000-4000-8000-000000000321')<>1 then
              raise exception 'R3 concurrent request created duplicate candidates';
            end if;
          end;
          $$;
          SQL
          for role_name in anon authenticated; do
            if output="$(psql "$db" -v ON_ERROR_STOP=1 \
              -c "begin; set local role $role_name; select * from public.comun_relata_collective_entity_server_candidate_prepare(null,'$actor_a',null); rollback;" 2>&1)"; then
              echo "R3 bridge directly executable by $role_name" >&2
              exit 1
            fi
            grep -q 'permission denied for function' <<<"$output"
          done
          echo 'COMUN_49_2_A0_R3_DISPOSABLE_GREEN' >> "$GITHUB_STEP_SUMMARY"
