name: COMUN 49.2-A0-R5 canonical migration filename

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-a0-r5-migration-name.yml"

permissions: { contents: read }

jobs:
  generate-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - name: Generate canonical R5 migration filename only
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          supabase migration new comun_relata_collective_entity_public_projection_gate
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          generated="$(comm -13 "$before" "$after")"
          test "$(printf '%s\n' "$generated" | sed '/^$/d' | wc -l)" -eq 1
          printf 'COMUN_R5_GENERATED_MIGRATION=%s\n' "$generated" | tee "$RUNNER_TEMP/r5-migration-name.txt"
          test -s "supabase/migrations/$generated"
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r5-migration-name-${{ github.run_id }}
          path: ${{ runner.temp }}/r5-migration-name.txt
          if-no-files-found: error
          retention-days: 1
