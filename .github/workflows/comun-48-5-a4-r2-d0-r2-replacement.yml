name: COMUN 48.5-A4-R2-D0-R2 deployment-contained A4 replacement
# Final candidate: containment OFF is promoted before any project-env deletion.

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact origin/main SHA for the deployment-contained replacement
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/comun-48-5-a4-r2-d0-r2-replacement.yml"
      - "scripts/run-48-5-a4-d0-r2-replacement.sh"
      - "scripts/ci/a4-d0-r1-env-repair-contract.mjs"
      - "scripts/ci/a4-d0-r1-env-repair-contract.node-test.mjs"

concurrency:
  group: comun-48-5-a4-r2-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X

jobs:
  replacement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha || github.sha }}
          fetch-depth: 0

      - name: Require one-shot marker on push
        if: github.event_name == 'push'
        run: git log -1 --format=%B | grep -F '[a4-d0-r2-run]'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Wait for conflicting production Actions to settle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const owner = 'alexandrevrabandonada-oss';
          const repo = 'comunvrabandonada';
          const own = Number(process.env.SELF_RUN_ID || 0);
          const deadline = Date.now() + 12 * 60 * 1000;
          const conflict = (run) => run.id !== own && (
            /48\.5-A4-R2/.test(run.name || '') ||
            /(production|deploy|rollout|activation)/i.test(run.name || '')
          );
          while (true) {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?status=in_progress&per_page=100`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error(`A4_D0_R2_ACTIONS_WAIT_HTTP_${response.status}`);
            const data = await response.json();
            const conflicts = (data.workflow_runs || []).filter(conflict);
            if (conflicts.length === 0) break;
            if (Date.now() >= deadline) {
              throw new Error(`A4_D0_R2_ACTIONS_WAIT_TIMEOUT_${conflicts.map((run) => run.id).join('_')}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 15000));
          }
          NODE

      - name: Replace A4 only behind an explicit OFF containment deployment
        env:
          EXPECTED_MAIN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_main_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: bash scripts/run-48-5-a4-d0-r2-replacement.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-5-a4-r2-d0-r2-replacement-${{ github.run_id }}
          path: .ci-artifacts/48-5-a4-r2-d0-r2/
          retention-days: 30
          if-no-files-found: warn
