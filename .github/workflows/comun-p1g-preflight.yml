name: COMUN P1G Google Auth preflight

on:
  pull_request:
    paths:
      - ".github/workflows/comun-p1g-preflight.yml"
      - "app/actions.ts"
      - "app/comun/auth/**"
      - "app/comun/entrar/**"
      - "app/comun/criar-conta/**"
      - "app/comun/completar-conta/**"
      - "components/community-auth-form.tsx"
      - "components/community-google-completion-form.tsx"
      - "lib/community-google-auth*"
      - "lib/community-return*"
      - "scripts/solo/*p1g*"
      - "tests/google-auth-local/**"
      - "playwright.google-auth-local.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comun-p1g-google-auth-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTERNAL_MIGRATION: supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
  PRODUCTION_SITE_URL: https://comunsocial.online
  PRODUCTION_REDIRECT_URL: https://comunsocial.online/comun/auth/callback

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: npm ci --ignore-scripts

      - name: Validate zero-migration and credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          case "$SUPABASE_DB_URL" in *localhost*|*127.0.0.1*) exit 1 ;; esac
          test -z "$(git diff --name-only origin/main...HEAD -- supabase/migrations)"
          node --test scripts/solo/p1g-google-auth-workflow.node-test.mjs

      - name: Confirm P6A terminal schema metadata without business-row reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p1g-preflight
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/p1g-preflight/schema.json <<'SQL'
          begin read only;
          select json_build_object(
            'p6aMigrationPresent', exists(select 1 from supabase_migrations.schema_migrations where version='20260809133923'),
            'waterSupplyPresent', exists(
              select 1 from pg_catalog.pg_constraint
              where conrelid='public.comun_relata_cases'::regclass
                and conname='comun_relata_cases_category_check'
                and pg_catalog.pg_get_constraintdef(oid) like '%water_supply%'
            ),
            'businessRowsRead', false,
            'transactionReadOnly', true
          );
          rollback;
          SQL
          node - <<'NODE'
          const fs=require('node:fs');
          const state=JSON.parse(fs.readFileSync('.ci-artifacts/p1g-preflight/schema.json','utf8'));
          if(!state.p6aMigrationPresent||!state.waterSupplyPresent||state.businessRowsRead!==false||state.transactionReadOnly!==true) throw new Error('COMUN_P1G_BLOCKED_INITIAL_STATE_DRIFT');
          NODE

      - name: Inspect public Auth provider state without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/comun-p1g-public-auth-settings.json"
          curl -fsS --retry 3 --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/settings" >"$settings"
          SETTINGS_FILE="$settings" node - <<'NODE'
          const fs=require('node:fs');
          const settings=JSON.parse(fs.readFileSync(process.env.SETTINGS_FILE,'utf8'));
          const googleProviderEnabled=settings?.external?.google===true;
          fs.writeFileSync('.ci-artifacts/p1g-preflight/public-auth.json',JSON.stringify({
            googleProviderEnabled,
            clientIdRead:false,
            clientSecretRead:false,
            providerTokenRead:false,
            source:'public_auth_settings'
          },null,2)+'\n');
          NODE

      - name: Inspect Management Auth metadata when an access token is available
        shell: bash
        run: |
          set -euo pipefail
          if test -z "${SUPABASE_ACCESS_TOKEN:-}"; then
            printf '%s\n' '{"managementMetadataAccessible":false,"result":"COMUN_P1G_MANAGEMENT_METADATA_UNAVAILABLE"}' >.ci-artifacts/p1g-preflight/management-auth.json
            exit 0
          fi
          config="$RUNNER_TEMP/comun-p1g-management-auth-config.json"
          curl -fsS --retry 3 --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" >"$config"
          CONFIG_FILE="$config" node - <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync(process.env.CONFIG_FILE,'utf8'));
          const redirects=String(config.uri_allow_list??'').split(',').map(value=>value.trim()).filter(Boolean);
          const productionRedirect=process.env.PRODUCTION_REDIRECT_URL;
          const broadProductionWildcard=redirects.some(value=>value.includes('comunsocial.online')&&value!==productionRedirect);
          const result={
            managementMetadataAccessible:true,
            siteUrlExact:config.site_url===process.env.PRODUCTION_SITE_URL,
            productionRedirectExact:redirects.includes(productionRedirect),
            broadProductionWildcard,
            googleProviderEnabled:config.external_google_enabled===true,
            googleClientIdConfigured:Boolean(String(config.external_google_client_id??'').trim()),
            googleClientSecretConfigured:Boolean(String(config.external_google_secret??'').trim()),
            secretValueRecorded:false,
            redirectValuesRecorded:false
          };
          result.configurationGreen=result.siteUrlExact&&result.productionRedirectExact&&!result.broadProductionWildcard&&result.googleProviderEnabled&&result.googleClientIdConfigured&&result.googleClientSecretConfigured;
          fs.writeFileSync('.ci-artifacts/p1g-preflight/management-auth.json',JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Reconcile Calçadas and prove empty remote migration plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          held="$RUNNER_TEMP/comun-p1g-external-ledger.sql"
          mv "$EXTERNAL_MIGRATION" "$held"
          restore() {
            test ! -e "$held" || mv "$held" "$EXTERNAL_MIGRATION"
            test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          }
          trap restore EXIT
          supabase migration list --db-url "$SUPABASE_DB_URL" >.ci-artifacts/p1g-preflight/migration-list.txt 2>&1
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/p1g-preflight/dry-run.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/p1g-preflight/dry-run.txt | sort -u || true)
          test "${#planned[@]}" -eq 0 || { echo COMUN_P1G_BLOCKED_UNEXPECTED_REMOTE_MIGRATION_PLAN; exit 1; }
          ! grep -Eq -- '--include-all|migration repair|db reset|seed' .ci-artifacts/p1g-preflight/dry-run.txt
          printf '%s\n' '{"result":"COMUN_P1G_REMOTE_MIGRATION_PLAN_EMPTY","migrationCount":0,"includeAll":false,"repair":false,"reset":false,"seed":false}' >.ci-artifacts/p1g-preflight/migration-plan.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p1g-preflight-${{ github.run_id }}
          path: .ci-artifacts/p1g-preflight
          retention-days: 14
          if-no-files-found: error

      - name: Emit bounded result
        if: success()
        shell: bash
        run: |
          if grep -q '"configurationGreen":true' .ci-artifacts/p1g-preflight/management-auth.json; then
            echo COMUN_P1G_PROVIDER_CONFIGURATION_METADATA_GREEN >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"googleProviderEnabled": true' .ci-artifacts/p1g-preflight/public-auth.json; then
            echo COMUN_P1G_PROVIDER_PUBLIC_METADATA_GREEN >> "$GITHUB_STEP_SUMMARY"
          else
            echo COMUN_P1G_PROVIDER_CONFIGURATION_HUMAN_ACTION_REQUIRED >> "$GITHUB_STEP_SUMMARY"
          fi
          echo COMUN_P1G_REMOTE_MIGRATION_PLAN_EMPTY >> "$GITHUB_STEP_SUMMARY"
