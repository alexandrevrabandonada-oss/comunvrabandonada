name: COMUN P6C-B1 private public Education activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string
      mode:
        description: Promote migration with flags off, deploy flags off, activate private public Education routing, or roll it back
        required: true
        type: choice
        options:
          [
            promote-migration-flags-off,
            flags-off,
            wave1-private-routing,
            rollback-private-routing,
          ]

concurrency:
  group: comun-p6c-b1-private-education-activation
  cancel-in-progress: false
permissions:
  contents: read

env:
  EXTERNAL_MIGRATION: supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
  P6C_B1_MIGRATION: supabase/migrations/20260810155310_comun_public_education_sensitive_routing.sql
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Verify exact main and scoped activation plan
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm ci --ignore-scripts
          node --check scripts/solo/rehearse-p6c-b1-public-education-private-production.mjs
          test "$(find supabase/migrations -maxdepth 1 -type f | grep -Ei 'public_(health|education)_sensitive_routing' | wc -l)" -eq 2
          test -f supabase/migrations/20260810143000_comun_public_health_sensitive_routing.sql
          test -f "$P6C_B1_MIGRATION"
          ! grep -Eqi 'window\.open|wa\.me|mailto:|person_declared_sent' scripts/solo/rehearse-p6c-b1-public-education-private-production.mjs
          ! grep -Eqi '\bdelete[[:space:]]+from\b' scripts/solo/rehearse-p6c-b1-public-education-private-production.mjs
      - name: Promote the exact forward-only P6C-B1 migration
        if: inputs.mode == 'promote-migration-flags-off'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          case "$SUPABASE_DB_URL" in *localhost*|*127.0.0.1*) exit 1 ;; esac
          mkdir -p .ci-artifacts/p6cb1-production
          test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          held="$RUNNER_TEMP/comun-p6cb1-external-ledger.sql"
          mv "$EXTERNAL_MIGRATION" "$held"
          restore() {
            test ! -e "$held" || mv "$held" "$EXTERNAL_MIGRATION"
            test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          }
          trap restore EXIT
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/p6cb1-production/migration-dry-run.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/p6cb1-production/migration-dry-run.txt | sort -u || true)
          test "${#planned[@]}" -eq 1
          test "${planned[0]}" = "$(basename "$P6C_B1_MIGRATION")"
          ! grep -Eq -- '--include-all|migration repair|db reset|seed' .ci-artifacts/p6cb1-production/migration-dry-run.txt
          supabase db push --db-url "$SUPABASE_DB_URL" >.ci-artifacts/p6cb1-production/migration-push.txt 2>&1
          restore
          trap - EXIT
      - name: Postflight P6C-B1 schema without business-row reads
        if: inputs.mode == 'promote-migration-flags-off'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/p6cb1-production/schema-postflight.json <<'SQL'
          begin read only;
          select json_build_object(
            'migrationApplied', exists(select 1 from supabase_migrations.schema_migrations where version='20260810155310'),
            'healthRoutingPreserved', pg_catalog.pg_get_functiondef('public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)'::regprocedure) like '%comun-health-service-routing-v1%',
            'educationRoutingVersionAccepted', pg_catalog.pg_get_functiondef('public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)'::regprocedure) like '%comun-education-service-routing-v1%',
            'educationSubtypePreserved', pg_catalog.pg_get_functiondef('public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)'::regprocedure) like '%educationIssueType%',
            'educationTransitionAccepted', pg_catalog.pg_get_functiondef('public.comun_relata_classification_transition(text,text,text,text,jsonb)'::regprocedure) like '%public_education%',
            'educationPrivacyFloorEnforced', pg_catalog.pg_get_functiondef('public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)'::regprocedure) ~ 'restricted.*sensitive.*high_risk',
            'casesRlsForced', (select relrowsecurity and relforcerowsecurity from pg_catalog.pg_class where oid='public.comun_relata_cases'::regclass),
            'reportsRlsForced', (select relrowsecurity and relforcerowsecurity from pg_catalog.pg_class where oid='private.comun_relata_reports'::regclass),
            'anonCreate', has_function_privilege('anon','public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)','EXECUTE'),
            'authenticatedCreate', has_function_privilege('authenticated','public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)','EXECUTE'),
            'serviceCreate', has_function_privilege('service_role','public.comun_relata_create(text,text,text,jsonb,text,text,text,jsonb,text,text)','EXECUTE'),
            'anonTransition', has_function_privilege('anon','public.comun_relata_classification_transition(text,text,text,text,jsonb)','EXECUTE'),
            'authenticatedTransition', has_function_privilege('authenticated','public.comun_relata_classification_transition(text,text,text,text,jsonb)','EXECUTE'),
            'serviceTransition', has_function_privilege('service_role','public.comun_relata_classification_transition(text,text,text,text,jsonb)','EXECUTE'),
            'anonWalletAttach', has_function_privilege('anon','public.comun_participation_wallet_attach_relata(text,text,text)','EXECUTE'),
            'authenticatedWalletAttach', has_function_privilege('authenticated','public.comun_participation_wallet_attach_relata(text,text,text)','EXECUTE'),
            'serviceWalletAttach', has_function_privilege('service_role','public.comun_participation_wallet_attach_relata(text,text,text)','EXECUTE'),
            'businessRowsRead', false
          );
          rollback;
          SQL
          node - <<'NODE'
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync('.ci-artifacts/p6cb1-production/schema-postflight.json','utf8'));
          if(!s.migrationApplied||!s.healthRoutingPreserved||!s.educationRoutingVersionAccepted||!s.educationSubtypePreserved||!s.educationTransitionAccepted||!s.educationPrivacyFloorEnforced||!s.casesRlsForced||!s.reportsRlsForced||s.anonCreate||s.authenticatedCreate||!s.serviceCreate||s.anonTransition||s.authenticatedTransition||!s.serviceTransition||s.anonWalletAttach||s.authenticatedWalletAttach||!s.serviceWalletAttach||s.businessRowsRead!==false) throw new Error('COMUN_P6C_B1_POSTFLIGHT_FAILED');
          NODE
          psql "$SUPABASE_DB_URL" -qX -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
      - name: Set P6C-B1 flags without reading Production values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          classification=disabled
          case "${{ inputs.mode }}" in
            wave1-private-routing) classification=enabled ;;
            promote-migration-flags-off|flags-off|rollback-private-routing) ;;
            *) echo COMUN_P6C_B1_ACTIVATION_MODE_INVALID; exit 1 ;;
          esac
          printf '%s' "$classification" | npx --yes vercel@50.28.0 env add COMUN_PUBLIC_EDUCATION_SENSITIVE_ROUTING_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-classification-env.out 2>/tmp/comun-p6cb1-classification-env.err
          printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_SENSITIVE_FORWARDING_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-forwarding-env.out 2>/tmp/comun-p6cb1-forwarding-env.err
      - name: Deploy exact main with current Production environment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-deploy.out 2>/tmp/comun-p6cb1-deploy.err
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p6cb1-deploy.out | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo COMUN_P6C_B1_DEPLOYMENT_URL_UNAVAILABLE; exit 1 ;; esac
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Promote exact deployment to canonical domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 promote "$DEPLOYMENT_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-promote.out 2>/tmp/comun-p6cb1-promote.err
          npx --yes vercel@50.28.0 alias set "$DEPLOYMENT_URL" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-alias.out 2>/tmp/comun-p6cb1-alias.err
      - name: Verify preserved domain surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in /comun /comun/relatar /comun/calcadas /comun/onibus /comun/minha-participacao; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL$path")" = 200
          done
      - name: Confirm flags-off deployment
        if: inputs.mode == 'promote-migration-flags-off' || inputs.mode == 'flags-off' || inputs.mode == 'rollback-private-routing'
        run: echo COMUN_P6C_B1_CODE_DEPLOYED_FLAGS_OFF >> "$GITHUB_STEP_SUMMARY"
      - name: Allocate synthetic smoke marker
        id: attempt
        if: inputs.mode == 'wave1-private-routing'
        shell: bash
        run: |
          marker="P6CB1-SMOKE-${GITHUB_RUN_ID}-$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf 'attempt_id=%s\n' "$marker" >> "$GITHUB_OUTPUT"
      - name: Run private Production smoke with finally cleanup
        id: wave1
        if: inputs.mode == 'wave1-private-routing'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p6cb1-production
          node scripts/solo/rehearse-p6c-b1-public-education-private-production.mjs >.ci-artifacts/p6cb1-production/wave1.json
          grep -q COMUN_P6C_B1_PUBLIC_EDUCATION_PRIVATE_WAVE1_PRODUCTION_GREEN .ci-artifacts/p6cb1-production/wave1.json
          grep -q '"externalRequests":0' .ci-artifacts/p6cb1-production/wave1.json
          grep -q '"hardDeletes":0' .ci-artifacts/p6cb1-production/wave1.json
      - name: Roll back private Education routing after failed gate
        if: always() && inputs.mode == 'wave1-private-routing' && steps.wave1.outcome != 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_PUBLIC_EDUCATION_SENSITIVE_ROUTING_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-rollback-classification.out 2>/tmp/comun-p6cb1-rollback-classification.err
          printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_SENSITIVE_FORWARDING_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-rollback-forwarding.out 2>/tmp/comun-p6cb1-rollback-forwarding-env.err
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-rollback-deploy.out 2>/tmp/comun-p6cb1-rollback-deploy.err
          rollback_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p6cb1-rollback-deploy.out | tail -n 1 | tr -d '\r')"
          case "$rollback_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          npx --yes vercel@50.28.0 promote "$rollback_url" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-rollback-promote.out 2>/tmp/comun-p6cb1-rollback-promote.err
          npx --yes vercel@50.28.0 alias set "$rollback_url" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p6cb1-rollback-alias.out 2>/tmp/comun-p6cb1-rollback-alias.err
          echo COMUN_P6C_B1_PRIVATE_ROUTING_ROLLED_BACK_AFTER_FAILED_GATE >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p6c-b1-domain-${{ github.run_id }}
          path: .ci-artifacts/p6cb1-production
          retention-days: 14
          if-no-files-found: ignore
      - name: Emit wave marker
        if: success() && inputs.mode == 'wave1-private-routing'
        run: echo COMUN_48_1B_P6C_B1_PUBLIC_EDUCATION_PRIVATE_DOMAIN_GREEN_FORWARDING_OFF >> "$GITHUB_STEP_SUMMARY"
