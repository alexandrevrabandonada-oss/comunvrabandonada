name: COMUN P3B orphan cleanup

on:
  push:
    branches:
      - codex/48-1b-p3b-orphan-cleanup
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Expected origin/main SHA
        required: true
        type: string
      mode:
        description: Read-only identify, verify, or exact cleanup
        required: true
        type: choice
        options: [identify, verify, cleanup]
      fixture_fingerprint:
        description: Fingerprint from identify (required only for cleanup)
        required: false
        type: string
      authorization:
        description: AUTORIZO_P3B_SYNTHETIC_CLEANUP_<fingerprint> (cleanup only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify forward-only destination
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || 'a7b33ac050ac7eb7919820fd4b4e86723cf43128' }}
        run: |
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD || { echo COMUN_P3B_CLEANUP_BLOCKED_HEAD_MISMATCH; exit 2; }
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA" || { echo COMUN_P3B_CLEANUP_BLOCKED_MAIN_MISMATCH; exit 2; }
      - name: Install runtime dependency
        run: npm ci --ignore-scripts
      - name: Identify or clean exact fixture
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MODE: ${{ inputs.mode || 'identify' }}
          AUTHORIZATION: ${{ inputs.authorization }}
          FIXTURE_FINGERPRINT: ${{ inputs.fixture_fingerprint }}
        run: |
          set -o pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo COMUN_P3B_CLEANUP_BLOCKED_CURRENT_ROTATED_DB_SECRET_UNAVAILABLE; exit 2; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo COMUN_P3B_CLEANUP_BLOCKED_CURRENT_ROTATED_DB_SECRET_UNAVAILABLE; exit 2; }
          node scripts/solo/p3b-orphan-cleanup.mjs --mode "$MODE" --fixture-fingerprint "$FIXTURE_FINGERPRINT" --authorization "$AUTHORIZATION" | tee p3b-cleanup-result.json
      - name: Publish sanitized result
        uses: actions/upload-artifact@v4
        with:
          name: comun-p3b-cleanup-result
          path: p3b-cleanup-result.json
          if-no-files-found: error
