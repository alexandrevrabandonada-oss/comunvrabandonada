name: COMUN 48.3-D1 remote read-only cycle memory preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-48-3-d1-preflight.yml"
      - "lib/comun-pauta-cycle-memory*.ts"
      - "lib/comun-collective-actions-canonical*.ts"
      - "lib/pauta-action-cycle-data.ts"
      - "components/comun-pauta-cycle-memory.tsx"
      - "components/comun-pautas-vivas.tsx"
      - "app/comun/pautas/**"
      - "reports/current/comun-48-3-d1-collective-cycle-memory.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-read-only-cycle-memory-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: supabase/setup-cli@v1
        with: { version: 2.113.0 }
      - name: Verify zero migration and metadata-only canonical sources
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -z "$(git diff --name-only origin/main...HEAD -- supabase/migrations)" || { echo COMUN_48_3_D1_BLOCKED_UNEXPECTED_MIGRATION; exit 1; }
          mkdir -p .ci-artifacts/48-3-d1-preflight
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/48-3-d1-preflight/schema.json <<'SQL'
          begin read only;
          with canonical(name) as (values
            ('comun_pauta_spaces'),('comun_pauta_evidence_items'),
            ('comun_construction_circles'),('comun_construction_circle_rounds'),
            ('comun_circle_syntheses'),('comun_pauta_decisions'),
            ('comun_pauta_action_cycles'),('comun_pauta_action_cycle_events'),
            ('comun_collective_actions'),('comun_collective_action_updates'),
            ('comun_collective_action_forwardings'),('comun_collective_action_memory_assets'),
            ('comun_hub_results')
          )
          select json_build_object(
            'transactionReadOnly', current_setting('transaction_read_only')='on',
            'canonicalTablesPresent', (select count(*)=13 from canonical where to_regclass('public.'||name) is not null),
            'rlsEnabled', (select bool_and(c.relrowsecurity) from canonical join pg_class c on c.oid=to_regclass('public.'||name)),
            'serviceRoleSelect', (select bool_and(has_table_privilege('service_role','public.'||name,'SELECT')) from canonical),
            'circleSynthesisPublicPolicy', exists(select 1 from pg_policies where schemaname='public' and tablename='comun_circle_syntheses'),
            'cyclePublicPolicy', exists(select 1 from pg_policies where schemaname='public' and tablename='comun_pauta_action_cycles'),
            'actionPublicPolicy', exists(select 1 from pg_policies where schemaname='public' and tablename='comun_collective_actions'),
            'resultPublicPolicy', exists(select 1 from pg_policies where schemaname='public' and tablename='comun_hub_results'),
            'searchDeclaredDiscoveryOnly', coalesce(obj_description('public.comun_search_documents'::regclass), '') ilike '%never a canonical source%',
            'businessContentRead', false
          );
          rollback;
          SQL
          node - <<'NODE'
          const s=JSON.parse(require('node:fs').readFileSync('.ci-artifacts/48-3-d1-preflight/schema.json','utf8'));
          const required=['transactionReadOnly','canonicalTablesPresent','rlsEnabled','serviceRoleSelect','circleSynthesisPublicPolicy','cyclePublicPolicy','actionPublicPolicy','resultPublicPolicy','searchDeclaredDiscoveryOnly'];
          const failed=required.filter(key=>s[key]!==true);
          if(s.businessContentRead!==false) failed.push('businessContentRead');
          if(failed.length){ console.error(`failedChecks=${failed.join(',')}`); throw new Error('COMUN_48_3_D1_BLOCKED_REMOTE_SCHEMA_DRIFT'); }
          NODE
      - name: Prove remote migration plan is empty
        shell: bash
        run: |
          set -euo pipefail
          external=supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
          test "$(sha256sum "$external" | awk '{print $1}')" = 6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be
          held="$RUNNER_TEMP/external.sql"; mv "$external" "$held"; trap 'mv "$held" "$external"' EXIT
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/48-3-d1-preflight/plan.txt 2>&1
          ! grep -Eq '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/48-3-d1-preflight/plan.txt
          echo migrationCount=0 >> "$GITHUB_STEP_SUMMARY"
          echo COMUN_48_3_D1_REMOTE_PLAN_EMPTY_GREEN >> "$GITHUB_STEP_SUMMARY"
