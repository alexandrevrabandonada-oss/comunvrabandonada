name: COMUN 48.2-E2 power interruptions activation
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string
      mode:
        description: Cloak first, then enable the read-only power-interruptions surface
        required: true
        type: choice
        options: [flags-off, wave1-power-interruptions]
permissions: { contents: read }
env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online
  COMUN_48_2_E2_BASELINE_SHA: 81c26095bec9563ad363abb92976916d3915e758
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Verify exact main and zero migration diff
        env: { EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }} }
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$COMUN_48_2_E2_BASELINE_SHA" HEAD
          test -z "$(git diff --name-only "$COMUN_48_2_E2_BASELINE_SHA"...HEAD -- supabase/migrations)" || { echo COMUN_48_2_E2_BLOCKED_UNEXPECTED_MIGRATION >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo COMUN_48_2_E2_ZERO_MIGRATION_GATE_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Verify canonical Vercel project binding read-only
        env: { VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} }
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          output="$(mktemp)"; errors="$(mktemp)"
          if ! npx --yes vercel@50.28.0 project inspect "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$errors"; then rm -f "$output" "$errors"; echo COMUN_48_2_E2_BLOCKED_VERCEL_PROJECT_BINDING >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          rm -f "$output" "$errors"; echo COMUN_48_2_E2_VERCEL_PROJECT_BINDING_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy exact main and run selected read-only wave
        env: { VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}, MODE: ${{ inputs.mode }} }
        shell: bash
        run: bash scripts/observatories/run-48-2-e2-power-interruptions-production-wave.sh "$MODE"
