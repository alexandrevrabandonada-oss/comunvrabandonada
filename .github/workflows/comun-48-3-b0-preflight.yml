name: COMUN 48.3-B0 remote read-only social preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-48-3-b0-preflight.yml"
      - "lib/comun-social-architecture.ts"
      - "lib/comun-social-architecture.test.ts"
      - "reports/current/comun-48-3-b0-communities-rodas-reconciliation.md"
      - "reports/current/estado-atual-comun.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-read-only-social-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate read-only transport and zero migration scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          case "$SUPABASE_DB_URL" in *localhost*|*127.0.0.1*) exit 1 ;; esac
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- supabase/migrations)
          if [ "${#changed[@]}" -ne 0 ]; then
            echo COMUN_48_3_B0_BLOCKED_UNEXPECTED_MIGRATION
            exit 1
          fi

      - name: Inspect social metadata in a read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/48-3-b0-preflight
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 \
            >.ci-artifacts/48-3-b0-preflight/schema.json <<'SQL'
          begin read only;
          with scoped_tables(table_name) as (
            values
              ('comun_communities'),
              ('comun_community_memberships'),
              ('comun_community_role_assignments'),
              ('comun_community_work_groups'),
              ('comun_community_work_group_members'),
              ('comun_community_work_group_tasks'),
              ('comun_community_audit_log'),
              ('comun_pauta_spaces'),
              ('comun_pauta_memberships'),
              ('comun_pauta_contributions'),
              ('comun_pauta_synthesis_versions'),
              ('comun_pauta_modules'),
              ('comun_construction_circles'),
              ('comun_construction_circle_rounds'),
              ('comun_circle_contributions'),
              ('comun_circle_syntheses'),
              ('comun_collective_actions')
          )
          select json_build_object(
            'transactionReadOnly', current_setting('transaction_read_only') = 'on',
            'tablesPresent', (
              select count(*) = 17
              from scoped_tables scoped
              where to_regclass('public.' || scoped.table_name) is not null
            ),
            'rlsEnabled', (
              select coalesce(bool_and(class.relrowsecurity), false)
              from scoped_tables scoped
              join pg_catalog.pg_class class
                on class.oid = to_regclass('public.' || scoped.table_name)
            ),
            'rlsForcedByTable', (
              select json_object_agg(scoped.table_name, class.relforcerowsecurity order by scoped.table_name)
              from scoped_tables scoped
              join pg_catalog.pg_class class
                on class.oid = to_regclass('public.' || scoped.table_name)
            ),
            'constraints', (
              select coalesce(json_agg(json_build_object(
                'table', scoped.table_name,
                'name', constraint_row.conname,
                'type', constraint_row.contype,
                'definition', pg_catalog.pg_get_constraintdef(constraint_row.oid)
              ) order by scoped.table_name, constraint_row.conname), '[]'::json)
              from scoped_tables scoped
              join pg_catalog.pg_constraint constraint_row
                on constraint_row.conrelid = to_regclass('public.' || scoped.table_name)
            ),
            'indexes', (
              select coalesce(json_agg(json_build_object(
                'table', indexes.tablename,
                'name', indexes.indexname,
                'definition', indexes.indexdef
              ) order by indexes.tablename, indexes.indexname), '[]'::json)
              from pg_catalog.pg_indexes indexes
              join scoped_tables scoped on scoped.table_name = indexes.tablename
              where indexes.schemaname = 'public'
            ),
            'policies', (
              select coalesce(json_agg(json_build_object(
                'table', policies.tablename,
                'name', policies.policyname,
                'roles', policies.roles,
                'command', policies.cmd,
                'usingPresent', policies.qual is not null,
                'checkPresent', policies.with_check is not null
              ) order by policies.tablename, policies.policyname), '[]'::json)
              from pg_catalog.pg_policies policies
              join scoped_tables scoped on scoped.table_name = policies.tablename
              where policies.schemaname = 'public'
            ),
            'grants', (
              select coalesce(json_agg(json_build_object(
                'table', grants.table_name,
                'grantee', grants.grantee,
                'privilege', grants.privilege_type
              ) order by grants.table_name, grants.grantee, grants.privilege_type), '[]'::json)
              from information_schema.role_table_grants grants
              join scoped_tables scoped on scoped.table_name = grants.table_name
              where grants.table_schema = 'public'
                and grants.grantee in ('anon', 'authenticated', 'service_role')
            ),
            'communityMembershipOwnerPolicy', exists (
              select 1 from pg_catalog.pg_policies policies
              where policies.schemaname = 'public'
                and policies.tablename = 'comun_community_memberships'
                and policies.cmd = 'SELECT'
                and 'authenticated' = any(policies.roles)
                and policies.qual like '%auth.uid()%'
                and policies.qual like '%member_user_id%'
            ),
            'communityRoleOwnerPolicy', exists (
              select 1 from pg_catalog.pg_policies policies
              where policies.schemaname = 'public'
                and policies.tablename = 'comun_community_role_assignments'
                and policies.cmd = 'SELECT'
                and 'authenticated' = any(policies.roles)
                and policies.qual like '%auth.uid()%'
                and policies.qual like '%member_user_id%'
            ),
            'workGroupsPublicReadOnly',
              has_table_privilege('anon', 'public.comun_community_work_groups', 'SELECT')
              and not has_table_privilege('anon', 'public.comun_community_work_groups', 'INSERT')
              and not has_table_privilege('anon', 'public.comun_community_work_groups', 'UPDATE')
              and not has_table_privilege('anon', 'public.comun_community_work_groups', 'DELETE'),
            'circleTablesClientClosed',
              not has_table_privilege('anon', 'public.comun_construction_circles', 'SELECT')
              and not has_table_privilege('authenticated', 'public.comun_construction_circles', 'SELECT')
              and not has_table_privilege('anon', 'public.comun_circle_contributions', 'SELECT')
              and not has_table_privilege('authenticated', 'public.comun_circle_contributions', 'SELECT')
              and not has_table_privilege('anon', 'public.comun_circle_syntheses', 'SELECT')
              and not has_table_privilege('authenticated', 'public.comun_circle_syntheses', 'SELECT')
              and not has_table_privilege('anon', 'public.comun_construction_circles', 'INSERT')
              and not has_table_privilege('authenticated', 'public.comun_construction_circles', 'INSERT')
              and not has_table_privilege('anon', 'public.comun_circle_contributions', 'INSERT')
              and not has_table_privilege('authenticated', 'public.comun_circle_contributions', 'INSERT'),
            'generalContributionsClientClosed',
              not has_table_privilege('anon', 'public.comun_pauta_contributions', 'SELECT')
              and not has_table_privilege('authenticated', 'public.comun_pauta_contributions', 'SELECT')
              and not has_table_privilege('anon', 'public.comun_pauta_contributions', 'INSERT')
              and not has_table_privilege('authenticated', 'public.comun_pauta_contributions', 'INSERT')
              and not has_table_privilege('anon', 'public.comun_pauta_contributions', 'UPDATE')
              and not has_table_privilege('authenticated', 'public.comun_pauta_contributions', 'UPDATE')
              and not has_table_privilege('anon', 'public.comun_pauta_contributions', 'DELETE')
              and not has_table_privilege('authenticated', 'public.comun_pauta_contributions', 'DELETE'),
            'oneOpenRoundGuard', exists (
              select 1 from pg_catalog.pg_indexes indexes
              where indexes.schemaname = 'public'
                and indexes.tablename = 'comun_construction_circle_rounds'
                and indexes.indexname = 'comun_circle_one_open_round'
                and indexes.indexdef like 'CREATE UNIQUE INDEX%'
            ),
            'contributionRoundGuard', exists (
              select 1 from pg_catalog.pg_trigger triggers
              where triggers.tgrelid = 'public.comun_circle_contributions'::regclass
                and triggers.tgname = 'comun_circle_contributions_round_guard'
                and not triggers.tgisinternal
            ),
            'synthesisRoundGuard', exists (
              select 1 from pg_catalog.pg_trigger triggers
              where triggers.tgrelid = 'public.comun_circle_syntheses'::regclass
                and triggers.tgname = 'comun_circle_syntheses_round_guard'
                and not triggers.tgisinternal
            ),
            'businessContentRead', false
          );
          rollback;
          SQL

          node - <<'NODE'
          const fs = require('node:fs');
          const path = '.ci-artifacts/48-3-b0-preflight/schema.json';
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          const required = [
            'transactionReadOnly',
            'tablesPresent',
            'rlsEnabled',
            'communityMembershipOwnerPolicy',
            'communityRoleOwnerPolicy',
            'workGroupsPublicReadOnly',
            'circleTablesClientClosed',
            'generalContributionsClientClosed',
            'oneOpenRoundGuard',
            'contributionRoundGuard',
            'synthesisRoundGuard'
          ];
          if (required.some((key) => schema[key] !== true) || schema.businessContentRead !== false) {
            throw new Error('COMUN_48_3_B0_BLOCKED_REMOTE_SOCIAL_SCHEMA_DRIFT');
          }
          for (const key of ['constraints', 'indexes', 'policies', 'grants']) {
            if (!Array.isArray(schema[key])) {
              throw new Error('COMUN_48_3_B0_BLOCKED_REMOTE_SOCIAL_SCHEMA_DRIFT');
            }
          }
          fs.writeFileSync(
            '.ci-artifacts/48-3-b0-preflight/result.json',
            JSON.stringify({
              result: 'COMUN_48_3_B0_REMOTE_SOCIAL_METADATA_GREEN',
              transactionReadOnly: true,
              businessContentRead: false,
              tablesAudited: 17,
              rlsEnabled: true,
              clientWritePaths: 0
            }) + '\n'
          );
          NODE

      - name: Prove remote migration plan is empty
        shell: bash
        run: |
          set -euo pipefail
          external="supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql"
          test "$(sha256sum "$external" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          held="$RUNNER_TEMP/comun-b0-external-ledger.sql"
          mv "$external" "$held"
          restore() { test ! -e "$held" || mv "$held" "$external"; }
          trap restore EXIT
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/48-3-b0-preflight/dry-run.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/48-3-b0-preflight/dry-run.txt | sort -u || true)
          test "${#planned[@]}" -eq 0
          printf '{"result":"COMUN_48_3_B0_REMOTE_PLAN_EMPTY_GREEN","migrationCount":0,"businessContentRead":false}\n' \
            >.ci-artifacts/48-3-b0-preflight/migration-plan.json
          restore
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-3-b0-remote-preflight-${{ github.run_id }}
          path: .ci-artifacts/48-3-b0-preflight
          retention-days: 14
          if-no-files-found: error

      - name: Emit sanitized preflight result
        if: success()
        run: echo COMUN_48_3_B0_REMOTE_SOCIAL_METADATA_GREEN >> "$GITHUB_STEP_SUMMARY"
