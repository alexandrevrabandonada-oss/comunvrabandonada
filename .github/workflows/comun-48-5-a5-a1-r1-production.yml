name: COMUN 48.5-A5-A1-R1 specialized provenance schema rollout

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA to execute after rollout-tooling integration
        required: true
        type: string

concurrency:
  group: comun-48-5-a5-a1-r1-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  A5_A1_FUNCTIONAL_ANCESTOR: 382a215e2828827596ed68bf2a7dfe1c2645361d
  A5_A1_MIGRATION: supabase/migrations/20260823003249_comun_cultural_specialized_provenance_readiness.sql
  A5_A1_MIGRATION_SHA256: 771975081046474022764a8e69743cc6015ebb4a817c614719fa7d6dfc74bdfb
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  rollout:
    name: A5-A1 / exact Production schema rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Assert exact Production-only bindings
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" -a -n "$SUPABASE_DB_URL" -a -n "$VERCEL_TOKEN"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - name: Execute preflight, exact migration and read-only postflight
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        shell: bash
        run: bash scripts/run-48-5-a5-a1-r1-production.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-48-5-a5-a1-r1-production-${{ github.run_id }}
          path: .ci-artifacts/48-5-a5-a1-r1-production/
          retention-days: 30
          if-no-files-found: warn
