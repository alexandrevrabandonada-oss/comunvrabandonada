name: COMUN 48.3-A1 disposable migration proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-48-3-a1-disposable.yml"
      - "supabase/migrations/*_comun_pautas_vivas_public_evidence.sql"
      - "lib/comun-public-evidence*.ts"
      - "lib/comun-pauta-public-evidence.ts"
      - "lib/comun-pautas-vivas*.ts"

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations/20260813124308_comun_pautas_vivas_public_evidence.sql "$RUNNER_TEMP/a1.sql"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Apply the additive migration to a disposable schema
        shell: bash
        run: |
          set -euo pipefail
          admin='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$admin" -v ON_ERROR_STOP=1 -c 'create database comun_a1_disposable'
          db='postgresql://postgres:postgres@127.0.0.1:54322/comun_a1_disposable'
          migration="$RUNNER_TEMP/a1.sql"
          psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create table public.comun_pauta_spaces (
            id uuid primary key,
            visibility text not null,
            status text not null
          );
          create table public.comun_pauta_evidence_items (
            id uuid primary key default gen_random_uuid(),
            pauta_id uuid not null references public.comun_pauta_spaces(id),
            source_type text not null,
            source_id uuid null,
            title text not null,
            summary text null,
            evidence_type text not null,
            sensitivity text not null,
            status text not null,
            public_note text null,
            internal_note text null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint comun_pauta_evidence_source_type_check check (source_type in ('contribution','report','official_protocol','manual','external_reference'))
          );
          alter table public.comun_pauta_evidence_items enable row level security;
          create policy "Public can read public safe approved pauta evidence"
            on public.comun_pauta_evidence_items for select to anon, authenticated
            using (status='approved' and sensitivity='public_safe' and exists (
              select 1 from public.comun_pauta_spaces spaces
              where spaces.id=pauta_id and spaces.visibility='public' and spaces.status<>'archived'
            ));
          grant select on public.comun_pauta_evidence_items to anon, authenticated;
          grant select on public.comun_pauta_spaces to anon, authenticated;
          grant select, insert, update, delete on public.comun_pauta_evidence_items to service_role;
          insert into public.comun_pauta_spaces values
            ('00000000-0000-0000-0000-000000000001','public','organizing'),
            ('00000000-0000-0000-0000-000000000002','internal','organizing');
          insert into public.comun_pauta_evidence_items
            (pauta_id,source_type,title,evidence_type,sensitivity,status)
          values
            ('00000000-0000-0000-0000-000000000001','manual','Existing evidence','documento','public_safe','approved');
          SQL
          psql "$db" -v ON_ERROR_STOP=1 -f "$migration"
          psql "$db" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.comun_pauta_evidence_items
            (pauta_id,source_type,title,evidence_type,sensitivity,status)
          values
            ('00000000-0000-0000-0000-000000000001','external_reference','Legacy value','documento','public_safe','approved');
          insert into public.comun_pauta_evidence_items
            (pauta_id,source_type,source_id,title,evidence_type,sensitivity,status,public_evidence_ref_id,public_evidence_version,public_evidence_payload)
          values
            ('00000000-0000-0000-0000-000000000001','public_evidence',null,'Public citation','dado_agregado','public_safe','approved','panorama:territory:coverage','sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','{}');
          do $$ begin
            begin
              insert into public.comun_pauta_evidence_items
                (pauta_id,source_type,title,evidence_type,sensitivity,status,public_evidence_ref_id,public_evidence_version,public_evidence_payload)
              values
                ('00000000-0000-0000-0000-000000000001','public_evidence','Duplicate','dado_agregado','public_safe','approved','panorama:territory:coverage','sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','{}');
              raise exception 'duplicate citation was accepted';
            exception when unique_violation then null; end;
          end $$;
          set role anon;
          do $$ begin
            if (select count(*) from public.comun_pauta_evidence_items) <> 3 then
              raise exception 'public select policy changed unexpectedly';
            end if;
            begin
              insert into public.comun_pauta_evidence_items
                (pauta_id,source_type,title,evidence_type,sensitivity,status)
              values ('00000000-0000-0000-0000-000000000001','manual','Denied','outro','public_safe','approved');
              raise exception 'anon insert was accepted';
            exception when insufficient_privilege then null; end;
          end $$;
          reset role;
          set role authenticated;
          do $$ begin
            begin
              insert into public.comun_pauta_evidence_items
                (pauta_id,source_type,title,evidence_type,sensitivity,status)
              values ('00000000-0000-0000-0000-000000000001','manual','Denied','outro','public_safe','approved');
              raise exception 'authenticated insert was accepted';
            exception when insufficient_privilege then null; end;
          end $$;
          reset role;
          SQL
          psql "$db" -v ON_ERROR_STOP=1 -c "select 1"
          echo COMUN_48_3_A1_DISPOSABLE_MIGRATION_GREEN >> "$GITHUB_STEP_SUMMARY"
          echo existingEvidenceRowsRemainValid=true >> "$GITHUB_STEP_SUMMARY"
          echo publicSelectPolicyExpanded=false >> "$GITHUB_STEP_SUMMARY"
          echo anonAuthenticatedInsert=false >> "$GITHUB_STEP_SUMMARY"
