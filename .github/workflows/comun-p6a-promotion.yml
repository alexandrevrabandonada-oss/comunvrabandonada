name: COMUN P6A schema promotion

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA
        required: true
        type: string
      mode:
        description: Read-only preflight, exact-one promotion, or postflight
        required: true
        type: choice
        options: [preflight, promote, postflight]

concurrency:
  group: comun-p6a-schema-promotion
  cancel-in-progress: false
permissions:
  contents: read

env:
  P6A_MIGRATION: 20260809133923_comun_essential_services_assisted.sql
  P6A_MANIFEST: supabase/releases/20260809133923-comun-essential-services-assisted.json
  P6A_SHA256: 58e8739624d7cdee0d138ab45debd2eabaff443e0b0937560e2d775e359294dc
  EXTERNAL_MIGRATION: supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
  EXTERNAL_EXCEPTION: supabase/migration-exceptions/20260724233256-sidewalk-external-ledger.json

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: npm ci --ignore-scripts
      - name: Validate immutable P6A release
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm run solo:sql:validate -- --release-manifest="$P6A_MANIFEST"
          test "$(node -e "const m=require('./$P6A_MANIFEST'); process.stdout.write(m.migration)")" = "supabase/migrations/$P6A_MIGRATION"
          test "$(sha256sum "supabase/migrations/$P6A_MIGRATION" | awk '{print $1}')" = "$P6A_SHA256"
      - name: Reconcile Calçadas ledger and prove exact-one plan
        if: inputs.mode == 'preflight' || inputs.mode == 'promote'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(node -e "const e=require('./$EXTERNAL_EXCEPTION'); process.stdout.write(e.path)")" = "$EXTERNAL_MIGRATION"
          test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          held="$RUNNER_TEMP/comun-p6a-external-ledger.sql"
          mv "$EXTERNAL_MIGRATION" "$held"
          restore() {
            test ! -e "$held" || mv "$held" "$EXTERNAL_MIGRATION"
            test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          }
          trap restore EXIT
          mkdir -p .ci-artifacts/p6a-promotion
          supabase migration list --db-url "$SUPABASE_DB_URL" >.ci-artifacts/p6a-promotion/migration-list.txt 2>&1
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/p6a-promotion/dry-run.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/p6a-promotion/dry-run.txt | sort -u || true)
          test "${#planned[@]}" -eq 1 || { echo COMUN_P6A_BLOCKED_UNEXPECTED_REMOTE_MIGRATION_PLAN; exit 1; }
          test "${planned[0]}" = "$P6A_MIGRATION" || { echo COMUN_P6A_BLOCKED_UNEXPECTED_REMOTE_MIGRATION_PLAN; exit 1; }
          ! grep -Eq -- '--include-all|migration repair|db reset|seed' .ci-artifacts/p6a-promotion/dry-run.txt
          printf '{"result":"COMUN_P6A_REMOTE_PLAN_EXACT_ONE","migration":"%s","includeAll":false,"repair":false,"reset":false,"seed":false}\n' "$P6A_MIGRATION" >.ci-artifacts/p6a-promotion/plan.json
          if test "${{ inputs.mode }}" = promote; then
            supabase db push --db-url "$SUPABASE_DB_URL"
          fi
          echo COMUN_P6A_REMOTE_PLAN_EXACT_ONE >> "$GITHUB_STEP_SUMMARY"
      - name: Verify schema, RLS, grants and P5 compatibility without report reads
        if: inputs.mode == 'promote' || inputs.mode == 'postflight'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p6a-promotion
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/p6a-promotion/postflight.jsonl <<'SQL'
          select json_build_object(
            'migrationHistoryPresent',exists(select 1 from supabase_migrations.schema_migrations where version='20260809133923'),
            'waterConstraintPresent',pg_get_constraintdef(oid) like '%water_supply%'
          ) from pg_constraint where conrelid='public.comun_relata_cases'::regclass and conname='comun_relata_cases_category_check';
          select json_build_object(
            'sourceDomainNotNull',a.attnotnull,
            'sourceDomainDefault',pg_get_expr(d.adbin,d.adrelid),
            'busIntakeNullable',not b.attnotnull,
            'sourceReferenceConstraint',exists(select 1 from pg_constraint where conrelid='private.comun_forwarding_packages'::regclass and conname='comun_forwarding_packages_source_reference_check'),
            'webAllowed',pg_get_constraintdef(c.oid) like '%web%'
          ) from pg_attribute a
          join pg_attrdef d on d.adrelid=a.attrelid and d.adnum=a.attnum
          join pg_attribute b on b.attrelid=a.attrelid and b.attname='bus_intake_id'
          join pg_constraint c on c.conrelid='private.comun_forwarding_attempts'::regclass and c.conname='comun_forwarding_attempts_channel_check'
          where a.attrelid='private.comun_forwarding_packages'::regclass and a.attname='source_domain';
          with expected(name) as (values ('comun_forwarding_packages'),('comun_forwarding_attempts'),('comun_forwarding_events'),('comun_relata_classification_events')), observed as (
            select e.name,c.oid,c.relrowsecurity,c.relforcerowsecurity from expected e left join pg_class c on c.relname=e.name and c.relnamespace='private'::regnamespace
          ) select json_build_object('expected',4,'observed',count(oid),'allRls',bool_and(relrowsecurity),'allForceRls',bool_and(relforcerowsecurity),'publicCrud',bool_or(has_table_privilege('public',oid,'SELECT') or has_table_privilege('public',oid,'INSERT') or has_table_privilege('public',oid,'UPDATE') or has_table_privilege('public',oid,'DELETE')),'anonCrud',bool_or(has_table_privilege('anon',oid,'SELECT') or has_table_privilege('anon',oid,'INSERT') or has_table_privilege('anon',oid,'UPDATE') or has_table_privilege('anon',oid,'DELETE')),'authenticatedCrud',bool_or(has_table_privilege('authenticated',oid,'SELECT') or has_table_privilege('authenticated',oid,'INSERT') or has_table_privilege('authenticated',oid,'UPDATE') or has_table_privilege('authenticated',oid,'DELETE'))) from observed;
          with expected(name) as (values ('comun_relata_classification_transition'),('comun_essential_wallet_mark_ready'),('comun_essential_assisted_prepare'),('comun_assisted_wallet_item_category'),('comun_assisted_forwarding_list'),('comun_assisted_forwarding_open'),('comun_assisted_forwarding_declare_sent'),('comun_assisted_forwarding_record_response'),('comun_assisted_forwarding_withdraw'),('comun_stmu_assisted_prepare'),('comun_stmu_assisted_open')), observed as (
            select e.name,p.oid,p.prosecdef,coalesce(array_to_string(p.proconfig,','),'') config from expected e left join pg_proc p on p.proname=e.name and p.pronamespace='public'::regnamespace
          ) select json_build_object('expected',11,'observed',count(oid),'allSecurityDefiner',bool_and(prosecdef),'allSearchPathPinned',bool_and(config like 'search_path=pg_catalog%'),'publicExecute',bool_or(has_function_privilege('public',oid,'EXECUTE')),'anonExecute',bool_or(has_function_privilege('anon',oid,'EXECUTE')),'authenticatedExecute',bool_or(has_function_privilege('authenticated',oid,'EXECUTE')),'serviceRoleExecuteAll',bool_and(has_function_privilege('service_role',oid,'EXECUTE'))) from observed;
          SQL
          node - <<'NODE'
          const fs=require('node:fs'); const rows=fs.readFileSync('.ci-artifacts/p6a-promotion/postflight.jsonl','utf8').trim().split(/\r?\n/).map(JSON.parse); const [category,generalized,tables,rpcs]=rows;
          if(!category.migrationHistoryPresent||!category.waterConstraintPresent) throw new Error('COMUN_P6A_REMOTE_CATEGORY_POSTFLIGHT_FAILED');
          if(!generalized.sourceDomainNotNull||generalized.sourceDomainDefault!=="'bus'::text"||!generalized.busIntakeNullable||!generalized.sourceReferenceConstraint||!generalized.webAllowed) throw new Error('COMUN_P6A_REMOTE_FORWARDING_POSTFLIGHT_FAILED');
          if(tables.expected!==4||tables.observed!==4||!tables.allRls||!tables.allForceRls||tables.publicCrud||tables.anonCrud||tables.authenticatedCrud) throw new Error('COMUN_P6A_REMOTE_RLS_POSTFLIGHT_FAILED');
          if(rpcs.expected!==11||rpcs.observed!==11||!rpcs.allSecurityDefiner||!rpcs.allSearchPathPinned||rpcs.publicExecute||rpcs.anonExecute||rpcs.authenticatedExecute||!rpcs.serviceRoleExecuteAll) throw new Error('COMUN_P6A_REMOTE_RPC_POSTFLIGHT_FAILED');
          fs.writeFileSync('.ci-artifacts/p6a-promotion/postflight.json',JSON.stringify({result:'COMUN_P6A_REMOTE_SCHEMA_PROMOTED_FLAGS_OFF',category,generalized,tables,rpcs,reportContentRead:false,flagsChanged:false},null,2)+'\n');
          NODE
          echo COMUN_P6A_REMOTE_SCHEMA_PROMOTED_FLAGS_OFF >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p6a-promotion-${{ github.run_id }}
          path: .ci-artifacts/p6a-promotion
          retention-days: 14
          if-no-files-found: ignore
