name: COMUN 49.2 R4 migration filename generator

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-r4-migration-name.yml"

permissions: { contents: read }

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.114.0 }
      - name: Generate R4 migration filename using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          supabase migration new comun_relata_collective_entity_legitimacy_eligibility
          after="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          comm -13 "$before" "$after" | tee r4-migration-filename.txt
          test "$(wc -l < r4-migration-filename.txt)" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r4-migration-filename-${{ github.run_id }}
          path: r4-migration-filename.txt
          if-no-files-found: error
          retention-days: 1
