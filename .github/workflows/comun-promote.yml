name: COMUN Promote

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to promote
        required: true
        default: "23"
      expected_sha:
        description: Immutable pull request HEAD
        required: true
  pull_request:
    types: [labeled]

concurrency:
  group: comun-production-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'comun:promover'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0 }
      - id: gate
        name: Authorize solo operator and immutable PR
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SHA: ${{ inputs.expected_sha }}
        run: node scripts/solo/authorize-promotion.mjs >> "$GITHUB_OUTPUT"
      - name: Require green canonical CI for the immutable SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          gh api -X GET "repos/${{ github.repository }}/actions/workflows/comun-ci.yml/runs" \
            -f head_sha="$SHA" -f status=completed -f per_page=20 > /tmp/comun-ci-runs.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/comun-ci-runs.json', 'utf8'));
          const sha = process.env.SHA;
          const green = (body.workflow_runs ?? []).some((run) => run.head_sha === sha && run.conclusion === 'success');
          if (!green) throw new Error('SOLO_CANONICAL_CI_NOT_GREEN_FOR_SHA');
          console.log('COMUN_EXISTING_CI_GREEN');
          NODE

  promote:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with: { version: 2.109.1 }
      - run: npm ci --ignore-scripts
      - name: Reconfirm immutable and mergeable PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          test "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$SHA"
          test "$(gh pr view "$PR" --json mergeable --jq .mergeable)" = "MERGEABLE"
      - name: Validate required secret contract
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          S_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          S_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          S_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          S_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          S_VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          S_VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          S_VERCEL_LEGACY_PROJECT_ID: ${{ secrets.VERCEL_LEGACY_PROJECT_ID }}
        shell: bash
        run: |
          missing=()
          while IFS='|' read -r name variable; do
            test -n "${!variable}" || missing+=("$name")
          done <<'EOF'
          SUPABASE_PROJECT_REF|S_SUPABASE_PROJECT_REF
          SUPABASE_DB_URL|S_SUPABASE_DB_URL
          SUPABASE_DB_PASSWORD|S_SUPABASE_DB_PASSWORD
          SUPABASE_SERVICE_ROLE_KEY|S_SUPABASE_SERVICE_ROLE_KEY
          VERCEL_TOKEN|S_VERCEL_TOKEN
          VERCEL_TEAM_ID|S_VERCEL_TEAM_ID
          VERCEL_CANONICAL_PROJECT_ID|S_VERCEL_CANONICAL_PROJECT_ID
          VERCEL_LEGACY_PROJECT_ID|S_VERCEL_LEGACY_PROJECT_ID
          EOF
          if ((${#missing[@]})); then
            names="$(IFS=', '; echo "${missing[*]}")"
            gh pr comment "$PR" --body "Promoção solo bloqueada antes de qualquer escrita remota. Secrets ausentes: \`$names\`."
            echo "::error title=COMUN secret contract::Missing repository secrets: $names"
            exit 1
          fi
          echo COMUN_SECRET_CONTRACT_OK
      - name: Validate forward-only SQL before any remote access
        run: npm run solo:sql:validate
      - name: Create sanitized pre-promotion checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          APP_SHA: ${{ needs.authorize.outputs.sha }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          output="$(node scripts/solo/create-checkpoint.mjs --output=.solo-checkpoint 2>&1)"
          status=$?
          set -e
          if ((status != 0)); then
            marker="$(printf '%s\n' "$output" | grep -oE 'SOLO_[A-Z0-9_:.-]+' | tail -1 || true)"
            test -n "$marker" || marker=SOLO_CHECKPOINT_FAILED
            gh pr comment "$PR" --body "Promoção solo interrompida no checkpoint sanitizado: \`$marker\`. Nenhuma migration ou merge foi executado."
            echo "::error title=COMUN checkpoint::$marker"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: comun-pre-promotion-checkpoint-${{ needs.authorize.outputs.sha }}
          path: .solo-checkpoint
          retention-days: 7
          if-no-files-found: error
      - name: Apply transactional forward-only package
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set +e
          output="$(node scripts/solo/apply-forward-only.mjs 2>&1)"
          status=$?
          set -e
          if ((status != 0)); then
            marker="$(printf '%s\n' "$output" | grep -oE 'SOLO_[A-Z0-9_:.-]+' | tail -1 || true)"
            test -n "$marker" || marker=SOLO_FORWARD_ONLY_FAILED
            gh pr comment "$PR" --body "Promoção solo interrompida na transação forward-only: \`$marker\`. O pacote usa fail-fast e rollback transacional; merge e domínio não foram executados."
            echo "::error title=COMUN forward-only::$marker"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Remote postflight, DB lint, RLS and cleanup dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMUN_SIDEWALK_CLEANUP_ALLOWED_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase db lint --db-url "$SUPABASE_DB_URL" --schema public --level error --fail-on error
          node scripts/cleanup-comun-sidewalk-uploads.mjs --allow-non-local --project-ref="$SUPABASE_PROJECT_REF"
      - name: Validate immutable Vercel preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/solo/verify-preview.mjs
      - name: Merge by merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          if test "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = true; then gh pr ready "$PR"; fi
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" -f sha="$SHA" -f merge_method=merge --jq '.merged == true'
      - name: Wait for main deployment and production smoke
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          VERCEL_LEGACY_PROJECT_ID: ${{ secrets.VERCEL_LEGACY_PROJECT_ID }}
          APP_SHA: ${{ needs.authorize.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/solo/monitor-production.mjs --minutes=15 --domain=comunsocial.online
      - name: Reconcile domain only after production is green
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          VERCEL_LEGACY_PROJECT_ID: ${{ secrets.VERCEL_LEGACY_PROJECT_ID }}
        run: node scripts/solo/reconcile-domain.mjs
      - if: success()
        run: echo 'SOLO_PRODUCTION_GREEN' >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_CANONICAL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: node scripts/solo/rollback-application.mjs
