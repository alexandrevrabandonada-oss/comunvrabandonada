name: COMUN Escola synthetic recovery unit contracts
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/learning/recovery-disposable*"
      - ".github/workflows/comun-learning-recovery-contracts.yml"
permissions: { contents: read }
jobs:
  contracts-no-production-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0 }
      - run: node --test scripts/learning/recovery-disposable.node-test.mjs
      # SQL recovery is a separate local Windows/DPAPI proof, not this unit job.
      # No backup upload, Production secret, migration or remote capture here.
