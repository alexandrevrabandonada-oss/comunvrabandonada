name: COMUN 48.5-A4-R2 E1 external ledger evolved scope
on: {workflow_dispatch: {inputs: {expected_main_sha: {required: true, type: string}}}}
permissions: {contents: read}
concurrency: {group: comun-48-5-a4-r2-production, cancel-in-progress: false}
jobs:
  bridge:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.expected_main_sha }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22.18.0}
      - name: Prove evolved release-owned scope read-only
        env: {SUPABASE_DB_URL: '${{ secrets.SUPABASE_DB_URL }}'}
        run: bash -lc 'test "$(git rev-parse HEAD)" = "${{ inputs.expected_main_sha }}"; node scripts/solo/verify-sidewalk-external-ledger-evolved-scope.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: comun-a4-e1-${{ github.run_id }}, path: .ci-artifacts/a4-external-ledger-e1}
