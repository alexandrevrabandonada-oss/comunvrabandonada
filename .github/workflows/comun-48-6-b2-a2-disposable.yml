name: COMUN 48.6-B2-A2 disposable private matching proof

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260826090000_comun_denuncias_public_collective_projection.sql"
      - "supabase/migrations/20260826120000_comun_denuncias_public_projection_opt_in.sql"
      - "supabase/migrations/20260827120000_comun_denuncias_private_collective_matching.sql"
      - "scripts/comun-denuncias-b2-a2-disposable.sql"
      - "scripts/48-6-b2-a2-contract.node-test.mjs"
      - "lib/comun-relata-evidence.ts"
      - "lib/comun-relata-evidence-runtime.ts"
      - "lib/comun-relata-evidence-feature.ts"
      - "lib/comun-participation-wallet-runtime.ts"
      - "app/api/comun/relata/evidence/grouping/route.ts"
      - "app/api/comun/relata/evidence/location/route.ts"
      - "app/api/comun/relata/route.ts"
      - "app/api/comun/denuncias/public-projection-consent/route.ts"
      - "app/comun/minha-participacao/public-projection-consent-panel.tsx"
      - ".github/workflows/comun-48-6-b2-a2-disposable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/48-6-b2-a2-contract.node-test.mjs

  disposable-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start disposable local database
        run: supabase start
      - name: Execute B2-A2 deterministic matching proof
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/comun-b2-a2-supabase-status.env"
          trap 'rm -f "$status_file"' EXIT
          db=""
          for attempt in $(seq 1 150); do
            if supabase status -o env >"$status_file" 2>/dev/null; then
              db="$(sed -n 's/^DB_URL=//p' "$status_file" | sed 's/^"//; s/"$//')"
              if [ -n "$db" ] && pg_isready -d "$db" >/dev/null 2>&1; then break; fi
            fi
            if [ "$attempt" -eq 150 ]; then
              echo B2_A2_DISPOSABLE_POSTGRES_NOT_READY >&2
              exit 1
            fi
            sleep 2
          done
          test -n "$db"
          psql "$db" -v ON_ERROR_STOP=1 -f scripts/comun-denuncias-b2-a2-disposable.sql
          echo "## COMUN 48.6-B2-A2 disposable proof"
          echo
          echo COMUN_48_6_B2_A2_DISPOSABLE_PRIVATE_MATCHING_GREEN
          echo projectionRows=0
          echo confirmationRows=0
          echo automaticPautaCreation=false
          echo automaticCollectiveActionCreation=false
          echo automaticOfficialSend=false
          echo businessWrites=0
          echo rollback=verified
      - if: always()
        run: supabase stop --no-backup
