name: COMUN Experience Coherence Deliverability

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/experience-coherence.ts"
      - "docs/comun-experience-*.md"
      - "scripts/experience/**"
      - "tests/experience-coherence/**"
      - "playwright.experience-coherence.config.ts"
      - "package.json"
      - ".github/actions/setup-playwright-browser/**"
      - "scripts/ci/install-playwright-browser.mjs"
      - ".github/workflows/comun-experience-coherence.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/experience-coherence.ts"
      - "docs/comun-experience-*.md"
      - "scripts/experience/**"
      - "tests/experience-coherence/**"
      - "playwright.experience-coherence.config.ts"
      - "package.json"
      - ".github/actions/setup-playwright-browser/**"
      - "scripts/ci/install-playwright-browser.mjs"
      - ".github/workflows/comun-experience-coherence.yml"
  workflow_dispatch:

concurrency:
  group: comun-experience-coherence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coherence:
    name: Experience coherence / READY_FOR_USABILITY_REHEARSAL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm ci --ignore-scripts
      - name: Audit routes, vocabulary, tokens and pilots
        run: npm run experience:coherence:audit
      - run: npm run experience:coherence:test
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run lint
      - name: Check formatted files introduced by this lane
        run: npx prettier --check components/comun-experience-pilot.tsx lib/experience-coherence.ts docs/comun-experience-coherence.md docs/comun-experience-routes.md scripts/experience playwright.experience-coherence.config.ts tests/experience-coherence .github/workflows/comun-experience-coherence.yml
      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-pauta-action-cycle-local-reset.mjs start
          reset_output="$(mktemp)"
          trap 'rm -f "$reset_output"' EXIT
          set +e
          node scripts/run-pauta-action-cycle-local-reset.mjs reset >"$reset_output" 2>&1
          reset_status=$?
          set -e
          if ((reset_status != 0)) && grep -q "Error status 502" "$reset_output"; then
            echo COMUN_EXPERIENCE_COHERENCE_LOCAL_RESET_502_SINGLE_RETRY
            node scripts/run-pauta-action-cycle-local-reset.mjs reset
          elif ((reset_status != 0)); then
            cat "$reset_output"
            exit "$reset_status"
          fi
      - uses: ./.github/actions/setup-playwright-browser
      - run: npm run test:e2e:experience-coherence
      - run: npm run build
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup
      - name: Publish sanitized coherence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-experience-coherence-${{ github.run_id }}
          path: .ci-artifacts/experience-coherence/coherence.json
          if-no-files-found: warn
          retention-days: 14
