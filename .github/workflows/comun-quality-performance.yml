name: COMUN Quality Performance Deliverability

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/sw.js"
      - "scripts/quality/**"
      - "scripts/quality/run-isolated-a11y.mjs"
      - "tests/quality-performance/**"
      - "tests/comun-pwa-experience/**"
      - "supabase/migrations/**"
      - "supabase/releases/**"
      - "config/comun-quality-budgets.json"
      - "docs/comun-quality-*.md"
      - "playwright.quality-performance.config.ts"
      - "playwright.quality-network.config.ts"
      - "playwright.comun-pwa-experience.config.ts"
      - "package*.json"
      - ".github/workflows/comun-quality-performance.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/sw.js"
      - "scripts/quality/**"
      - "scripts/quality/run-isolated-a11y.mjs"
      - "tests/quality-performance/**"
      - "tests/comun-pwa-experience/**"
      - "supabase/migrations/**"
      - "supabase/releases/**"
      - "config/comun-quality-budgets.json"
      - "docs/comun-quality-*.md"
      - "playwright.quality-performance.config.ts"
      - "playwright.quality-network.config.ts"
      - "playwright.comun-pwa-experience.config.ts"
      - "package*.json"
      - ".github/workflows/comun-quality-performance.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Laboratório local ou post-merge allowlisted
        required: true
        type: choice
        default: local
        options: [local, full, network]

concurrency:
  group: comun-quality-performance-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'automatic' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  network-lane:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'network')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMUN_QUALITY_NETWORK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The candidate Production schema intentionally excludes the local-only
      # territory extension. The dedicated territory lane opts in explicitly.
      COMUN_TERRITORY_PROFILE_ENABLED: disabled
      COMUN_TERRITORY_CATALOG_LOCAL: disabled
      # The integral journey creates a synthetic account and must be able to
      # complete onboarding. This is scoped to the disposable CI lane only;
      # Production registration remains controlled by its deployment flags.
      COMMUNITY_REGISTRATION_MODE: open
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Envelope sanitizado do laboratório focal
        run: mkdir -p .ci-artifacts/quality-performance && node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/00-envelope.json',JSON.stringify({status:'started',scope:'network_focal_disposable',containsPersonalData:false,containsQueries:false,containsSecrets:false},null,2))"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Rede degradada em Chromium low-Android isolado
        run: |
          npm run quality:network:runner-test
          free -h
          df -h . /dev/shm
          npm run quality:network
      - name: Marcador sanitizado de falha
        if: failure()
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/99-failure.json',JSON.stringify({status:'failed',containsPersonalData:false,containsQueries:false,containsSecrets:false,tracesPublished:false},null,2))"
      - name: Publicar somente JSON sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-quality-network-${{ github.run_id }}
          path: .ci-artifacts/quality-performance/*.json
          if-no-files-found: error
          retention-days: 14

  isolated-a11y:
    name: COMUN Quality / isolated a11y
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'local')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ALLOW_LOCAL_TESTS: "true"
      COMUN_TERRITORY_PROFILE_ENABLED: disabled
      COMUN_TERRITORY_CATALOG_LOCAL: disabled
      COMUN_QUALITY_A11Y_PORT: 3037
      COMUN_BASE_URL: http://127.0.0.1:3037
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3037
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: mkdir -p .ci-artifacts/p1-quality-a11y
      - run: npm ci --ignore-scripts
      - name: Supabase descartável
        run: |
          supabase start
          supabase db reset --local --yes
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Núcleo a11y com servidor isolado e monitorado
        run: |
          node scripts/quality/run-isolated-a11y.mjs npm run test:a11y:comun-nucleo-vivo
          node -e "const r=require('./.ci-artifacts/p1-quality-a11y/result.json'); if(r.result!=='COMUN_P1_CI_A11Y_TARGETED_GREEN') process.exit(1); console.log(JSON.stringify({result:'COMUN_P1_CI_A11Y_INFRASTRUCTURE_GREEN',server:r.result},null,2))"
      - name: Publicar diagnóstico sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-p1-quality-isolated-a11y-${{ github.run_id }}
          path: .ci-artifacts/p1-quality-a11y
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup Supabase
        if: always()
        run: supabase stop --no-backup || true

  pr-lane:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'local')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      COMUN_QUALITY_NETWORK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The candidate Production schema intentionally excludes the local-only
      # territory extension. The dedicated territory lane opts in explicitly.
      COMUN_TERRITORY_PROFILE_ENABLED: disabled
      COMUN_TERRITORY_CATALOG_LOCAL: disabled
      # The integral journey creates a synthetic account and must be able to
      # complete onboarding. This is scoped to the disposable CI lane only;
      # Production registration remains controlled by its deployment flags.
      COMMUNITY_REGISTRATION_MODE: open
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Envelope sanitizado antes da primeira escrita
        run: mkdir -p .ci-artifacts/quality-performance && node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/00-envelope.json',JSON.stringify({status:'started',scope:'disposable_local',containsPersonalData:false,containsQueries:false,containsSecrets:false},null,2))"
      - run: npm ci --ignore-scripts
      - name: Secrets, contratos, corpus e carga sintética
        run: |
          npm run security:secrets
          npm run quality:test
          npm run quality:load
      - name: Supabase descartável e migration forward-only
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
        run: |
          supabase start
          supabase db reset --local --yes
          node scripts/comun-local-env.mjs run node scripts/solo/apply-forward-only.mjs --adopt-local-validation-ledger
          npm run audit:rls-matrix
      - run: npx playwright install --with-deps chromium
      - name: Build único para servidores a11y focais
        run: npm run build
      - name: Regressões focais de Núcleo, Calçadas e Rádio
        run: |
          npm run test:e2e:comun-nucleo-vivo
          COMUN_QUALITY_A11Y_ARTIFACT_DIR=.ci-artifacts/p1-quality-a11y/nucleo node scripts/quality/run-isolated-a11y.mjs npm run test:a11y:comun-nucleo-vivo
          COMUN_SIDEWALK_OPERATIONAL_V2=enabled npm run test:e2e:comun-calcadas-operacional
          COMUN_SIDEWALK_OPERATIONAL_V2=enabled COMUN_QUALITY_A11Y_ARTIFACT_DIR=.ci-artifacts/p1-quality-a11y/calcadas node scripts/quality/run-isolated-a11y.mjs npm run test:a11y:comun-calcadas-operacional
          npm run test:e2e:community-radio
          COMUN_QUALITY_A11Y_ARTIFACT_DIR=.ci-artifacts/p1-quality-a11y/radio node scripts/quality/run-isolated-a11y.mjs npm run test:a11y:community-radio
      - name: WCAG automatizável em nove viewports
        run: COMUN_QUALITY_A11Y_ARTIFACT_DIR=.ci-artifacts/p1-quality-a11y/quality node scripts/quality/run-isolated-a11y.mjs npm run quality:a11y
      - name: PWA, cache privado, update e offline
        run: npm run quality:pwa
      - name: Performance, hidratação, bundles e rede degradada
        run: |
          npm run quality:performance
          npm run quality:network:runner-test
          free -h
          df -h . /dev/shm
          npm run quality:network
      - name: Jornadas integrais e regressões dos domínios existentes
        run: |
          npm run test:e2e:comun-integral-experience
          npm run test:e2e:experience-coherence
          npm run test:a11y:experience-coherence
          npm run test:e2e:comun-pwa-experience
          npm run test:e2e:comun-mobile-app-shell
          npm run test:e2e:central-experience
          npm run test:a11y:central-experience
          npm run test:e2e:comun-miniapp-experience
          node scripts/comun-local-env.mjs run npm run test:e2e:territorial-art
          node scripts/comun-local-env.mjs run npm run test:a11y:territorial-art
      - name: Smokes HTTP contra release local isolada
        env:
          COMUN_BASE_URL: http://127.0.0.1:3049
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3049
        run: |
          node scripts/comun-local-env.mjs run npm run start -- -p 3049 > /tmp/comun-quality-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3049/comun >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then echo "COMUN_LOCAL_RELEASE_NOT_READY"; exit 1; fi
            sleep 2
          done
          node scripts/comun-local-env.mjs run npm run smoke:core-public-routes
          node scripts/comun-local-env.mjs run npm run smoke:public-ui
          node scripts/comun-local-env.mjs run npm run smoke:no-leak-http
      - name: Regressões estáticas e build
        run: |
          npm run experience:coherence:test
          npm run civic-intelligence:test
          npm run security:test
          npm run test:unit
          node -e "require('node:fs').rmSync('.next/dev',{recursive:true,force:true})"
          npm run typecheck
          npm run lint
          npm run build
      - name: Formatação focal e whitespace
        run: |
          npx --yes prettier@3.9.6 --check app/api/comun/quality-metrics app/comun/ajuda app/comun/admin/observabilidade app/comun/buscar app/comun/conta app/globals.css app/layout.tsx components/comun-web-vitals.tsx components/comun-pwa-runtime.tsx components/community-auth-form.tsx components/admin-login-form.tsx lib/quality-* lib/comun-pwa* lib/comun-date.ts scripts/quality tests/quality-performance tests/comun-pwa-experience config/comun-quality-budgets.json docs/comun-quality-*.md playwright.quality-performance.config.ts playwright.quality-network.config.ts .github/workflows/comun-quality-performance.yml
          git diff --check
      - name: Evidência agregada sanitizada
        run: |
          npm run quality:collect
          cp reports/generated/*.json .ci-artifacts/quality-performance/
      - name: Cleanup local
        if: always()
        run: supabase stop --no-backup || true
      - name: Marcador sanitizado de falha
        if: failure()
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/99-failure.json',JSON.stringify({status:'failed',containsPersonalData:false,containsQueries:false,containsSecrets:false,tracesPublished:false},null,2))"
      - name: Publicar somente JSON sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-quality-performance-${{ github.run_id }}
          path: .ci-artifacts/quality-performance/*.json
          if-no-files-found: error
          retention-days: 14

  territory-local-only-contract:
    name: COMUN Territory / local-only contract
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'local')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALLOW_LOCAL_TESTS: "true"
      COMUN_TERRITORY_CATALOG_LOCAL: enabled
      COMUN_TERRITORY_PROFILE_ENABLED: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: npm ci --ignore-scripts
      - name: Start disposable Supabase and apply territory extension explicitly
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { supabase stop --no-backup >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          supabase start
          supabase db reset --local --yes
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          [[ "$db_url" =~ ^postgresql://postgres:postgres@127\.0\.0\.1:[0-9]+/postgres$ ]]
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/local-migrations/20260805090000_comun_member_profile_territory_selection.sql
          local_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$local_env" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          anon_key="$(printf '%s\n' "$local_env" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          service_key="$(printf '%s\n' "$local_env" | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY="$service_key"
          node scripts/solo/territory-local-only-contract.mjs
      - name: Publicar apenas evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-territory-local-only-${{ github.run_id }}
          path: .ci-artifacts/territory-local-only/*.json
          if-no-files-found: warn
          retention-days: 14

  territory-p1t-local-contract:
    name: COMUN Territory / P1T disposable promotion contract
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'local')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMUN_TERRITORY_PROFILE_ENABLED: enabled
      COMUN_TERRITORY_CATALOG_LOCAL: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - run: npm ci --ignore-scripts
      - name: Start disposable Supabase and apply only the P1T migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p1t-territory
          cleanup() { supabase stop --no-backup >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          supabase start
          supabase db reset --local --yes
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          [[ "$db_url" =~ ^postgresql://postgres:postgres@127\.0\.0\.1:[0-9]+/postgres$ ]]
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260806235454_comun_member_profile_optional_territory.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260806235454_comun_member_profile_optional_territory.sql
          psql "$db_url" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_bad integer;
            v_rls boolean;
            v_force boolean;
          begin
            select count(*) into v_bad
              from information_schema.columns
             where table_schema='public'
               and table_name='comun_member_profiles'
               and column_name in ('territory_municipality','territory_neighborhood','territory_source_version')
               and (data_type <> 'text' or is_nullable <> 'YES' or column_default is not null);
            if v_bad <> 0 then raise exception 'P1T column contract mismatch'; end if;
            select c.relrowsecurity, c.relforcerowsecurity into v_rls, v_force
              from pg_class c join pg_namespace n on n.oid=c.relnamespace
             where n.nspname='public' and c.relname='comun_member_profiles';
            if not v_rls or v_force then raise exception 'P1T RLS contract mismatch'; end if;
            select count(*) into v_bad
              from information_schema.role_table_grants
             where table_schema='public' and table_name='comun_member_profiles'
               and grantee in ('PUBLIC','anon','authenticated');
            if v_bad <> 0 then raise exception 'P1T public grants widened'; end if;
          end $$;
          SQL
          local_env="$(supabase status -o env)"
          api_url="$(printf '%s\n' "$local_env" | sed -n 's/^API_URL="\(.*\)"$/\1/p')"
          anon_key="$(printf '%s\n' "$local_env" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')"
          service_key="$(printf '%s\n' "$local_env" | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          export NEXT_PUBLIC_SUPABASE_URL="$api_url"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon_key"
          export SUPABASE_SERVICE_ROLE_KEY="$service_key"
          node scripts/solo/p1t-territory-local-contract.mjs
      - name: Publicar apenas evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-p1t-territory-local-${{ github.run_id }}
          path: .ci-artifacts/p1t-territory/*.json
          if-no-files-found: warn
          retention-days: 14

  post-merge:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      COMUN_BASE_URL: https://comunsocial.online
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      COMUN_QUALITY_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
      COMUN_EXPECTED_SHA: ${{ github.sha }}
      COMUN_QUALITY_NETWORK_SHA: ${{ github.sha }}
      COMUN_QUALITY_ENFORCE_BUDGETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Envelope remoto sanitizado
        run: mkdir -p .ci-artifacts/quality-performance && node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/00-envelope.json',JSON.stringify({status:'started',scope:'allowlisted_remote',containsPersonalData:false,containsQueries:false,containsSecrets:false},null,2))"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: 1. Production preflight do SHA esperado
        run: |
          for attempt in $(seq 1 30); do
            observed="$(curl --silent --show-error --fail "$COMUN_BASE_URL/api/comun/quality-status" | node -e "let x='';process.stdin.on('data',d=>x+=d).on('end',()=>{try{process.stdout.write(JSON.parse(x).version||'')}catch{}})")" || true
            if [ "$observed" = "$COMUN_EXPECTED_SHA" ]; then
              node scripts/quality/remote-comun-quality-rehearsal.mjs
              exit 0
            fi
            echo "COMUN_QUALITY_DEPLOYMENT_NOT_READY attempt=$attempt"
            sleep 20
          done
          echo "COMUN_QUALITY_EXPECTED_SHA_NOT_DEPLOYED"
          exit 1
      - name: Transporte focal de observabilidade agregada
        run: node scripts/quality/apply-comun-quality-remote.mjs
      - name: 2. PWA
        run: npm run quality:pwa
      - name: 3. Acessibilidade sintética
        run: npm run quality:a11y
      - name: 4. Performance sintética
        run: npm run quality:performance
      - name: 5. Carga local sem publicação
        run: npm run quality:load
      - name: 6. Rede degradada em navegador isolado
        run: |
          npm run quality:network:runner-test
          free -h
          df -h . /dev/shm
          npm run quality:network
      - name: 7. Autenticação e superfície protegida sem mutation
        run: node scripts/quality/remote-comun-quality-rehearsal.mjs
      - name: 8. Postflight no-leak e coleta
        run: |
          NEXT_PUBLIC_SITE_URL="$COMUN_BASE_URL" npm run smoke:no-leak-http
          npm run quality:collect -- --promote
          cp reports/generated/*.json .ci-artifacts/quality-performance/
      - name: 9. Classificação honesta
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/98-classification.json',JSON.stringify({result:'COMUN_QUALITY_PERFORMANCE_READY_FOR_REAL_DEVICE_REHEARSAL',physicalAndroid:'pending',secondPhysicalPlatform:'pending',realAssistiveTechnology:'pending',fieldSample:'pending',launchPublicly:'not_triggered'},null,2))"
      - name: Marcador sanitizado de falha
        if: failure()
        run: node -e "require('node:fs').writeFileSync('.ci-artifacts/quality-performance/99-failure.json',JSON.stringify({status:'failed',containsPersonalData:false,containsQueries:false,containsSecrets:false,tracesPublished:false},null,2))"
      - name: Publicar somente JSON sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-quality-performance-remote-${{ github.run_id }}
          path: .ci-artifacts/quality-performance/*.json
          if-no-files-found: error
          retention-days: 14
