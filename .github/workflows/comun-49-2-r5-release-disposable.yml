name: COMUN 49.2 R5 release disposable derivation

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-r5-release-disposable.yml"
      - "scripts/49-2-r5-release/**"
      - "reports/current/comun-49-2-r5-production-pre.json"

permissions: { contents: read }

jobs:
  derive:
    if: github.head_ref == 'codex/comun-49-2-r5-release-certification'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: npm ci --ignore-scripts
      - name: Derive exact PRE and POST from Production-like fixture
        shell: bash
        run: bash scripts/49-2-r5-release/derive-post.sh
      - run: node --test scripts/49-2-a0-r5-public-projection-contract.node-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: comun-49-2-r5-release-derived-${{ github.run_id }}
          path: |
            .ci-artifacts/comun-49-2-r5-release/pre.json
            .ci-artifacts/comun-49-2-r5-release/post.json
            .ci-artifacts/comun-49-2-r5-release/derived.json
            .ci-artifacts/comun-49-2-r5-release/derived.sha256
            .ci-artifacts/comun-49-2-r5-release/migration.sha256
          if-no-files-found: error
          retention-days: 7
