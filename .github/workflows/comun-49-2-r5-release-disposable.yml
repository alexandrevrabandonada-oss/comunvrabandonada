name: COMUN 49.2 R5 immutable release disposable proof
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/comun-49-2-r5-release-disposable.yml"
      - "scripts/49-2-r5-release/**"
      - "reports/current/comun-49-2-r5-production-pre.json"
      - "reports/current/comun-49-2-r5-release-disposable-derived.json"
      - "supabase/release-bundles/20260927-comun-49-2-r5-public-projection-gate.json"
permissions: { contents: read }
jobs:
  release:
    if: startsWith(github.head_ref, 'codex/comun-49-2-r5-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Assert no Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL+x}"
          test -z "${SUPABASE_ACCESS_TOKEN+x}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY+x}"
          test -z "${SUPABASE_URL+x}"
      - name: Validate immutable R5 release
        run: |
          node scripts/49-2-r5-release/validate-manifest.mjs
          node --test scripts/49-2-r5-release/*.node-test.mjs
      - name: Reproduce exact Production PRE and derive exact R5 POST
        run: bash scripts/49-2-r5-release/derive-post.sh
      - name: Require derived fingerprints to match pinned evidence
        run: node scripts/49-2-r5-release/verify-derived.mjs .ci-artifacts/comun-49-2-r5-release/derived.json reports/current/comun-49-2-r5-release-disposable-derived.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-49-2-r5-release-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r5-release
          if-no-files-found: error
          retention-days: 14
