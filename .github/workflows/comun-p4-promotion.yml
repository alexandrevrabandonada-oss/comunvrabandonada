name: COMUN P4 schema promotion

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to validate
        required: true
        type: string
      mode:
        description: Read-only preflight, exact-one promotion, or postflight
        required: true
        type: choice
        options: [preflight, promote, postflight]

concurrency:
  group: comun-p4-schema-promotion
  cancel-in-progress: false

permissions:
  contents: read

env:
  P4_MIGRATION: 20260808180246_comun_sidewalk_relata_real.sql
  P4_MANIFEST: supabase/releases/20260808180246-comun-sidewalk-relata-real.json
  P4_SHA256: 6ed799985fe9270ae9a8406d043d566520c2f9c89002493393c37d7076d9c494
  EXTERNAL_MIGRATION: supabase/migrations/20260724233256_comun_sidewalk_operational_hardening.sql
  EXTERNAL_EXCEPTION: supabase/migration-exceptions/20260724233256-sidewalk-external-ledger.json

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - run: npm ci --ignore-scripts

      - name: Validate exact immutable candidate
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm run solo:sql:validate -- --release-manifest="$P4_MANIFEST"
          test "$(node -e "const m=require('./$P4_MANIFEST'); process.stdout.write(m.migration)")" = "supabase/migrations/$P4_MIGRATION"
          test "$(sha256sum "supabase/migrations/$P4_MIGRATION" | awk '{print $1}')" = "$P4_SHA256"

      - name: Reconcile historical external ledger and verify exact-one plan
        if: inputs.mode == 'preflight' || inputs.mode == 'promote'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test "$(node -e "const e=require('./$EXTERNAL_EXCEPTION'); process.stdout.write(e.path)")" = "$EXTERNAL_MIGRATION"
          test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          quarantine="${RUNNER_TEMP}/comun-p4-external-ledger.sql"
          test ! -e "$quarantine"
          mv "$EXTERNAL_MIGRATION" "$quarantine"
          restore_external() {
            if test -e "$quarantine"; then mv "$quarantine" "$EXTERNAL_MIGRATION"; fi
            test "$(sha256sum "$EXTERNAL_MIGRATION" | awk '{print $1}')" = "6a2e69dcc66f760fa1828bb43249079e8db474ad8b175d3af6aa7c97ec05b1be"
          }
          trap restore_external EXIT
          mkdir -p .ci-artifacts/p4-promotion
          supabase migration list --db-url "$SUPABASE_DB_URL" >.ci-artifacts/p4-promotion/migration-list.txt 2>&1
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run >.ci-artifacts/p4-promotion/dry-run.txt 2>&1
          mapfile -t planned < <(grep -oE '20[0-9]{12}_[a-z0-9_]+\.sql' .ci-artifacts/p4-promotion/dry-run.txt | sort -u || true)
          test "${#planned[@]}" -eq 1
          test "${planned[0]}" = "$P4_MIGRATION"
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('.ci-artifacts/p4-promotion/plan.json', JSON.stringify({
            result: 'COMUN_P4_REMOTE_PLAN_EXACT_ONE',
            migration: process.env.P4_MIGRATION,
            historicalExternalLedgerQuarantinedTemporarily: true,
            includeAll: false,
            repair: false,
            seed: false,
          }, null, 2) + '\n');
          NODE
          if test "${{ inputs.mode }}" = promote; then
            supabase db push --db-url "$SUPABASE_DB_URL"
          fi
          echo COMUN_P4_REMOTE_PLAN_EXACT_ONE >> "$GITHUB_STEP_SUMMARY"

      - name: Verify P4 schema, RLS, grants, and empty baseline
        if: inputs.mode == 'promote' || inputs.mode == 'postflight'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          mkdir -p .ci-artifacts/p4-promotion
          psql "$SUPABASE_DB_URL" -XAt -v ON_ERROR_STOP=1 >.ci-artifacts/p4-promotion/postflight.txt <<'SQL'
          select json_build_object(
            'migrationHistoryPresent', exists (
              select 1 from supabase_migrations.schema_migrations where version='20260808180246'
            ),
            'tablePresent', to_regclass('private.comun_sidewalk_relata_intakes') is not null,
            'rowSecurity', c.relrowsecurity,
            'forceRowSecurity', c.relforcerowsecurity,
            'publicCrud', has_table_privilege('public', c.oid, 'SELECT') or has_table_privilege('public', c.oid, 'INSERT') or has_table_privilege('public', c.oid, 'UPDATE') or has_table_privilege('public', c.oid, 'DELETE'),
            'anonCrud', has_table_privilege('anon', c.oid, 'SELECT') or has_table_privilege('anon', c.oid, 'INSERT') or has_table_privilege('anon', c.oid, 'UPDATE') or has_table_privilege('anon', c.oid, 'DELETE'),
            'authenticatedCrud', has_table_privilege('authenticated', c.oid, 'SELECT') or has_table_privilege('authenticated', c.oid, 'INSERT') or has_table_privilege('authenticated', c.oid, 'UPDATE') or has_table_privilege('authenticated', c.oid, 'DELETE'),
            'serviceRoleReadWrite', has_table_privilege('service_role', c.oid, 'SELECT') and has_table_privilege('service_role', c.oid, 'INSERT') and has_table_privilege('service_role', c.oid, 'UPDATE'),
            'policyCount', (select count(*) from pg_policy where polrelid=c.oid),
            'rowCount', (select count(*) from private.comun_sidewalk_relata_intakes)
          )
          from pg_class c join pg_namespace n on n.oid=c.relnamespace
          where n.nspname='private' and c.relname='comun_sidewalk_relata_intakes';

          with expected(name) as (values
            ('comun_sidewalk_intake_create'),
            ('comun_sidewalk_intake_finalize'),
            ('comun_sidewalk_intake_admin_list'),
            ('comun_sidewalk_intake_review')
          ), observed as (
            select e.name, p.oid,
              p.prosecdef,
              coalesce(array_to_string(p.proconfig, ','), '') as config,
              has_function_privilege('public', p.oid, 'EXECUTE') as public_exec,
              has_function_privilege('anon', p.oid, 'EXECUTE') as anon_exec,
              has_function_privilege('authenticated', p.oid, 'EXECUTE') as authenticated_exec,
              has_function_privilege('service_role', p.oid, 'EXECUTE') as service_role_exec
            from expected e
            left join pg_proc p on p.proname=e.name and p.pronamespace='public'::regnamespace
          )
          select json_build_object(
            'expected', 4,
            'observed', count(oid),
            'allSecurityDefiner', bool_and(prosecdef),
            'allSearchPathPinned', bool_and(config='search_path=pg_catalog, private, public'),
            'publicExecute', bool_or(public_exec),
            'anonExecute', bool_or(anon_exec),
            'authenticatedExecute', bool_or(authenticated_exec),
            'serviceRoleExecuteAll', bool_and(service_role_exec)
          ) from observed;
          SQL
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync('.ci-artifacts/p4-promotion/postflight.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const table = rows[0];
          const rpcs = rows[1];
          if (!table.migrationHistoryPresent || !table.tablePresent || !table.rowSecurity || !table.forceRowSecurity
            || table.publicCrud || table.anonCrud || table.authenticatedCrud || !table.serviceRoleReadWrite
            || table.policyCount !== 0 || table.rowCount !== 0) throw new Error('COMUN_P4_REMOTE_RLS_POSTFLIGHT_FAILED');
          if (rpcs.expected !== 4 || rpcs.observed !== 4 || !rpcs.allSecurityDefiner || !rpcs.allSearchPathPinned
            || rpcs.publicExecute || rpcs.anonExecute || rpcs.authenticatedExecute || !rpcs.serviceRoleExecuteAll) {
            throw new Error('COMUN_P4_REMOTE_RPC_POSTFLIGHT_FAILED');
          }
          fs.writeFileSync('.ci-artifacts/p4-promotion/postflight.json', JSON.stringify({
            result: 'COMUN_P4_REMOTE_SCHEMA_PROMOTED_FLAGS_OFF',
            table,
            rpcs,
            flagsChanged: false,
            testDataCreated: false,
          }, null, 2) + '\n');
          NODE
          echo COMUN_P4_REMOTE_SCHEMA_PROMOTED_FLAGS_OFF >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p4-promotion-${{ github.run_id }}
          path: .ci-artifacts/p4-promotion
          retention-days: 14
          if-no-files-found: ignore
