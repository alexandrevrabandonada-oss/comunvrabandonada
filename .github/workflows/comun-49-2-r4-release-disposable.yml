name: COMUN 49.2 R4 private release disposable PRE/POST

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/comun-49-2-r4-release-disposable.yml
      - scripts/49-2-r4-release/**
      - reports/current/comun-49-2-r4-production-pre.json
      - reports/current/comun-49-2-r4-release-disposable-derived.json
      - supabase/release-bundles/20260925-comun-49-2-r4-private-legitimacy-eligibility.json

permissions: { contents: read }

jobs:
  disposable-pre-post:
    if: github.head_ref == 'codex/comun-49-2-r4-private-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Assert no Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL+x}"
          test -z "${SUPABASE_ACCESS_TOKEN+x}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY+x}"
      - name: Validate immutable R4 release contract
        run: |
          node scripts/49-2-r4-release/validate-manifest.mjs
          node --test scripts/49-2-r4-release/*.node-test.mjs
      - name: Reproduce Production PRE and derive R4 POST
        run: bash scripts/49-2-r4-release/derive-post.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-49-2-r4-disposable-${{ github.run_id }}
          path: .ci-artifacts/comun-49-2-r4-release
          if-no-files-found: error
          retention-days: 14
