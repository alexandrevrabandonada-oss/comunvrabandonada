name: COMUN P5 domain activation

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact merged main SHA to deploy
        required: true
        type: string
      mode:
        description: Deploy flags off, activate one wave, or roll back one capability
        required: true
        type: choice
        options: [flags-off, activate-bus-smoke, activate-stmu-readonly, rollback-bus, rollback-stmu]

concurrency:
  group: comun-p5-domain-activation
  cancel-in-progress: false
permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_LBVwyK8FQMO7tA3hzVXXeumF
  VERCEL_PROJECT_ID: prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X
  COMUN_BASE_URL: https://comunsocial.online

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Verify exact main and tooling
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          npm ci --ignore-scripts
          node --check scripts/solo/rehearse-p5-bus-production.mjs

      - name: Set P5 flags without reading Production values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          bus=disabled
          stmu=disabled
          case "${{ inputs.mode }}" in
            activate-bus-smoke|rollback-stmu) bus=enabled ;;
            activate-stmu-readonly) bus=enabled; stmu=enabled ;;
            flags-off|rollback-bus) ;;
            *) echo COMUN_P5_ACTIVATION_MODE_INVALID; exit 1 ;;
          esac
          printf '%s' "$bus" | npx --yes vercel@50.28.0 env add COMUN_BUS_RELATA_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-bus-env.out 2>/tmp/comun-p5-bus-env.err
          printf '%s' "$stmu" | npx --yes vercel@50.28.0 env add COMUN_STMU_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-stmu-env.out 2>/tmp/comun-p5-stmu-env.err

      - name: Deploy exact main with current Production environment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-deploy.out 2>/tmp/comun-p5-deploy.err
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p5-deploy.out | tail -n 1 | tr -d '\r')"
          case "$deployment_url" in https://*.vercel.app) ;; *) echo COMUN_P5_DEPLOYMENT_URL_UNAVAILABLE; exit 1 ;; esac
          printf 'deployment_url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Promote exact deployment to canonical domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@50.28.0 promote "$DEPLOYMENT_URL" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-promote.out 2>/tmp/comun-p5-promote.err
          npx --yes vercel@50.28.0 alias set "$DEPLOYMENT_URL" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-alias.out 2>/tmp/comun-p5-alias.err
      - name: Verify preserved domain surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in /comun /comun/relatar /comun/calcadas /comun/minha-participacao; do
            test "$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 2 "$COMUN_BASE_URL$path")" = 200
          done

      - name: Verify flags-off cloak
        if: inputs.mode == 'flags-off' || inputs.mode == 'rollback-bus'
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$COMUN_BASE_URL/comun/onibus")" = 404
          for method in GET POST PUT PATCH DELETE HEAD OPTIONS; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$COMUN_BASE_URL/api/comun/onibus/intake")" = 404
            test "$(curl -sS -o /dev/null -w '%{http_code}' -X "$method" "$COMUN_BASE_URL/api/comun/stmu-assisted/packages/00000000-0000-0000-0000-000000000000/open")" = 404
          done
          echo COMUN_P5_CODE_DEPLOYED_FLAGS_OFF >> "$GITHUB_STEP_SUMMARY"

      - name: Verify bus UI before creating fixture
        if: inputs.mode == 'activate-bus-smoke'
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          trap 'rm -f "$page"' EXIT
          curl -L -fsS --retry 8 --retry-delay 2 "$COMUN_BASE_URL/comun/onibus?__p5_gate=$GITHUB_RUN_ID" >"$page"
          grep -q 'data-comun-bus-p5="intake"' "$page"
          grep -q 'não envia nada à STMU automaticamente' "$page"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$COMUN_BASE_URL/api/comun/stmu-assisted/packages/00000000-0000-0000-0000-000000000000/open")" = 404
      - name: Allocate synthetic bus attempt
        id: attempt
        if: inputs.mode == 'activate-bus-smoke'
        shell: bash
        run: |
          marker="P5-SMOKE-${GITHUB_RUN_ID}-$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')"
          printf 'attempt_id=%s\n' "$marker" >> "$GITHUB_OUTPUT"
      - name: Run real private bus smoke with finally cleanup
        id: bus_smoke
        if: inputs.mode == 'activate-bus-smoke'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p5-production
          node scripts/solo/rehearse-p5-bus-production.mjs >.ci-artifacts/p5-production/bus-smoke.json
          grep -q COMUN_P5A_PRODUCTION_PRIVATE_BUS_GREEN .ci-artifacts/p5-production/bus-smoke.json
      - name: Recover exact synthetic bus attempt after process failure
        if: always() && inputs.mode == 'activate-bus-smoke' && steps.attempt.outcome == 'success' && steps.attempt.outputs.attempt_id != '' && steps.bus_smoke.outcome != 'success'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ATTEMPT_ID: ${{ steps.attempt.outputs.attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p5-production
          node scripts/solo/rehearse-p5-bus-production.mjs --recover >.ci-artifacts/p5-production/recovery.json

      - name: Verify STMU capability read-only and no external action
        id: stmu_readonly
        if: inputs.mode == 'activate-stmu-readonly'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/p5-production
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$COMUN_BASE_URL/comun/onibus")" = 200
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$COMUN_BASE_URL/comun/minha-participacao")" = 200
          grep -q 'https://wa.me/5524992958558' lib/comun-stmu-whatsapp.ts
          grep -q 'mailto:stmu@voltaredonda.rj.gov.br' lib/comun-stmu-multichannel.ts
          ! grep -Eq 'https://wa.me/5524992958558\?|mailto:stmu@voltaredonda.rj.gov.br\?' lib/comun-stmu-whatsapp.ts lib/comun-stmu-multichannel.ts
          before="$(psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 -c 'select count(*) from private.comun_forwarding_attempts')"
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/p5-production/stmu-readonly.json <<'SQL'
          with expected(name) as (values ('comun_stmu_assisted_prepare'),('comun_stmu_assisted_list'),('comun_stmu_assisted_open'),('comun_stmu_assisted_declare_sent'),('comun_stmu_assisted_record_response'))
          select json_build_object(
            'result','COMUN_P5B_STMU_ASSISTED_READ_ONLY_GREEN',
            'expectedRpcs',5,
            'observedRpcs',(select count(*) from pg_proc p join expected e on e.name=p.proname where p.pronamespace='public'::regnamespace),
            'whatsappDestination','allowlisted_exact_no_query',
            'emailDestination','allowlisted_exact_no_query',
            'externalRequests',0,
            'automaticSend',false
          );
          SQL
          after="$(psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 -c 'select count(*) from private.comun_forwarding_attempts')"
          test "$before" = "$after"
          node -e "const r=require('./.ci-artifacts/p5-production/stmu-readonly.json'); if(r.observedRpcs!==5||r.externalRequests!==0||r.automaticSend!==false) process.exit(1)"
          echo COMUN_P5B_STMU_ASSISTED_READ_ONLY_GREEN >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back affected P5 flag automatically after failed gate
        if: always() && ((inputs.mode == 'activate-bus-smoke' && steps.bus_smoke.outcome != 'success') || (inputs.mode == 'activate-stmu-readonly' && steps.stmu_readonly.outcome != 'success'))
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bus=enabled
          stmu=disabled
          if test "${{ inputs.mode }}" = activate-bus-smoke; then bus=disabled; fi
          printf '%s' "$bus" | npx --yes vercel@50.28.0 env add COMUN_BUS_RELATA_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-rollback-bus.out 2>/tmp/comun-p5-rollback-bus.err
          printf '%s' "$stmu" | npx --yes vercel@50.28.0 env add COMUN_STMU_ASSISTED_ENABLED production --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-rollback-stmu.out 2>/tmp/comun-p5-rollback-stmu.err
          npx --yes vercel@50.28.0 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-rollback-deploy.out 2>/tmp/comun-p5-rollback-deploy.err
          rollback_url="$(grep -Eo 'https://[^[:space:]]+' /tmp/comun-p5-rollback-deploy.out | tail -n 1 | tr -d '\r')"
          case "$rollback_url" in https://*.vercel.app) ;; *) exit 1 ;; esac
          npx --yes vercel@50.28.0 promote "$rollback_url" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-rollback-promote.out 2>/tmp/comun-p5-rollback-promote.err
          npx --yes vercel@50.28.0 alias set "$rollback_url" comunsocial.online --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/tmp/comun-p5-rollback-alias.out 2>/tmp/comun-p5-rollback-alias.err
          echo COMUN_P5_CAPABILITY_ROLLED_BACK_AFTER_FAILED_GATE >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comun-p5-domain-${{ github.run_id }}
          path: .ci-artifacts/p5-production
          retention-days: 14
          if-no-files-found: ignore
      - name: Emit P5A marker
        if: success() && inputs.mode == 'activate-bus-smoke'
        run: echo COMUN_P5A_BUS_PRIVATE_DOMAIN_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Emit P5 terminal marker
        if: success() && inputs.mode == 'activate-stmu-readonly'
        run: echo COMUN_48_1B_P5_BUS_STMU_ASSISTED_DOMAIN_GREEN_NO_AUTO_SEND >> "$GITHUB_STEP_SUMMARY"
