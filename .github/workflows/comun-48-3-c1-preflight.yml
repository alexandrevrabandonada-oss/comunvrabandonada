name: COMUN 48.3-C1 remote read-only collective actions preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/readonly-reconciled-migration-plan*"
      - "scripts/ci/classify-migration-lane*"
      - ".github/workflows/comun-48-3-c1-preflight.yml"
      - "lib/comun-collective-actions-canonical*.ts"
      - "components/comun-collective-actions-canonical.tsx"
      - "app/comun/acoes/**"
      - "app/comun/pautas/**"
      - "reports/current/comun-48-3-c1-collective-actions-canonical-experience.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-read-only-collective-actions-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: supabase/setup-cli@v1
        with: { version: 2.113.0 }
      - name: Classify changed migration ownership
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- supabase/migrations)
          node scripts/ci/classify-migration-lane.mjs --lane 48-3-c1 --files "${changed[@]}" | tee "$RUNNER_TEMP/48-3-c1-ownership.txt"
          grep -Eq '^COMUN_MIGRATION_LANE_MODE=(none|not_applicable)$' "$RUNNER_TEMP/48-3-c1-ownership.txt"
          cat "$RUNNER_TEMP/48-3-c1-ownership.txt" >> "$GITHUB_ENV"

      - name: Verify zero migration and metadata-only schema contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          mkdir -p .ci-artifacts/48-3-c1-preflight
          psql "$SUPABASE_DB_URL" -qXAt -v ON_ERROR_STOP=1 >.ci-artifacts/48-3-c1-preflight/schema.json <<'SQL'
          begin read only;
          with canonical(name) as (values
            ('comun_collective_actions'),('comun_collective_action_participations'),
            ('comun_collective_action_tasks'),('comun_collective_action_task_assignments'),
            ('comun_collective_action_updates'),('comun_collective_action_forwardings'),
            ('comun_collective_action_memory_assets'),('comun_pauta_spaces'),
            ('comun_pauta_action_cycles')
          ), own_policies as (
            select count(*) as count from pg_policies where schemaname='public' and policyname in (
              'Members can read own collective participation',
              'Members can create own collective participation',
              'Members can update own collective participation',
              'Members can read own collective task assignment',
              'Members can claim own collective task',
              'Members can release own collective task'
            )
          )
          select json_build_object(
            'transactionReadOnly', current_setting('transaction_read_only')='on',
            'canonicalTablesPresent', (select count(*)=9 from canonical where to_regclass('public.'||name) is not null),
            'legacyTablePresent', to_regclass('public.comun_mobilization_actions') is not null,
            'rlsEnabled', (select bool_and(c.relrowsecurity) from canonical join pg_class c on c.oid=to_regclass('public.'||name)),
            'publicActionSelectPolicy', exists(select 1 from pg_policies where schemaname='public' and tablename='comun_collective_actions' and policyname='Public can read published collective actions'),
            'ownJourneyPolicies', (select count=6 from own_policies),
            'capacityTrigger', exists(select 1 from pg_trigger where tgrelid='public.comun_collective_action_task_assignments'::regclass and tgname='comun_collective_action_task_capacity_guard' and not tgisinternal),
            'memberJourneyTrigger', exists(select 1 from pg_trigger where tgrelid='public.comun_collective_action_participations'::regclass and tgname='comun_collective_action_member_journey_guard' and not tgisinternal),
            'capacityFunctionClosed', not has_function_privilege('anon','public.comun_collective_action_task_capacity_guard()','EXECUTE') and not has_function_privilege('authenticated','public.comun_collective_action_task_capacity_guard()','EXECUTE'),
            'releaseLedgerPresent', exists(select 1 from public.comun_schema_releases where release='20260726133409-comun-collective-actions-foundation' and status='applied'),
            'releaseTablesPresent', (
              select count(*)=8 from (values
                ('comun_collective_actions'),('comun_collective_action_participations'),
                ('comun_collective_action_tasks'),('comun_collective_action_task_assignments'),
                ('comun_collective_action_updates'),('comun_collective_action_sidewalk_records'),
                ('comun_collective_action_forwardings'),('comun_collective_action_memory_assets')
              ) release_table(name) where to_regclass('public.'||name) is not null
            ),
            'serviceRoleWritePath', (select bool_and(has_table_privilege('service_role','public.'||name,'INSERT,UPDATE,DELETE')) from canonical),
            'businessContentRead', false
          );
          rollback;
          SQL
          node - <<'NODE'
          const s=JSON.parse(require('node:fs').readFileSync('.ci-artifacts/48-3-c1-preflight/schema.json','utf8'));
          const requiredTrue=['transactionReadOnly','canonicalTablesPresent','legacyTablePresent','rlsEnabled','publicActionSelectPolicy','ownJourneyPolicies','capacityTrigger','memberJourneyTrigger','capacityFunctionClosed','serviceRoleWritePath'];
          const failed=requiredTrue.filter(key=>s[key]!==true);
          if(s.releaseLedgerPresent!==true && s.releaseTablesPresent!==true) failed.push('releaseCapabilityValid');
          if(s.businessContentRead!==false) failed.push('businessContentRead');
          if(failed.length) {
            console.error(`failedChecks=${failed.join(',')}`);
            throw new Error('COMUN_48_3_C1_BLOCKED_REMOTE_SCHEMA_DRIFT');
          }
          NODE
      - name: Prove remote migration plan is empty
        if: env.COMUN_MIGRATION_LANE_MODE != 'not_applicable'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci/readonly-reconciled-migration-plan.node-test.mjs
          node scripts/ci/readonly-reconciled-migration-plan.mjs .ci-artifacts/48-3-c1-preflight/plan.txt
          echo migrationCount=0 >> "$GITHUB_STEP_SUMMARY"
          echo COMUN_48_3_C1_REMOTE_PLAN_EMPTY_GREEN >> "$GITHUB_STEP_SUMMARY"
