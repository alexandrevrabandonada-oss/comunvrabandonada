name: COMUN Sidewalk Activate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a fixed read-only preflight, environment diagnostic, migration, or separately authorized public activation.
        required: true
        type: choice
        default: preflight
        options:
          [
            preflight,
            vercel-preflight,
            operational-env-preflight,
            protected-deployment-preflight,
            protected-operational-diagnostic,
            migrate,
            activate,
          ]
      expected_main_sha:
        description: Immutable commit already integrated into main.
        required: true
        type: string
      release_id:
        description: Fixed sidewalk release evaluated by this workflow.
        required: true
        default: 20260724233256-comun-sidewalk-operational-hardening
        type: string
      contract_id:
        description: Fixed, allowlisted scoped promotion contract.
        required: true
        default: sidewalk-operational-safer-pre-v2
        type: string
      authorization:
        description: Empty for preflight; exact and mode-specific for migrate or activate.
        required: false
        default: ""
        type: string
      activation_attempt_id:
        description: Immutable, single-use identifier for an activation attempt.
        required: false
        default: ""
        type: string

concurrency:
  group: comun-sidewalk-operational-${{ inputs.mode }}-${{ inputs.expected_main_sha }}-${{ inputs.activation_attempt_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-24.04
    outputs:
      contract_hash: ${{ steps.contract.outputs.contract_hash }}
      ledger_hash: ${{ steps.contract.outputs.ledger_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - name: Require immutable main SHA, release, and fixed contract
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONTRACT_ID: ${{ inputs.contract_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_MAIN_SHA"
          test "$RELEASE_ID" = "20260724233256-comun-sidewalk-operational-hardening"
          test "$CONTRACT_ID" = "sidewalk-operational-safer-pre-v2"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - id: contract
        name: Validate the fixed scoped promotion contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { createHash } from "node:crypto";
          import { selectScopedPromotionContract } from "./scripts/solo/sidewalk-scoped-promotion-contract.mjs";
          const { contract, contractHash } = selectScopedPromotionContract();
          const ledgerHash = createHash("sha256")
            .update(JSON.stringify(contract.expectedLedger))
            .digest("hex");
          console.log(`contract_hash=${contractHash}`);
          console.log(`ledger_hash=${ledgerHash}`);
          NODE

  vercel-preflight:
    if: inputs.mode == 'vercel-preflight'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify protected Vercel access with one read-only project request
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token_present=false
          team_present=false
          project_present=false
          [[ -n "$VERCEL_TOKEN" ]] && token_present=true
          [[ -n "$VERCEL_ORG_ID" ]] && team_present=true
          [[ -n "$VERCEL_PROJECT_ID" ]] && project_present=true
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "COMUN_VERCEL_PREFLIGHT token_present=$token_present team_present=$team_present project_present=$project_present" >> "$GITHUB_STEP_SUMMARY"
            echo COMUN_TIJOLO_45_3G_VERCEL_CONFIGURATION_MISMATCH >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          team_match=false
          project_match=false
          [[ "$VERCEL_ORG_ID" = "team_LBVwyK8FQMO7tA3hzVXXeumF" ]] && team_match=true
          [[ "$VERCEL_PROJECT_ID" = "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X" ]] && project_match=true
          if [[ "$VERCEL_ORG_ID" != "team_LBVwyK8FQMO7tA3hzVXXeumF" || "$VERCEL_PROJECT_ID" != "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X" ]]; then
            echo "COMUN_VERCEL_PREFLIGHT team_match=$team_match project_match=$project_match" >> "$GITHUB_STEP_SUMMARY"
            echo COMUN_TIJOLO_45_3G_VERCEL_CONFIGURATION_MISMATCH >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          umask 077
          project_json="$(mktemp)"
          curl_error="$(mktemp)"
          chmod 600 "$project_json" "$curl_error"
          trap 'rm -f "$project_json" "$curl_error"' EXIT
          set +e
          status="$(
            curl \
              --silent \
              --show-error \
              --output "$project_json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
              2>"$curl_error"
          )"
          curl_exit=$?
          set -e
          if ((curl_exit != 0)); then
            echo "COMUN_VERCEL_PREFLIGHT transport=failed http_status=not_available" >> "$GITHUB_STEP_SUMMARY"
            echo COMUN_VERCEL_PREFLIGHT_TRANSPORT_FAILED >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$status" != "200" ]]; then
            echo "COMUN_VERCEL_PREFLIGHT http_status=$status project_id_match=not_checked account_match=not_checked project_name_match=not_checked" >> "$GITHUB_STEP_SUMMARY"
            echo COMUN_TIJOLO_45_3G_VERCEL_ACCESS_STILL_BLOCKED >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          PROJECT_JSON="$project_json" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const fail = (marker) => {
            console.error(marker);
            process.exit(1);
          };

          try {
            const responsePath = process.env.PROJECT_JSON;

            if (!responsePath) {
              fail("COMUN_VERCEL_PREFLIGHT_RESPONSE_PATH_MISSING");
            }

            const project = JSON.parse(await readFile(responsePath, "utf8"));
            const matches = {
              projectId: project.id === "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X",
              account: project.accountId === "team_LBVwyK8FQMO7tA3hzVXXeumF",
              name: project.name === "comunvrabandonada",
            };

            if (!Object.values(matches).every(Boolean)) {
              fail("COMUN_TIJOLO_45_3G_VERCEL_CONFIGURATION_MISMATCH");
            }

            console.log(
              "COMUN_VERCEL_PREFLIGHT http_status=200 project_id_match=true account_match=true project_name_match=true",
            );
          } catch {
            fail("COMUN_VERCEL_PREFLIGHT_RESPONSE_INVALID");
          }
          NODE
          echo COMUN_VERCEL_PROTECTED_ACCESS_READ_GREEN >> "$GITHUB_STEP_SUMMARY"

  operational-env-preflight:
    if: inputs.mode == 'operational-env-preflight'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
      - name: Inventory production environment metadata without reading values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          node scripts/solo/fetch-vercel-operational-env-metadata.mjs
          helper_exit=$?
          set -e
          classification="$(node -e "process.stdout.write(require('./.ci-artifacts/sidewalk-operational-env/classification.json').classification)")"
          echo "COMUN_SIDEWALK_OPERATIONAL_ENV_ACCESS $classification" >> "$GITHUB_STEP_SUMMARY"
          if ((helper_exit != 0)); then exit "$helper_exit"; fi
          echo COMUN_SIDEWALK_OPERATIONAL_ENV_PREFLIGHT_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized operational environment inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-operational-env-inventory-${{ inputs.expected_main_sha }}-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-operational-env/
          if-no-files-found: error
          retention-days: 14

  protected-operational-diagnostic:
    if: inputs.mode == 'protected-operational-diagnostic'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read protected deployment diagnostic and classify without changing Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          COMUN_SIDEWALK_OPERATIONAL_ENV_ARTIFACT_DIRECTORY: .ci-artifacts/sidewalk-operational-diagnostic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          deployment_json="$(mktemp)"
          curl_error="$(mktemp)"
          probe_output="$(mktemp)"
          chmod 600 "$deployment_json" "$curl_error" "$probe_output"
          trap 'rm -f "$deployment_json" "$curl_error" "$probe_output"' EXIT
          set +e
          node scripts/solo/fetch-vercel-operational-env-metadata.mjs
          metadata_exit=$?
          deployment_status="$(
            curl --silent --show-error --output "$deployment_json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=20" \
              2>>"$curl_error"
          )"
          deployment_exit=$?
          set -e
          if ((metadata_exit != 0)) || ((deployment_exit != 0)) || [[ "$deployment_status" != "200" ]]; then
            echo COMUN_SIDEWALK_OPERATIONAL_DIAGNOSTIC_ACCESS_FAILED >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          deployment_url="$(DEPLOYMENT_JSON="$deployment_json" EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const expectedHost = /^comunvrabandonada-[a-z0-9-]+-alexandrevrabandonada-oss-projects\.vercel\.app$/;
          const payload = JSON.parse(await readFile(process.env.DEPLOYMENT_JSON, "utf8"));
          const deployments = Array.isArray(payload.deployments) ? payload.deployments : [];
          const matches = deployments
            .filter((deployment) => deployment?.state === "READY")
            .filter((deployment) => deployment?.target === "production")
            .filter((deployment) => deployment?.meta?.githubCommitSha === process.env.EXPECTED_MAIN_SHA)
            .map((deployment) => {
              const candidate = String(deployment.url ?? "");
              const url = new URL(candidate.startsWith("https://") ? candidate : `https://${candidate}`);
              if (url.protocol !== "https:" || url.pathname !== "/" || !expectedHost.test(url.hostname)) return null;
              return { url: url.origin, createdAt: Number(deployment.createdAt ?? 0) };
            })
            .filter(Boolean)
            .sort((left, right) => right.createdAt - left.createdAt);
          if (matches.length === 0) process.exit(1);
          process.stdout.write(matches[0].url);
          NODE
          )" || {
            echo PROTECTED_OPERATIONAL_DIAGNOSTIC_DEPLOYMENT_NOT_FOUND >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          node scripts/solo/probe-protected-vercel-deployment.mjs \
            --deployment-url="$deployment_url" \
            --operational-diagnostic > "$probe_output"
          PROBE_OUTPUT="$probe_output" node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          const raw = await readFile(process.env.PROBE_OUTPUT, "utf8");
          const line = raw.trim().split(/\r?\n/).at(-1);
          const diagnostic = JSON.parse(line);
          const keys = ["formatVersion", "flag", "databaseUrl", "database", "ledger", "operationalState"];
          if (JSON.stringify(Object.keys(diagnostic).sort()) !== JSON.stringify(keys.sort())) process.exit(1);
          const output = ".ci-artifacts/sidewalk-operational-diagnostic/runtime-diagnostic.json";
          await mkdir(path.dirname(output), { recursive: true });
          await writeFile(output, `${JSON.stringify(diagnostic, null, 2)}\n`, "utf8");
          NODE
          node scripts/solo/classify-sidewalk-operational-gate.mjs \
            --inventory=.ci-artifacts/sidewalk-operational-diagnostic/inventory.json \
            --diagnostic=.ci-artifacts/sidewalk-operational-diagnostic/runtime-diagnostic.json \
            --output=.ci-artifacts/sidewalk-operational-diagnostic/classification.json
          node scripts/solo/render-sidewalk-operational-gate-report.mjs \
            --inventory=.ci-artifacts/sidewalk-operational-diagnostic/inventory.json \
            --diagnostic=.ci-artifacts/sidewalk-operational-diagnostic/runtime-diagnostic.json \
            --output-directory=.ci-artifacts/sidewalk-operational-diagnostic \
            --main-sha="$EXPECTED_MAIN_SHA"
          echo PROTECTED_OPERATIONAL_DIAGNOSTIC_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized protected operational diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-protected-operational-diagnostic-${{ inputs.expected_main_sha }}-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-operational-diagnostic
          if-no-files-found: error
          retention-days: 14

  protected-deployment-preflight:
    if: inputs.mode == 'protected-deployment-preflight'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe the latest protected rollback deployment read-only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "team_LBVwyK8FQMO7tA3hzVXXeumF"
          test "$VERCEL_PROJECT_ID" = "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X"
          umask 077
          deployment_json="$(mktemp)"
          curl_error="$(mktemp)"
          chmod 600 "$deployment_json" "$curl_error"
          trap 'rm -f "$deployment_json" "$curl_error"' EXIT
          set +e
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output "$deployment_json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&state=READY&limit=20" \
              2>"$curl_error"
          )"
          curl_exit=$?
          set -e
          if ((curl_exit != 0)) || [[ "$http_status" != "200" ]]; then
            echo PROTECTED_DEPLOYMENT_ACCESS_FAILED >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          deployment_url="$(DEPLOYMENT_JSON="$deployment_json" EXPECTED_MAIN_SHA="$EXPECTED_MAIN_SHA" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const expectedHost = /^comunvrabandonada-[a-z0-9-]+-alexandrevrabandonada-oss-projects\.vercel\.app$/;
          const payload = JSON.parse(await readFile(process.env.DEPLOYMENT_JSON, "utf8"));
          const deployments = Array.isArray(payload.deployments) ? payload.deployments : [];
          const matches = deployments
            .filter((deployment) => deployment?.state === "READY")
            .filter((deployment) => deployment?.target === "production")
            .filter((deployment) => deployment?.meta?.githubCommitSha === process.env.EXPECTED_MAIN_SHA)
            .map((deployment) => {
              const candidate = String(deployment.url ?? "");
              const url = new URL(candidate.startsWith("https://") ? candidate : `https://${candidate}`);
              if (url.protocol !== "https:" || url.pathname !== "/" || !expectedHost.test(url.hostname)) return null;
              return { url: url.origin, createdAt: Number(deployment.createdAt ?? 0) };
            })
            .filter(Boolean)
            .sort((left, right) => right.createdAt - left.createdAt);
          if (matches.length === 0) process.exit(1);
          process.stdout.write(matches[0].url);
          NODE
          )" || {
            echo PROTECTED_DEPLOYMENT_RESPONSE_INVALID >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          node scripts/solo/probe-protected-vercel-deployment.mjs \
            --deployment-url="$deployment_url" \
            --route="/comun/mapa/contribuir?origem=calcadas&comun_probe=readonly-preflight" \
            --expected-state=paused
          echo COMUN_PROTECTED_DEPLOYMENT_READONLY_PREFLIGHT_GREEN >> "$GITHUB_STEP_SUMMARY"

  preflight:
    if: inputs.mode == 'preflight' || inputs.mode == 'migrate'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate migration and scoped contract without remote writes
        run: |
          npm run solo:sql:validate -- --release-manifest=supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          node --input-type=module -e "import('./scripts/solo/sidewalk-scoped-promotion-contract.mjs').then(({selectScopedPromotionContract}) => selectScopedPromotionContract())"
      - name: Remote read-only scoped PRE and absent ledger preflight
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/sidewalk-preflight
          node scripts/solo/apply-forward-only.mjs --read-only-preflight --security-diagnostic-output=.ci-artifacts/sidewalk-preflight/security-diagnostic.json | tee .ci-artifacts/sidewalk-preflight/preflight.txt
          grep -Fx "COMUN_CANONICAL_RELEASE_LEDGER_STATE ABSENT" .ci-artifacts/sidewalk-preflight/preflight.txt
          node scripts/solo/assert-sanitized-security-diagnostic.mjs --input=.ci-artifacts/sidewalk-preflight/security-diagnostic.json
          echo COMUN_CALCADAS_REMOTE_READONLY_PREFLIGHT_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm public contribution remains paused by read-only HTTP
        run: node scripts/solo/assert-sidewalk-public-paused.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-scoped-preflight-${{ inputs.expected_main_sha }}-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-preflight
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  migrate:
    if: inputs.mode == 'migrate'
    needs: [validate-input, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact migration authorization after this SHA's preflight
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONTRACT_HASH: ${{ needs.validate-input.outputs.contract_hash }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "AUTORIZO_MIGRATION_CALCADAS_${PROJECT_REF}_${EXPECTED_MAIN_SHA}_${CONTRACT_HASH}_MANTER_FLAG_DESABILITADA"
      - name: Apply only the scoped, validated migration
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs
      - name: Verify scoped POST and exact ledger without further writes
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs --read-only-postflight
      - name: Confirm public contribution remains paused
        run: node scripts/solo/assert-sidewalk-public-paused.mjs

  postflight:
    if: inputs.mode == 'activate'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify existing scoped POST and exact ledger read-only
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs --read-only-postflight

  activate:
    if: inputs.mode == 'activate'
    needs: [validate-input, postflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - name: Activate only after deployment and alias readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
          AUTHORIZATION: ${{ inputs.authorization }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          LEDGER_HASH: ${{ needs.validate-input.outputs.ledger_hash }}
          ACTIVATION_ATTEMPT_ID: ${{ inputs.activation_attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          started_at="$SECONDS"
          temporary_files=()
          event_directory=".ci-artifacts/sidewalk-activation"
          event_file="$event_directory/events.txt"
          duration_file="$event_directory/duration-seconds.txt"
          mkdir -p "$event_directory"
          : > "$event_file"

          record_event() {
            printf '%s=%s\n' "$1" "$2" >> "$event_file"
          }

          cleanup() {
            rm -f "${temporary_files[@]:-}"
            printf '%s\n' "$((SECONDS - started_at))" > "$duration_file"
          }

          trap cleanup EXIT

          state() {
            printf '%s timestamp=%s duration_seconds=%s\n' \
              "$1" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$((SECONDS - started_at))" \
              >> "$GITHUB_STEP_SUMMARY"
            record_event state "$1"
          }

          marker() {
            printf '%s timestamp=%s duration_seconds=%s\n' \
              "$1" \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "$((SECONDS - started_at))" \
              >> "$GITHUB_STEP_SUMMARY"
            record_event marker "$1"
          }

          new_capture_file() {
            CAPTURE_FILE="$(mktemp)"
            chmod 600 "$CAPTURE_FILE"
            temporary_files+=("$CAPTURE_FILE")
          }

          run_vercel_env() {
            local value="$1"
            local output error env_exit
            new_capture_file
            output="$CAPTURE_FILE"
            new_capture_file
            error="$CAPTURE_FILE"
            set +e
            printf '%s' "$value" | npx --yes vercel@50.28.0 env add COMUN_SIDEWALK_OPERATIONAL_V2 production --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$error"
            env_exit="${PIPESTATUS[1]}"
            set -e
            return "$env_exit"
          }

          capture_deployment() {
            local phase="$1"
            local output error deploy_exit
            new_capture_file
            output="$CAPTURE_FILE"
            new_capture_file
            error="$CAPTURE_FILE"
            set +e
            npx --yes vercel@50.28.0 --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$error"
            deploy_exit="$?"
            set -e
            if ((deploy_exit != 0)); then
              marker SOLO_ACTIVATION_DEPLOYMENT_COMMAND_FAILED
              return "$deploy_exit"
            fi
            DEPLOYMENT_URL="$(DEPLOYMENT_STDOUT="$output" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const output = await readFile(process.env.DEPLOYMENT_STDOUT, "utf8");
          const urls = [...new Set(output.match(/https:\/\/comunvrabandonada(?:-[a-z0-9-]+)?\.vercel\.app\/?/gi) ?? [])]
            .map((candidate) => new URL(candidate).origin)
            .filter((candidate) => new URL(candidate).hostname !== "comunvrabandonada.vercel.app");

          if (urls.length !== 1) process.exit(1);
          const deployment = new URL(urls[0]);
          if (
            deployment.protocol !== "https:" ||
            deployment.hostname === "comunvrabandonada.vercel.app" ||
            !deployment.hostname.endsWith("-alexandrevrabandonada-oss-projects.vercel.app") ||
            !deployment.hostname.startsWith("comunvrabandonada-") ||
            deployment.username ||
            deployment.password ||
            deployment.search ||
            deployment.hash
          ) {
            process.exit(1);
          }

          process.stdout.write(deployment.origin);
          NODE
            )" || {
              marker SOLO_ACTIVATION_DEPLOYMENT_URL_INVALID
              return 1
            }
          if [[ "$phase" = "activation" ]]; then
            marker SOLO_ACTIVATION_DEPLOYMENT_CREATED
            state DEPLOYMENT_CREATED
          else
            marker SOLO_ACTIVATION_ROLLBACK_DEPLOYMENT_CREATED
            state ROLLBACK_DEPLOYMENT_CREATED
          fi
          return 0
          }

          inspect_deployment() {
            local phase="$1"
            local output error inspect_exit
            new_capture_file
            output="$CAPTURE_FILE"
            new_capture_file
            error="$CAPTURE_FILE"
            set +e
            timeout 300s npx --yes vercel@50.28.0 inspect "$DEPLOYMENT_URL" --wait --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >"$output" 2>"$error"
            inspect_exit="$?"
            set -e
            if ((inspect_exit != 0)); then
              marker SOLO_ACTIVATION_DEPLOYMENT_NOT_READY
              return "$inspect_exit"
            fi
            if [[ "$phase" = "activation" ]]; then
              marker SOLO_ACTIVATION_DEPLOYMENT_READY
              state DEPLOYMENT_READY
            else
              marker SOLO_ACTIVATION_ROLLBACK_DEPLOYMENT_INSPECT_READY
            fi
          }

          record_monitor_states() {
            local output="$1"
            while IFS= read -r observed; do
              case "$observed" in
                SOLO_ACTIVATION_DEPLOYMENT_FLAG_VISIBLE)
                  marker "$observed"
                  state DEPLOYMENT_FLAG_VISIBLE
                  ;;
                SOLO_ACTIVATION_CANONICAL_ALIAS_READY)
                  marker "$observed"
                  state ALIAS_READY
                  ;;
                SOLO_ACTIVATION_FUNCTIONAL_SMOKE_GREEN)
                  marker "$observed"
                  state FUNCTIONAL_SMOKE_GREEN
                  ;;
                SOLO_ACTIVATION_FUNCTIONAL_SMOKE_FAILED)
                  marker "$observed"
                  ;;
                SOLO_ACTIVATION_MONITOR_GREEN)
                  marker "$observed"
                  state MONITOR_GREEN
                  ;;
                SOLO_ACTIVATION_ROLLBACK_DEPLOYMENT_READY)
                  marker "$observed"
                  state ROLLBACK_DEPLOYMENT_READY
                  ;;
                SOLO_ACTIVATION_ROLLBACK_ALIAS_READY)
                  marker "$observed"
                  state ROLLBACK_ALIAS_PAUSED
                  ;;
                SOLO_ACTIVATION_ROLLBACK_GREEN)
                  marker "$observed"
                  state ROLLBACK_GREEN
                  ;;
                SOLO_ACTIVATION_DEPLOYMENT_FLAG_NOT_READY|SOLO_ACTIVATION_ALIAS_PROPAGATION_TIMEOUT|SOLO_ACTIVATION_MONITOR_FAILED_UNKNOWN_SUBPHASE)
                  marker "$observed"
                  ;;
              esac
            done < <(grep -E '^SOLO_ACTIVATION_(DEPLOYMENT_FLAG_VISIBLE|CANONICAL_ALIAS_READY|FUNCTIONAL_SMOKE_GREEN|FUNCTIONAL_SMOKE_FAILED|MONITOR_GREEN|ROLLBACK_DEPLOYMENT_READY|ROLLBACK_ALIAS_READY|ROLLBACK_GREEN|DEPLOYMENT_FLAG_NOT_READY|ALIAS_PROPAGATION_TIMEOUT|MONITOR_FAILED_UNKNOWN_SUBPHASE)$' "$output" || true)
          }

          run_activation_monitor() {
            local output error monitor_exit
            new_capture_file
            output="$CAPTURE_FILE"
            new_capture_file
            error="$CAPTURE_FILE"
            set +e
            node scripts/solo/monitor-production.mjs --minutes=2 --domain=comunvrabandonada.vercel.app --deployment-url="$DEPLOYMENT_URL" --readiness-minutes=5 --poll-seconds=10 --require-consecutive=2 --activation >"$output" 2>"$error"
            monitor_exit="$?"
            set -e
            record_monitor_states "$output"
            if ((monitor_exit != 0)) && ! grep -Eq '^SOLO_ACTIVATION_(DEPLOYMENT_FLAG_NOT_READY|ALIAS_PROPAGATION_TIMEOUT|FUNCTIONAL_SMOKE_FAILED)$' "$output"; then
              marker SOLO_ACTIVATION_MONITOR_FAILED_UNKNOWN_SUBPHASE
            fi
            return "$monitor_exit"
          }

          run_rollback_readiness() {
            local output error rollback_exit
            new_capture_file
            output="$CAPTURE_FILE"
            new_capture_file
            error="$CAPTURE_FILE"
            set +e
            node scripts/solo/monitor-production.mjs --domain=comunvrabandonada.vercel.app --deployment-url="$DEPLOYMENT_URL" --readiness-minutes=5 --poll-seconds=10 --require-consecutive=2 --rollback-readiness >"$output" 2>"$error"
            rollback_exit="$?"
            set -e
            record_monitor_states "$output"
            return "$rollback_exit"
          }

          rollback() {
            state ROLLBACK_ATTEMPTED
            if ! run_vercel_env disabled; then
              marker SOLO_ACTIVATION_ROLLBACK_FLAG_COMMAND_FAILED
              return 1
            fi
            state ROLLBACK_FLAG_DISABLED
            if ! capture_deployment rollback; then
              return 1
            fi
            if ! inspect_deployment rollback; then
              return 1
            fi
            if ! run_rollback_readiness; then
              return 1
            fi
            state ROLLBACK_COMPLETE
          }

          if [[ ! "$ACTIVATION_ATTEMPT_ID" =~ ^sidewalk-activate-[0-9]{8}-[0-9]{2}$ ]]; then
            marker SOLO_ACTIVATION_AUTHORIZATION_INVALID
            exit 1
          fi
          if [[ "$AUTHORIZATION" != "AUTORIZO_ATIVAR_CALCADAS_${PROJECT_REF}_${EXPECTED_MAIN_SHA}_${LEDGER_HASH}_${ACTIVATION_ATTEMPT_ID}" ]]; then
            marker SOLO_ACTIVATION_AUTHORIZATION_INVALID
            exit 1
          fi
          node scripts/solo/assert-sidewalk-public-paused.mjs
          state FLAG_DISABLED_INITIAL
          if ! run_vercel_env enabled; then
            marker SOLO_ACTIVATION_FLAG_ENABLE_FAILED
            exit 1
          fi
          state FLAG_ENABLED
          if capture_deployment activation && inspect_deployment activation && run_activation_monitor; then
            state ACTIVATION_GREEN
            exit 0
          fi

          activation_exit=1
          if ! rollback; then
            marker SOLO_ACTIVATION_ROLLBACK_FAILED
          fi
          exit "$activation_exit"
      - name: Confirm a failed activation returned to paused public state
        if: failure()
        env:
          ACTIVATION_EVENTS: .ci-artifacts/sidewalk-activation/events.txt
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/solo/assert-sidewalk-public-paused.mjs; then
            printf 'state=FINAL_PUBLIC_PAUSED\n' >> "$ACTIVATION_EVENTS"
          else
            printf 'state=FINAL_PUBLIC_UNSAFE\n' >> "$ACTIVATION_EVENTS"
            exit 1
          fi
      - name: Emit one sanitized terminal activation result
        if: always()
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RUN_ID: ${{ github.run_id }}
          ACTIVATION_ATTEMPT_ID: ${{ inputs.activation_attempt_id }}
        shell: bash
        run: |
          set -euo pipefail
          event_directory=".ci-artifacts/sidewalk-activation"
          event_file="$event_directory/events.txt"
          mkdir -p "$event_directory"
          if [[ ! -f "$event_file" ]]; then
            printf 'marker=SOLO_ACTIVATION_AUTHORIZATION_INVALID\nstate=FINAL_PUBLIC_PAUSED\n' > "$event_file"
          fi
          duration_seconds=0
          if [[ -f "$event_directory/duration-seconds.txt" ]]; then
            duration_seconds="$(< "$event_directory/duration-seconds.txt")"
          fi
          [[ "$duration_seconds" =~ ^[0-9]+$ ]] || duration_seconds=0
          node scripts/solo/activation-result.mjs \
            --events="$event_file" \
            --output-dir="$event_directory/result" \
            --expected-main-sha="$EXPECTED_MAIN_SHA" \
            --run-id="$RUN_ID" \
            --attempt-id="$ACTIVATION_ATTEMPT_ID" \
            --duration-seconds="$duration_seconds" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-activation-${{ inputs.expected_main_sha }}-${{ inputs.activation_attempt_id }}-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-activation/result
          if-no-files-found: error
          retention-days: 14
