name: COMUN Sidewalk Activate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a read-only preflight or the explicitly authorized activation.
        required: true
        type: choice
        default: preflight
        options: [preflight, activate]
      expected_main_sha:
        description: Immutable commit already integrated into main.
        required: true
        type: string
      release_id:
        description: Release being evaluated.
        required: true
        default: 20260724233256-comun-sidewalk-operational-hardening
        type: string
      authorization:
        description: Required only for mode=activate.
        required: false
        default: ""
        type: string

concurrency:
  group: comun-sidewalk-operational-activation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the immutable SHA to belong to main
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_ID" = "20260724233256-comun-sidewalk-operational-hardening"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - name: Validate the target release package without remote access
        run: npm run solo:sql:validate -- --release-manifest=supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
      - name: Canonical remote read-only preflight
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/solo/apply-forward-only.mjs --read-only-preflight
          echo COMUN_CALCADAS_REMOTE_READONLY_PREFLIGHT_GREEN >> "$GITHUB_STEP_SUMMARY"

  activate:
    if: inputs.mode == 'activate'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require the exact human authorization before any write
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "AUTORIZO_CALCADAS_20260724233256"
          test "$RELEASE_ID" = "20260724233256-comun-sidewalk-operational-hardening"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - name: Apply only the validated target migration in its forward-only transaction
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs
      - name: Enable the operational gate after the exact ledger is green
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' enabled | npx --yes vercel@50.28.0 env add COMUN_SIDEWALK_OPERATIONAL_V2 production --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          npx --yes vercel@50.28.0 --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
      - name: Smoke and fail closed if it fails
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          node scripts/solo/monitor-production.mjs --minutes=2 --domain=comunvrabandonada.vercel.app
          status=$?
          set -e
          if ((status != 0)); then
            printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_SIDEWALK_OPERATIONAL_V2 production --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
            npx --yes vercel@50.28.0 --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
            exit "$status"
          fi
          echo COMUN_CALCADAS_OPERATIONAL_ACTIVATION_GREEN >> "$GITHUB_STEP_SUMMARY"
