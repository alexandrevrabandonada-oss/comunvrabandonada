name: COMUN Sidewalk Activate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the separately authorized database preflight, Vercel read-only preflight, migration, or public activation.
        required: true
        type: choice
        default: preflight
        options: [preflight, vercel-preflight, migrate, activate]
      expected_main_sha:
        description: Immutable commit already integrated into main.
        required: true
        type: string
      release_id:
        description: Fixed sidewalk release evaluated by this workflow.
        required: true
        default: 20260724233256-comun-sidewalk-operational-hardening
        type: string
      contract_id:
        description: Fixed, allowlisted scoped promotion contract.
        required: true
        default: sidewalk-operational-safer-pre-v2
        type: string
      authorization:
        description: Empty for preflight; exact and mode-specific for migrate or activate.
        required: false
        default: ""
        type: string

concurrency:
  group: comun-sidewalk-operational-${{ inputs.mode }}-${{ inputs.expected_main_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-input:
    runs-on: ubuntu-24.04
    outputs:
      contract_hash: ${{ steps.contract.outputs.contract_hash }}
      ledger_hash: ${{ steps.contract.outputs.ledger_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - name: Require immutable main SHA, release, and fixed contract
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          CONTRACT_ID: ${{ inputs.contract_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_MAIN_SHA"
          test "$RELEASE_ID" = "20260724233256-comun-sidewalk-operational-hardening"
          test "$CONTRACT_ID" = "sidewalk-operational-safer-pre-v2"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - id: contract
        name: Validate the fixed scoped promotion contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import { createHash } from "node:crypto";
          import { selectScopedPromotionContract } from "./scripts/solo/sidewalk-scoped-promotion-contract.mjs";
          const { contract, contractHash } = selectScopedPromotionContract();
          const ledgerHash = createHash("sha256")
            .update(JSON.stringify(contract.expectedLedger))
            .digest("hex");
          console.log(`contract_hash=${contractHash}`);
          console.log(`ledger_hash=${ledgerHash}`);
          NODE

  vercel-preflight:
    if: inputs.mode == 'vercel-preflight'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify protected Vercel access with one read-only project request
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "team_LBVwyK8FQMO7tA3hzVXXeumF"
          test "$VERCEL_PROJECT_ID" = "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X"
          project_json="$(mktemp)"
          trap 'rm -f "$project_json"' EXIT
          status="$(curl --silent --show-error --output "$project_json" --write-out '%{http_code}' --header "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          test "$status" = "200"
          node --input-type=module -- "$project_json" <<'NODE'
          import { readFile } from "node:fs/promises";

          const project = JSON.parse(await readFile(process.argv.at(-1), "utf8"));
          const matches = {
            projectId: project.id === "prj_BNUDaIwZKzt7IQ1PZUjo8c6Ljc3X",
            account: project.accountId === "team_LBVwyK8FQMO7tA3hzVXXeumF",
            name: project.name === "comunvrabandonada",
          };
          if (!Object.values(matches).every(Boolean)) {
            throw new Error("COMUN_TIJOLO_45_3G_VERCEL_CONFIGURATION_MISMATCH");
          }
          console.log("COMUN_VERCEL_PREFLIGHT http_status=200 project_id_match=true account_match=true project_name_match=true");
          NODE
          echo COMUN_VERCEL_PROTECTED_ACCESS_READ_GREEN >> "$GITHUB_STEP_SUMMARY"

  preflight:
    if: inputs.mode == 'preflight' || inputs.mode == 'migrate'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate migration and scoped contract without remote writes
        run: |
          npm run solo:sql:validate -- --release-manifest=supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          node --input-type=module -e "import('./scripts/solo/sidewalk-scoped-promotion-contract.mjs').then(({selectScopedPromotionContract}) => selectScopedPromotionContract())"
      - name: Remote read-only scoped PRE and absent ledger preflight
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/sidewalk-preflight
          node scripts/solo/apply-forward-only.mjs --read-only-preflight --security-diagnostic-output=.ci-artifacts/sidewalk-preflight/security-diagnostic.json | tee .ci-artifacts/sidewalk-preflight/preflight.txt
          grep -Fx "COMUN_CANONICAL_RELEASE_LEDGER_STATE ABSENT" .ci-artifacts/sidewalk-preflight/preflight.txt
          node scripts/solo/assert-sanitized-security-diagnostic.mjs --input=.ci-artifacts/sidewalk-preflight/security-diagnostic.json
          echo COMUN_CALCADAS_REMOTE_READONLY_PREFLIGHT_GREEN >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm public contribution remains paused by read-only HTTP
        run: node scripts/solo/assert-sidewalk-public-paused.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: comun-sidewalk-scoped-preflight-${{ inputs.expected_main_sha }}-${{ github.run_id }}
          path: .ci-artifacts/sidewalk-preflight
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  migrate:
    if: inputs.mode == 'migrate'
    needs: [validate-input, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact migration authorization after this SHA's preflight
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONTRACT_HASH: ${{ needs.validate-input.outputs.contract_hash }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "AUTORIZO_MIGRATION_CALCADAS_${PROJECT_REF}_${EXPECTED_MAIN_SHA}_${CONTRACT_HASH}_MANTER_FLAG_DESABILITADA"
      - name: Apply only the scoped, validated migration
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs
      - name: Verify scoped POST and exact ledger without further writes
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs --read-only-postflight
      - name: Confirm public contribution remains paused
        run: node scripts/solo/assert-sidewalk-public-paused.mjs

  postflight:
    if: inputs.mode == 'activate'
    needs: validate-input
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify existing scoped POST and exact ledger read-only
        env:
          COMUN_RELEASE_MANIFEST: supabase/releases/20260724233256-comun-sidewalk-operational-hardening-safer-pre-v2.json
          PR23_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PR23_ALLOWED_PROJECT_REFS: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/solo/apply-forward-only.mjs --read-only-postflight

  activate:
    if: inputs.mode == 'activate'
    needs: [validate-input, postflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0
      - name: Require exact activation authorization after read-only POST verification
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          LEDGER_HASH: ${{ needs.validate-input.outputs.ledger_hash }}
        shell: bash
        run: |
          set -euo pipefail
          test "$AUTHORIZATION" = "AUTORIZO_ATIVAR_CALCADAS_${PROJECT_REF}_${EXPECTED_MAIN_SHA}_${LEDGER_HASH}"
      - name: Enable operational gate only after migration and ledger are already green
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' enabled | npx --yes vercel@50.28.0 env add COMUN_SIDEWALK_OPERATIONAL_V2 production --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          npx --yes vercel@50.28.0 --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
      - name: Smoke and disable the operational gate if activation fails
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CANONICAL_PROJECT_ID }}
        shell: bash
        run: |
          set +e
          node scripts/solo/monitor-production.mjs --minutes=2 --domain=comunvrabandonada.vercel.app
          status=$?
          set -e
          if ((status != 0)); then
            printf '%s' disabled | npx --yes vercel@50.28.0 env add COMUN_SIDEWALK_OPERATIONAL_V2 production --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
            npx --yes vercel@50.28.0 --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
            exit "$status"
          fi
          echo COMUN_CALCADAS_OPERATIONAL_ACTIVATION_GREEN >> "$GITHUB_STEP_SUMMARY"
